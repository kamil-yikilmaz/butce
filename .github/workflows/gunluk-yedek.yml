name: Günlük Veritabanı Yedeği

on:
  schedule:
    # Her gece Türkiye saatiyle 00:00'da (UTC 21:00) çalışır
    - cron: '0 21 * * *'
  workflow_dispatch: # GitHub Actions arayüzündeki "Run workflow" butonu ile elle anında çalıştırabilme

jobs:
  yedekle-ve-gonder:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Depoyu Çek
        uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Tarih Bilgisini Belirle
        id: tarih
        run: echo "bugun=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: TCMB Kurlarını Güncelle (Efektif Alış)
        run: |
          node scripts/guncelle-kurlar.js || echo "Kur guncelleme atlaniyor"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kurlar.json
          git commit -m "chore: Gunluk TCMB kurlari guncellendi [skip ci]" || echo "Degisiklik yok"
          git push || echo "Push atlaniyor"

      - name: Supabase Veritabanından Yedeği Al
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/yedekle.js

      - name: Yedeği GitHub Artifact Olarak Sakla (90 Gün)
        uses: actions/upload-artifact@v4
        with:
          name: butce-yedek-${{ steps.tarih.outputs.bugun }}
          path: butce-yedek-*.json
          retention-days: 90

      - name: E-Posta ile Yedeği Gönder
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "📊 Bütçe Defteri Günlük Yedeği (${{ steps.tarih.outputs.bugun }})"
          body: |
            Merhaba,

            Bütçe ve Birikim Defteri uygulamanızın günlük otomatik veritabanı yedeği ekte yer almaktadır.

            Tarih: ${{ steps.tarih.outputs.bugun }}
            Dosya: butce-yedek-${{ steps.tarih.outputs.bugun }}.json

            Olası bir durumda bu dosyayı uygulamanızın altındaki "Yedeği yükle" butonundan tek tıkla geri yükleyebilirsiniz.
          to: ${{ secrets.MAIL_USERNAME }}
          from: "Bütçe Yedek Botu <${{ secrets.MAIL_USERNAME }}>"
          attachments: butce-yedek-${{ steps.tarih.outputs.bugun }}.json
