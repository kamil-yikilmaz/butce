  }).catch(function(e){
    if(w){ try{ w.close(); }catch(e2){} }
    sheetMsg("Dekont açılamadı: "+(e&&e.message||""));
  });
}
function openFile(id){
  var w=null;
  try{ w=window.open("","_blank"); }catch(e){}
  idbGet(id).then(function(rec){
    if(!rec||!rec.blob){ if(w){ try{w.close();}catch(e){} } sheetMsg("Bu dekont bu tarayıcıda kayıtlı değil. Kaydı düzenleyip dosyayı yeniden seçebilirsin."); return; }
    var url=URL.createObjectURL(rec.blob);
    if(w && !w.closed){ try{ w.location.href=url; }catch(e){ w=null; } }
    if(!w || w.closed){
      var o=sheet('<header><span class="nm">'+attr(rec.name||"dekont")+'</span><span class="acts">'+
        '<a class="btn ghost sm" href="'+url+'" target="_blank" rel="noopener">Yeni sekmede aç</a>'+
        '<button type="button" class="btn ghost sm" data-close>Kapat</button></span></header>'+
        '<iframe src="'+url+'" title="'+attr(rec.name||"dekont")+'"></iframe>');
      o.querySelectorAll("[data-close]").forEach(function(b){ b.addEventListener("click",closeSheet); });
    }
    setTimeout(function(){ try{ URL.revokeObjectURL(url); }catch(e){} },120000);
  }).catch(function(){ if(w){ try{w.close();}catch(e){} } sheetMsg("Dosya açılamadı."); });
}

/* ---------- form ---------- */
function nextPeriod(){
  if(!state.rows.length){ var n=new Date(); return {year:n.getFullYear(),month:n.getMonth()+1}; }
  var last=state.rows.slice().sort(function(a,b){ return key(a)-key(b); }).pop();
  var m=last.month+1, y=last.year;
  if(m>12){ m=1; y++; }
  return {year:y,month:m};
}
function fillForm(r){
  if(r){
    $("f-year").value=r.year; $("f-month").value=String(r.month);
    $("f-usd").value=r.usd?String(r.usd).replace(".",","):"";
    $("f-usdtl").value=r.usdTl?String(r.usdTl).replace(".",","):"";
    $("f-eur").value=r.eur?String(r.eur).replace(".",","):"";
    $("f-eurtl").value=r.eurTl?String(r.eurTl).replace(".",","):"";
    $("f-extra").value=r.extra?String(r.extra).replace(".",","):"";
    $("f-tax").value=String(DILIMLER.indexOf(r.tax)>-1?r.tax:27);
    pending.usd = (r.usdDoc&&(r.usdDoc.kind==="file"||r.usdDoc.kind==="storage")) ? r.usdDoc : null;
    pending.eur = (r.eurDoc&&(r.eurDoc.kind==="file"||r.eurDoc.kind==="storage")) ? r.eurDoc : null;
    $("f-usddoc").value = (r.usdDoc&&r.usdDoc.kind==="url") ? r.usdDoc.url : "";
    $("f-eurdoc").value = (r.eurDoc&&r.eurDoc.kind==="url") ? r.eurDoc.url : "";
  }else{
    var p=nextPeriod(), last=state.rows.slice().sort(function(a,b){ return key(a)-key(b); }).pop();
    $("f-year").value=p.year; $("f-month").value=String(p.month);
    $("f-usd").value=last?String(last.usd).replace(".",","):"";
    $("f-usdtl").value=""; $("f-eur").value=last?String(last.eur).replace(".",","):"";
    $("f-eurtl").value=""; $("f-extra").value=""; $("f-tax").value=String(last&&DILIMLER.indexOf(last.tax)>-1?last.tax:27);
    pending.usd=null; pending.eur=null;
    $("f-usddoc").value=""; $("f-eurdoc").value="";
  }
  previews();
}
function previews(){
  var usd=num($("f-usd").value), usdTl=num($("f-usdtl").value);
  var eur=num($("f-eur").value), eurTl=num($("f-eurtl").value);
  $("c-usd").textContent = (usd>0&&usdTl>0) ? "1 $ = "+fmt(usdTl/usd,4)+" ₺" : "";
  $("c-eur").textContent = (eur>0&&eurTl>0) ? "1 € = "+fmt(eurTl/eur,4)+" ₺" : "";
  var tax=num($("f-tax").value), toplam=usdTl+eurTl+num($("f-extra").value);
  $("c-tax").textContent = toplam>0 ? "iade "+fmt(toplam*tax/100)+" ₺" : "";
  ["usd","eur"].forEach(function(cur){
    var d=pending[cur];
    var el=$("f-"+cur+"doc"), btn=document.querySelector('[data-pick="'+cur+'"]');
    if(d&&(d.kind==="file"||d.kind==="storage")){
      el.value=d.name; el.readOnly=true; el.title=d.name;
      btn.textContent="Kaldır"; btn.dataset.mode="clear";
      $("c-"+cur+"doc").textContent="✓ dosya kayıtlı · tabloda tıklanabilir";
    }else{
      el.readOnly=false; el.title="";
      btn.textContent="Gözat…"; btn.dataset.mode="pick";
      $("c-"+cur+"doc").textContent = docUrl(el.value) ? "✓ bağlantı · tabloda tıklanabilir" : "";
    }
  });
}
["f-usd","f-usdtl","f-eur","f-eurtl","f-extra","f-tax","f-usddoc","f-eurdoc"].forEach(function(id){
  $(id).addEventListener("input",previews);
  $(id).addEventListener("change",previews);
});

var pending={usd:null,eur:null};
["usd","eur"].forEach(function(cur){
  var btn=document.querySelector('[data-pick="'+cur+'"]'), inp=$("file-"+cur);
  btn.addEventListener("click",function(){
    if(btn.dataset.mode==="clear"){ pending[cur]=null; $("f-"+cur+"doc").value=""; inp.value=""; previews(); return; }
    inp.click();
  });
  inp.addEventListener("change",function(){
    var f=inp.files&&inp.files[0];
    if(!f) return;
    if(f.size>60*1024*1024){ setStatus("Dosya çok büyük (60 MB üstü).","warn"); inp.value=""; return; }
    if(window.DEFTER_DB && DEFTER_DB.aktif() && DEFTER_DB.girisli()){
      setStatus(f.name+" yükleniyor…","");
      DEFTER_DB.dosyaYukle(f).then(function(doc){
        pending[cur]=doc; previews();
        setStatus(f.name+" yüklendi — ayı kaydetmeyi unutma.","ok");
      }).catch(function(err){ setStatus("Dosya yüklenemedi: "+(err&&err.message||""),"warn"); });
      inp.value=""; return;
    }
    var id="d"+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36);
    idbPut(id,{name:f.name,type:f.type||"application/pdf",blob:f}).then(function(){
      pending[cur]={kind:"file",id:id,name:f.name};
      previews();
      setStatus(f.name+" eklendi — ayı kaydetmeyi unutma.","");
    }).catch(function(){
      setStatus("Dosya bu tarayıcıda saklanamadı, bağlantı yapıştırabilirsin.","warn");
    });
    inp.value="";
  });
});
function formDoc(cur){
  if(pending[cur]) return pending[cur];
  return normDoc($("f-"+cur+"doc").value);
}

function setEditing(id){
  editingId=id;
  var r=id?state.rows.filter(function(x){return x.id===id;})[0]:null;
  $("formTitle").textContent = r ? (AYLAR[r.month-1]+" "+r.year+" düzenleniyor") : "Yeni ay ekle";
  $("submit").textContent = r ? "Değişikliği kaydet" : "Ayı kaydet";
  $("cancel").hidden = !r;
  fillForm(r);
  render();
  if(r) document.getElementById("entry").scrollIntoView({behavior:"smooth",block:"center"});
}

$("entry").addEventListener("submit",function(e){
  e.preventDefault();
  var row={
    id: editingId || uid(),
    year: parseInt($("f-year").value,10)||new Date().getFullYear(),
    month: parseInt($("f-month").value,10)||1,
    usd:num($("f-usd").value), usdTl:num($("f-usdtl").value),
    eur:num($("f-eur").value), eurTl:num($("f-eurtl").value),
    extra:num($("f-extra").value),
    tax:num($("f-tax").value),
    usdDoc:formDoc("usd"), eurDoc:formDoc("eur")
  };
  if(row.usdTl<=0 && row.eurTl<=0 && row.extra<=0){ setStatus("Bu ay için en az bir tutar gir.","warn"); return; }
  if(editingId){
    state.rows=state.rows.map(function(r){ return r.id===editingId?row:r; });
  }else{
    var clash=state.rows.filter(function(r){ return r.year===row.year&&r.month===row.month; })[0];
    if(clash){ setStatus(AYLAR[row.month-1]+" "+row.year+" zaten kayıtlı — o satırı düzenle.","warn"); return; }
    state.rows.push(row);
  }
  editingId=null;
  $("formTitle").textContent="Yeni ay ekle"; $("submit").textContent="Ayı kaydet"; $("cancel").hidden=true;
  render(); fillForm(null); cleanupDocs();
  persist(AYLAR[row.month-1]+" "+row.year+" kaydedildi");
});
$("cancel").addEventListener("click",function(){ setEditing(null); setStatus("",""); });

$("tableWrap").addEventListener("click",function(e){
  var sa=e.target.closest ? e.target.closest("a[data-sfile]") : null;
  if(sa){ e.preventDefault(); openStorage(sa.getAttribute("data-sfile")); return; }
  var a=e.target.closest ? e.target.closest("a[data-file]") : null;
  if(a){ e.preventDefault(); openFile(a.getAttribute("data-file")); return; }
  var b=e.target.closest ? e.target.closest("button") : null;
  if(!b) return;
  var ed=b.getAttribute("data-edit"), dl=b.getAttribute("data-del");
  if(ed){ armedDelete=null; setEditing(ed); return; }
  if(dl){
    if(armedDelete!==dl){
      armedDelete=dl; render();
      clearTimeout(armTimer);
      armTimer=setTimeout(function(){ armedDelete=null; render(); },4000);
      return;
    }
    clearTimeout(armTimer); armedDelete=null;
    var gone=state.rows.filter(function(r){ return r.id===dl; })[0];
    state.rows=state.rows.filter(function(r){ return r.id!==dl; });
    if(editingId===dl) setEditing(null);
    render(); fillForm(null); cleanupDocs();
    persist(gone?(AYLAR[gone.month-1]+" "+gone.year+" silindi"):"Kayıt silindi");
  }
});

/* rates */
function syncRateInputs(){
  elUk.value=String(state.usdRate).replace(".",",");
  elEk.value=String(state.eurRate).replace(".",",");
  elKt.value=state.rateDate;
}
function liveRates(){
  state.usdRate=num(elUk.value); state.eurRate=num(elEk.value); state.rateDate=elKt.value.trim();
  render();
}
elUk.addEventListener("input",liveRates);
elEk.addEventListener("input",liveRates);
elKt.addEventListener("input",liveRates);
$("saveRates").addEventListener("click",function(){ liveRates(); persist("Kur kaydedildi"); });

/* ---------- persistence ---------- */
function setStatus(msg,kind){
  var el=$("status"); el.textContent=msg; el.className="status"+(kind?" "+kind:"");
}
function esc(s){ return s.replace(/</g,"\\u003c").replace(/\u2028/g,"\\u2028").replace(/\u2029/g,"\\u2029"); }
function buildDoc(){
  var butceEl=document.getElementById("butce-code");
  var butceTxt=butceEl?butceEl.textContent:"";
  var odemeEl=document.getElementById("odeme-code");
  var odemeTxt=odemeEl?odemeEl.textContent:"";
  var patatesEl=document.getElementById("patates-code");
  var patatesTxt=patatesEl?patatesEl.textContent:"";
  var ayarEl=document.getElementById("db-ayar"), dbEl=document.getElementById("db-code");
  var ayarTxt=ayarEl?ayarEl.textContent:"", dbTxt=dbEl?dbEl.textContent:"";
  var styleTxt=document.getElementById("app-style").textContent;
  var codeTxt=document.getElementById("app-code").textContent;
  var fontHref=document.getElementById("app-fonts").getAttribute("href");
  var json=esc(JSON.stringify(state));
  return '<!doctype html>\n<html lang="tr">\n<head>\n<meta charset="utf-8">\n'+
    '<meta name="viewport" content="width=device-width,initial-scale=1">\n'+
    '<title>Birikim ve Bütçe Defteri</title>\n'+
    '<link id="app-fonts" rel="stylesheet" href="'+fontHref+'">\n'+
    '<style id="app-style">'+styleTxt+'</style>\n</head>\n<body>\n'+
    '<div id="app"></div>\n'+
    '<script id="app-state" type="application/json">'+json+'<\/script>\n'+
    '<script id="app-code">'+codeTxt+'<\/script>\n'+
    (butceTxt ? '<script id="butce-code">'+butceTxt+'<\/script>\n' : '')+
    (odemeTxt ? '<script id="odeme-code">'+odemeTxt+'<\/script>\n' : '')+
    (patatesTxt ? '<script id="patates-code">'+patatesTxt+'<\/script>\n' : '')+
    (ayarTxt ? '<script id="db-ayar">'+ayarTxt+'<\/script>\n' : '')+
    (dbTxt ? '<script id="db-code">'+dbTxt+'<\/script>\n' : '')+
    '</body>\n</html>';
}
var apiPromise=null;
function getApi(){
  if(apiPromise) return apiPromise;
  apiPromise = (function(){
    try{
      if(typeof claude!=="undefined" && claude && typeof claude.use==="function") return claude.use("artifact");
    }catch(e){}
    return Promise.resolve(null);
  })().catch(function(){ return null; });
  return apiPromise;
}
function persist(msg){
  state.savedAt=Date.now();
  try{ localStorage.setItem("doviz-defteri",JSON.stringify(state)); }catch(e){}
  if(window.DEFTER_DB && DEFTER_DB.aktif()){
    if(!DEFTER_DB.girisli()){ setStatus((msg||"Kaydedildi")+" · giriş yok, yalnızca bu tarayıcıda","warn"); return; }
    if(window.DB_DURUM) DB_DURUM("kaydediliyor…");
    DEFTER_DB.kaydet(state).then(function(){
      if(window.DB_DURUM) DB_DURUM("kaydedildi","ok");
      setStatus((msg||"Kaydedildi")+" · veritabanına yazıldı","ok");
    }).catch(function(e){
      if(window.DB_DURUM) DB_DURUM("yazılamadı","warn");
      setStatus((msg||"Kaydedildi")+" · veritabanına yazılamadı ("+(e&&e.message||"")+")","warn");
    });
    return;
  }
  setStatus((msg||"Kaydedildi")+" · sayfaya işleniyor…","");
  getApi().then(function(api){
    if(!api) { setStatus((msg||"Kaydedildi")+" · yalnızca bu tarayıcıda saklandı","warn"); return; }
    return api.publish(buildDoc()).then(function(){
      setStatus((msg||"Kaydedildi")+" · sayfaya işlendi","ok");
    });
  }).catch(function(err){
    var code=err&&err.code;
    if(code==="conflict") setStatus("Başkası aynı anda kaydetti, sayfa yenileniyor.","warn");
    else setStatus((msg||"Kaydedildi")+" · sayfaya işlenemedi, bu tarayıcıda saklandı","warn");
  });
}

/* ---------- dış arayüz (yedekleme / kur eklentileri için) ---------- */
var stateHooks=[];
window.DEFTER={
  getState:function(){ return state; },
  onState:function(fn){ if(typeof fn==="function") stateHooks.push(fn); },
  setState:function(o){ state=normalize(o); syncRateInputs(); render(); fillForm(null);
    stateHooks.forEach(function(f){ try{ f(state); }catch(e){} }); },
  save:function(msg){ persist(msg); },
  saveLocal:function(msg){
    state.savedAt=Date.now();
    try{ localStorage.setItem("doviz-defteri",JSON.stringify(state)); }catch(e){}
    if(msg) setStatus(msg,"");
  },
  setRates:function(u,e,d){
    if(isFinite(u)&&u>0) elUk.value=String(u).replace(".",",");
    if(isFinite(e)&&e>0) elEk.value=String(e).replace(".",",");
    if(d) elKt.value=d;
    liveRates();
  },
  idb:{put:idbPut,get:idbGet,keys:idbKeys,del:idbDel},
  sheet:sheet, closeSheet:closeSheet, setStatus:setStatus, attr:attr, cleanupDocs:cleanupDocs
};

/* ---------- boot ---------- */
syncRateInputs();
render();
fillForm(null);
setTimeout(cleanupDocs,1200);
})();
</script>

<script id="butce-code">
(function(){
"use strict";
var D=window.DEFTER; if(!D) return;
var AY=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
var isArtifact=false;
try{ isArtifact=(typeof claude!=="undefined" && claude && typeof claude.use==="function"); }catch(e){}

function num(v){
  if(typeof v==="number") return isFinite(v)?v:0;
  var s=String(v==null?"":v).trim().replace(/\s/g,"");
  if(!s) return 0;
  if(s.indexOf(",")>-1 && s.indexOf(".")>-1) s=s.replace(/\./g,"").replace(",",".");
  else if(s.indexOf(",")>-1) s=s.replace(",",".");
  var n=parseFloat(s); return isFinite(n)?n:0;
}
function fmt(n,d){ d=(d==null?2:d); if(!isFinite(n)) n=0;
  return n.toLocaleString("tr-TR",{minimumFractionDigits:d,maximumFractionDigits:d}); }
function tl(n,d){ return fmt(n,d)+" ₺"; }
function inp(v){ return v?String(v).replace(".",","):""; }
function uid(pfx){ return (pfx||"b")+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36); }
function K(y,m){ return y*12+m; }
function ymLabel(y,m){ return AY[m-1]+" "+y; }
function kisa(y,m){ return (m<10?"0":"")+m+"/"+y; }
function ls(k,v){
  try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){}
  return null;
}

/* ---------- veri ---------- */
function B(){
  var st=D.getState();
  if(!st.butce||typeof st.butce!=="object") st.butce={taksitler:[],aylar:[]};
  if(!Array.isArray(st.butce.taksitler)) st.butce.taksitler=[];
  if(!Array.isArray(st.butce.aylar)) st.butce.aylar=[];
  return st.butce;
}
function aylar(){ return B().aylar.slice().sort(function(a,b){ return K(a.yil,a.ay)-K(b.yil,b.ay); }); }
function ayBul(k){ var a=B().aylar; for(var i=0;i<a.length;i++) if(K(a[i].yil,a[i].ay)===k) return a[i]; return null; }

var sel=null, yeniId=null;
function seciliAy(){
  var list=aylar();
  if(!list.length) return null;
  var a=sel!=null?ayBul(sel):null;
  if(!a){ a=list[list.length-1]; sel=K(a.yil,a.ay); }
  return a;
}
function ayKey(){ var a=seciliAy(); var d=new Date();
  return a?K(a.yil,a.ay):K(d.getFullYear(),d.getMonth()+1); }

/* ---------- taksit hesabı ---------- */
function tBas(t){ return K(t.bYil,t.bAy); }
function tSon(t){ return K(t.sYil,t.sAy); }
function tAdet(t){ return Math.max(1,tSon(t)-tBas(t)+1); }
function tAktif(t,k){ return k>=tBas(t) && k<=tSon(t); }
function tDurum(t,k){ return k<tBas(t) ? "gelecek" : (k>tSon(t) ? "bitti" : "aktif"); }
function tIlerleme(t,k){
  var adet=tAdet(t), kac=Math.min(adet,Math.max(0,k-tBas(t)+1)), tut=num(t.tutar);
  return {adet:adet,kac:kac,odenen:tut*kac,toplam:tut*adet,kalanTutar:tut*(adet-kac),oran:adet?kac/adet:0};
}
function ayTaksitleri(k){
  return B().taksitler.filter(function(t){ return tAktif(t,k); });
}

/* ---------- toplamlar ---------- */
function toplamGonderim(a){
  if(!a) return 0;
  if(Array.isArray(a.gonderimler) && a.gonderimler.length){
    return a.gonderimler.reduce(function(s,x){ return s+num(x.tutar); },0);
  }
  return num(a.hesaba);
}

function hesap(a){
  if(!a) return {taksit:0,fatura:0,gider:0,toplam:0,maas:0,kalan:0,hesaba:0,elde:0,bitiyor:0,aktif:0};
  var k=K(a.yil,a.ay);
  var tk=ayTaksitleri(k), taksit=0, bitiyor=0;
  tk.forEach(function(t){ taksit+=num(t.tutar); if(tSon(t)===k) bitiyor++; });
  var fatura=(a.faturalar||[]).reduce(function(s,x){ return s+num(x.tutar); },0);
  var gider=(a.giderler||[]).reduce(function(s,x){ return s+num(x.tutar); },0);
  var hesaba=toplamGonderim(a);
  a.hesaba=hesaba;
  var toplam=taksit+fatura+gider, maas=num(a.maas);
  var kalan=maas-toplam-hesaba; // Her gönderim kalandan otomatik düşer
  return {taksit:taksit,fatura:fatura,gider:gider,toplam:toplam,maas:maas,
    kalan:kalan, hesaba:hesaba, elde:kalan, bitiyor:bitiyor, aktif:tk.length};
}

/* ---------- kaydetme ---------- */
var saveT=null;
function kaydet(msg,hemen){
  try{ if(D.saveLocal) D.saveLocal(); }catch(e){}
  clearTimeout(saveT);
  var go=function(){
    if(isArtifact && !hemen){ if(D.saveLocal) D.saveLocal(); durum("Taslak kaydedildi — yayınlamak için Kaydet","warn"); }
    else D.save(msg||"Bütçe kaydedildi");
  };
  if(hemen) go(); else saveT=setTimeout(go,900);
}
function durum(t,kind){
  var el=document.getElementById("bStatus");
  if(el){ el.textContent=t||""; el.className="status"+(kind?" "+kind:""); }
}

/* ---------- açılır kapanır paneller ---------- */
var acc={fatura:true,gider:true,gonderim:true,taksit:true};
try{ var raw=ls("defter-acc"); if(raw) acc=Object.assign(acc,JSON.parse(raw)); }catch(e){}
function accSave(){ ls("defter-acc",JSON.stringify(acc)); }
function accHead(key,baslik,hint){

}
function accClass(key){ return "panel"+(acc[key]?"":" collapsed"); }

/* ---------- kabuk ---------- */
document.getElementById("mod2").innerHTML=[
'<p class="lede">Taksitleri bir kez tanımla — ilk ve son ödeme ayını girdiğinde hangi ayda hangisinin ödeneceğini sayfa kendisi bulur. Her ay için maaşı, faturaları, diğer giderleri ve hesaba gönderilenleri gir; kalan aşağıda çıkar.</p>',
'<section class="monthbar">',
  '<button type="button" class="navbtn" id="bPrev" title="Önceki ay">‹</button>',
  '<select id="bSel" aria-label="Ay seç"></select>',

  '<span class="grow"></span>',
  '<span class="status" id="bStatus"></span>',
  '<div class="actions">',
    (isArtifact?'<button type="button" class="btn sm" id="bSave">Kaydet</button>':''),
    '<button type="button" class="btn ghost sm" id="bCopy">Yeni ay · önceki aydan kopyala</button>',
    '<button type="button" class="btn ghost sm" id="bDel">Ayı sil</button>',
  '</div>',
'</section>',
'<section id="bSummary"></section>',
'<section class="panel" id="pGelir"></section>',
'<section class="panel" id="pOzet"></section>',
'<section class="panel" id="pFatura"></section>',

'<footer class="note">',

'</footer>'
].join("");

var $=function(id){ return document.getElementById(id); };

/* ---------- render ---------- */
function ayOpts(){

    var k=K(x.yil,x.ay);

/* ---------- bu ayın özeti: kompakt kategori listesi ve açılabilir detaylar ---------- */
var ozetDetay = { taksit: false, fatura: false, gider: false, gonderim: false };

function ozRow(o){
  var h='<div class="oz-row">';
  h+='<span class="oz-ad">'+o.ad+'</span><span class="oz-tut">'+o.tut+'</span>';

function renderOzet(){

  var fat=a.faturalar||[], gid=a.giderler||[], gon=a.gonderimler||[];
  var genelToplam = h.toplam + h.hesaba;

  function catHtml(catKey, baslik, adet, tutar, contentFn){
    var isOpen = !!ozetDetay[catKey];
    var out = '<div class="oz-cat-item">'+
      '<div class="oz-cat-row" data-oz-toggle="'+catKey+'">'+

        '</div>'+
        '<div class="oz-cat-right">'+
          '<span class="oz-cat-amount">'+fmt(tutar)+' ₺</span>'+
          '<button type="button" class="btn ghost sm oz-detay-btn" data-oz-toggle="'+catKey+'">'+
            (isOpen ? 'Detayı gizle ▴' : 'Detay ▾')+
          '</button>'+
        '</div>'+
      '</div>';
    if(isOpen){
      out += '<div class="oz-cat-detail">' + contentFn() + '</div>';
    }
    out += '</div>';
    return out;
  }

  var html = [];

  // 1. Taksitler
  html.push(catHtml("taksit", "Taksitler", tk.length, h.taksit, function(){
    if(!tk.length) return '<div class="oz-bos">Bu ay ödenecek taksit yok.</div>';
    var res = '<div class="oz-head">'+
      '<span class="oz-ad">Kalem</span><span class="oz-tut">Bu ay ₺</span>'+
      '<span class="oz-donem">Dönem</span><span class="oz-tak">Taksit</span>'+
      '<span class="oz-odn">Ödenen / Toplam ₺</span><span class="oz-drm">Durum</span>'+
    '</div>';
    tk.forEach(function(t){
      var p=tIlerleme(t,k), son=tSon(t)===k;
      res += ozRow({
        ad:D.attr(t.ad||"—"), tut:fmt(num(t.tutar)),
        donem:kisa(t.bYil,t.bAy)+" – "+kisa(t.sYil,t.sAy),
        tak:p.kac+'<span class="dim">/'+p.adet+'</span>',
        odn:fmt(p.odenen,0)+' <span class="dim">/ '+fmt(p.toplam,0)+'</span>'+prog(p.oran),
        drm: son ? '<span class="tag warn">son taksit</span>'
                 : '<span class="dim">'+fmt(p.kalanTutar,0)+' ₺ kaldı</span>'
      });
    });
    return res;
  }));

  // 2. Faturalar
  html.push(catHtml("fatura", "Faturalar", fat.length, h.fatura, function(){
    if(!fat.length) return '<div class="oz-bos">Fatura girilmemiş.</div>';
    return fat.map(function(x){
      return '<div class="oz-sub-row"><span class="oz-sub-ad">'+D.attr(x.ad||"—")+'</span><span class="oz-sub-tut">'+fmt(num(x.tutar))+' ₺</span></div>';
    }).join("");
  }));

  // 3. Diğer giderler
  html.push(catHtml("gider", "Diğer giderler", gid.length, h.gider, function(){
    if(!gid.length) return '<div class="oz-bos">Gider girilmemiş.</div>';
    return gid.map(function(x){
      return '<div class="oz-sub-row"><span class="oz-sub-ad">'+D.attr(x.ad||"—")+'</span><span class="oz-sub-tut">'+fmt(num(x.tutar))+' ₺</span></div>';
    }).join("");
  }));

  // 4. Hesaba gönderilen
  html.push(catHtml("gonderim", "Hesaba gönderilen", gon.length, h.hesaba, function(){
    if(!gon.length) return '<div class="oz-bos">Hesaba gönderim girilmemiş.</div>';
    return gon.map(function(x){
      return '<div class="oz-sub-row"><span class="oz-sub-ad">'+D.attr(x.ad||"Hesaba gönderim")+'</span><span class="oz-sub-tut">'+fmt(num(x.tutar))+' ₺</span></div>';
    }).join("");
  }));

  // Dip toplamlar
  var foot = [];
  if(h.hesaba > 0){
    foot.push('<div class="oz-foot"><span>Giderler</span><span class="v">'+fmt(h.toplam)+' ₺</span></div>');
    foot.push('<div class="oz-foot"><span>Genel toplam</span><span class="v">'+fmt(genelToplam)+' ₺</span></div>');
  } else {
    foot.push('<div class="oz-foot"><span>Genel toplam</span><span class="v">'+fmt(h.toplam)+' ₺</span></div>');
  }
  foot.push('<div class="oz-foot son"><span>Kalan</span><span class="v">'+fmt(h.kalan)+' ₺</span></div>');

  $("pOzet").innerHTML=
    '<div class="panel-head"><h2>Bu ayın özeti</h2><span class="hint">'+ymLabel(a.yil,a.ay)+'</span></div>'+
    '<div class="ozet">'+
      html.join("")+
      foot.join("")+
    '</div>';
}

/* ---------- fatura / gider / hesaba gönderim listeleri ---------- */
function listeHtml(key,baslik,ipucu,items,ekle){
  var listKey = (key==="fatura" ? "faturalar" : (key==="gider" ? "giderler" : "gonderimler"));
  var placeHolderAd = (key==="gonderim" ? "Gönderim açıklaması (örn: Kira, Yatırım)" : "Kalem adı");
  var canSort = (typeof window.canAdminSort === "function") ? window.canAdminSort() : true;
  return accHead(key,baslik,ipucu)+
    '<div class="panel-body"><div class="rows">'+
      (items.length? items.map(function(it,i){
        return '<div class="row2">'+
          '<input type="text" data-l="'+listKey+'" data-i="'+i+'" data-f="ad" value="'+D.attr(it.ad||"")+'" placeholder="'+placeHolderAd+'">'+
          '<input type="text" inputmode="decimal" data-l="'+listKey+'" data-i="'+i+'" data-f="tutar" value="'+inp(it.tutar)+'" placeholder="0">'+
          '<div class="row-acts">'+
            (canSort ? '<button type="button" class="icobtn" data-up="'+listKey+'" data-i="'+i+'" title="Yukarı taşı"'+(i===0?' disabled':'')+'>↑</button>'+
                       '<button type="button" class="icobtn" data-down="'+listKey+'" data-i="'+i+'" title="Aşağı taşı"'+(i===items.length-1?' disabled':'')+'>↓</button>' : '')+
            '<button type="button" class="icobtn danger" data-sil="'+listKey+'" data-i="'+i+'">Sil</button>'+
          '</div>'+
        '</div>';
      }).join("") : '<div class="empty">Henüz kalem yok.</div>')+
    '</div>'+
    '<div class="rowfoot"><button type="button" class="btn ghost sm" data-ekle="'+listKey+'">+ '+ekle+'</button>'+
    '<span class="rowtot" id="tot-'+key+'"></span></div></div>';
}
function renderListeler(){
  var a=seciliAy();
  if(!a){
    $("pFatura").hidden=true; $("pGider").hidden=true;
    if($("pHesaba")) $("pHesaba").hidden=true;
    return;
  }
  $("pFatura").hidden=false; $("pGider").hidden=false;
  if($("pHesaba")) $("pHesaba").hidden=false;

  a.faturalar=a.faturalar||[]; a.giderler=a.giderler||[]; a.gonderimler=a.gonderimler||[];
  $("pFatura").className=accClass("fatura");

  if($("pHesaba")) $("pHesaba").className=accClass("gonderim");

    $("pHesaba").innerHTML=listeHtml("gonderim","Hesaba Gönderilenler","Her gönderim kalandan otomatik düşer",a.gonderimler,"Gönderim ekle");

  totNot();
}
function totNot(){
  var a=seciliAy(); if(!a) return;
  var f=$("tot-fatura"), g=$("tot-gider"), gon=$("tot-gonderim");
  if(f) f.textContent="Toplam "+tl((a.faturalar||[]).reduce(function(s,x){ return s+num(x.tutar); },0));
  if(g) g.textContent="Toplam "+tl((a.giderler||[]).reduce(function(s,x){ return s+num(x.tutar); },0));
  if(gon) gon.textContent="Toplam "+tl((a.gonderimler||[]).reduce(function(s,x){ return s+num(x.tutar); },0));
}

/* ---------- taksit listesi ---------- */
var gizleBitmis=(ls("defter-bitenler")==="1");
function rozetHtml(t,k){
  var d=tDurum(t,k), p=tIlerleme(t,k);
  if(d==="bitti") return '<span class="tag done">bitti</span>';
  if(d==="gelecek") return '<span class="tag">başlamadı</span>';
  return tSon(t)===k ? '<span class="tag warn">son taksit</span>' : '<span class="tag ok">'+p.kac+'/'+p.adet+'</span>';
}
function odenenHtml(t,k){
  var p=tIlerleme(t,k);
  return fmt(p.odenen,0)+' <span class="dim">/ '+fmt(p.toplam,0)+'</span>'+prog(p.oran);
}
function satirTazele(id){
  var k=ayKey(), t=B().taksitler.filter(function(x){ return x.id===id; })[0];
  var row=$("pTaksitler")?$("pTaksitler").querySelector('.trow[data-id="'+id+'"]'):null;
  if(!t||!row) return;
  var b=row.querySelector(".trow-badge"), o=row.querySelector(".trow-odn");
  if(b) b.innerHTML=rozetHtml(t,k);
  if(o) o.innerHTML=odenenHtml(t,k);
  row.classList.toggle("off",tDurum(t,k)==="bitti");
}
function renderTaksitler(){
  var k=ayKey();
  var all=B().taksitler;
  var list=all.filter(function(t){ return gizleBitmis ? (tDurum(t,k)!=="bitti" || t.id===yeniId) : true; });
  var gizli=all.length-list.length;
  var canSort = (typeof window.canAdminSort === "function") ? window.canAdminSort() : true;
  function aySel(t,f,val){
    var o="";
    for(var m=1;m<=12;m++) o+='<option value="'+m+'"'+(val===m?" selected":"")+'>'+AY[m-1]+'</option>';
    return '<select data-t="'+t.id+'" data-f="'+f+'">'+o+'</select>';
  }
  var rows=list.map(function(t, idx){
    return '<div class="trow'+(tDurum(t,k)==="bitti"?" off":"")+'" data-id="'+t.id+'">'+
      '<input type="text" data-t="'+t.id+'" data-f="ad" value="'+D.attr(t.ad||"")+'" placeholder="Kalem adı">'+
      '<input type="text" inputmode="decimal" data-t="'+t.id+'" data-f="tutar" value="'+inp(t.tutar)+'" placeholder="0">'+
      '<span class="mini-l">ilk</span>'+aySel(t,"bAy",t.bAy)+
      '<input type="text" inputmode="numeric" class="yil" data-t="'+t.id+'" data-f="bYil" value="'+(t.bYil||"")+'">'+
      '<span class="mini-l">son</span>'+aySel(t,"sAy",t.sAy)+
      '<input type="text" inputmode="numeric" class="yil" data-t="'+t.id+'" data-f="sYil" value="'+(t.sYil||"")+'">'+
      '<span class="trow-odn odn">'+odenenHtml(t,k)+'</span>'+
      '<span class="trow-badge">'+rozetHtml(t,k)+'</span>'+
      '<div class="trow-acts">'+
        (canSort ? '<button type="button" class="icobtn" data-t-up="'+t.id+'" title="Yukarı taşı"'+(idx===0?' disabled':'')+'>↑</button>'+
                   '<button type="button" class="icobtn" data-t-down="'+t.id+'" title="Aşağı taşı"'+(idx===list.length-1?' disabled':'')+'>↓</button>' : '')+
        '<button type="button" class="icobtn danger" data-tsil="'+t.id+'">Sil</button>'+
      '</div>'+
    '</div>';
  }).join("");
  var hint='<label class="chk"><input type="checkbox" id="bGizle"'+(gizleBitmis?" checked":"")+'> Bitenleri gizle</label>'+
           (gizli?' · '+gizli+' gizli':'')+' · '+all.length+' kalem';
  $("pTaksitler").className=accClass("taksit");
  $("pTaksitler").innerHTML=
    accHead("taksit","Taksit listesi",hint)+
    '<div class="panel-body"><div class="tscroll"><div class="trows">'+
      (rows||'<div class="empty">Taksit yok. Aşağıdan ekle.</div>')+'</div></div>'+
    '<div class="rowfoot"><button type="button" class="btn ghost sm" id="bTaksitEkle">+ Taksit ekle</button>'+
    '<span class="rowtot">Bu ayki aktif toplam '+tl(ayTaksitleri(k).reduce(function(s,t){ return s+num(t.tutar); },0))+'</span></div></div>';
  $("bGizle").addEventListener("change",function(){
    gizleBitmis=this.checked; ls("defter-bitenler",gizleBitmis?"1":"0"); renderTaksitler();
  });
  $("bTaksitEkle").addEventListener("click",function(){
    var a2=seciliAy(), y=a2?a2.yil:new Date().getFullYear(), m=a2?a2.ay:new Date().getMonth()+1;
    var son=m+5, sy=y; while(son>12){ son-=12; sy++; }
    var t={id:uid("t"),ad:"",tutar:0,bYil:y,bAy:m,sYil:sy,sAy:son};
    B().taksitler.push(t); yeniId=t.id;
    acc.taksit=true; accSave();
    renderTaksitler(); renderOzet(); renderSummary(); kaydet();
    var el=$("pTaksitler").querySelector('.trow[data-id="'+t.id+'"] input[data-f="ad"]');
    if(el){ el.focus(); el.scrollIntoView({block:"center",behavior:"smooth"}); }
  });
}

function renderAll(){ ayOpts(); renderSummary(); renderGelir(); renderOzet(); renderListeler(); renderTaksitler(); }

/* ---------- olaylar ---------- */
$("mod2").addEventListener("input",function(e){
  var t=e.target, a=seciliAy();
  if(t.hasAttribute("data-l") && a){
    var arr=a[t.getAttribute("data-l")]||[], i=parseInt(t.getAttribute("data-i"),10), f=t.getAttribute("data-f");
    if(arr[i]){ arr[i][f]=(f==="tutar")?num(t.value):t.value; totNot(); renderSummary(); renderOzet(); kaydet(); }
    return;
  }
  if(t.hasAttribute("data-t")){
    var id=t.getAttribute("data-t"), f2=t.getAttribute("data-f");
    var tk=B().taksitler.filter(function(x){ return x.id===id; })[0];
    if(!tk) return;
    if(f2==="tutar") tk.tutar=num(t.value);
    else if(f2==="ad") tk.ad=t.value;
    else {
      var v=String(t.value).replace(/\D/g,"");
      if(v.length!==4) return;               /* yıl tamamlanmadan hesap yapma */
      tk[f2]=parseInt(v,10);
    }
    satirTazele(id); renderOzet(); renderSummary(); kaydet();
  }
});
$("mod2").addEventListener("change",function(e){
  var t=e.target;
  if(t.tagName==="SELECT" && t.hasAttribute("data-t")){
    var id=t.getAttribute("data-t"), f=t.getAttribute("data-f");
    var tk=B().taksitler.filter(function(x){ return x.id===id; })[0];
    if(tk){ tk[f]=parseInt(t.value,10)||1; satirTazele(id); renderOzet(); renderSummary(); kaydet(); }
  }
});
$("mod2").addEventListener("click",function(e){
  var acB=e.target.closest?e.target.closest("[data-acc]"):null;
  if(acB){ var key=acB.getAttribute("data-acc"); acc[key]=!acc[key]; accSave();
    var pnl=acB.closest(".panel"); pnl.classList.toggle("collapsed",!acc[key]);
    acB.setAttribute("aria-expanded",acc[key]?"true":"false"); return; }
  var ozBtn=e.target.closest?e.target.closest("[data-oz-toggle]"):null;
  if(ozBtn){
    var cat=ozBtn.getAttribute("data-oz-toggle");
    if(cat){ ozetDetay[cat]=!ozetDetay[cat]; renderOzet(); return; }
  }
  var b=e.target.closest?e.target.closest("button"):null; if(!b) return;
  var a=seciliAy();
  if(b.hasAttribute("data-ekle") && a){
    var key2=b.getAttribute("data-ekle");
    a[key2]=a[key2]||[]; a[key2].push({ad:"",tutar:0});
    renderListeler(); renderSummary(); renderOzet(); kaydet();
    var panelEl=(key2==="faturalar"?$("pFatura"):(key2==="giderler"?$("pGider"):$("pHesaba")));
    if(panelEl){
      var ins=panelEl.querySelectorAll('input[data-f="ad"]');
      if(ins.length) ins[ins.length-1].focus();
    }
    return;
  }
  if(b.hasAttribute("data-sil") && a){
    var key3=b.getAttribute("data-sil"), i=parseInt(b.getAttribute("data-i"),10);
    (a[key3]||[]).splice(i,1); renderListeler(); renderSummary(); renderOzet(); kaydet(); return;
  }
  if(b.hasAttribute("data-up") && a){
    if(typeof window.canAdminSort === "function" && !window.canAdminSort()) return;
    var keyUp=b.getAttribute("data-up"), iUp=parseInt(b.getAttribute("data-i"),10);
    var arrUp=a[keyUp]||[];
    if(iUp>0 && iUp<arrUp.length){
      var tmp=arrUp[iUp-1];
      arrUp[iUp-1]=arrUp[iUp];
      arrUp[iUp]=tmp;
      renderListeler(); renderSummary(); renderOzet(); kaydet();
    }
    return;
  }
  if(b.hasAttribute("data-down") && a){
    if(typeof window.canAdminSort === "function" && !window.canAdminSort()) return;
    var keyDn=b.getAttribute("data-down"), iDn=parseInt(b.getAttribute("data-i"),10);
    var arrDn=a[keyDn]||[];
    if(iDn>=0 && iDn<arrDn.length-1){
      var tmp2=arrDn[iDn+1];
      arrDn[iDn+1]=arrDn[iDn];
      arrDn[iDn]=tmp2;
      renderListeler(); renderSummary(); renderOzet(); kaydet();
    }
    return;
  }
  if(b.hasAttribute("data-t-up")){
    if(typeof window.canAdminSort === "function" && !window.canAdminSort()) return;
    var idUp=b.getAttribute("data-t-up");
    var allT=B().taksitler;
    var cIdx=allT.findIndex(function(x){ return x.id===idUp; });
    if(cIdx>0){
      var k=ayKey();
      var prevIdx=-1;
      for(var pi=cIdx-1; pi>=0; pi--){
        if(!gizleBitmis || tDurum(allT[pi],k)!=="bitti" || allT[pi].id===yeniId){
          prevIdx=pi; break;
        }
      }
      var targetP = prevIdx>=0 ? prevIdx : cIdx-1;
      var itemUp=allT.splice(cIdx,1)[0];
      allT.splice(targetP,0,itemUp);
      renderTaksitler(); renderOzet(); renderSummary(); kaydet();
    }
    return;
  }
  if(b.hasAttribute("data-t-down")){
    if(typeof window.canAdminSort === "function" && !window.canAdminSort()) return;
    var idDn=b.getAttribute("data-t-down");
    var allT2=B().taksitler;
    var cIdx2=allT2.findIndex(function(x){ return x.id===idDn; });
    if(cIdx2>=0 && cIdx2<allT2.length-1){
      var k2=ayKey();
      var nextIdx=-1;
      for(var ni=cIdx2+1; ni<allT2.length; ni++){
        if(!gizleBitmis || tDurum(allT2[ni],k2)!=="bitti" || allT2[ni].id===yeniId){
          nextIdx=ni; break;
        }
      }
      var targetN = nextIdx>=0 ? nextIdx : cIdx2+1;
      var itemDn=allT2.splice(cIdx2,1)[0];
      allT2.splice(targetN,0,itemDn);
      renderTaksitler(); renderOzet(); renderSummary(); kaydet();
    }
    return;
  }
  if(b.hasAttribute("data-tsil")){
    var id=b.getAttribute("data-tsil");
    var bt=B(); bt.taksitler=bt.taksitler.filter(function(x){ return x.id!==id; });
    if(yeniId===id) yeniId=null;
    renderTaksitler(); renderOzet(); renderSummary(); kaydet(); return;
  }
});
$("bSel").addEventListener("change",function(){ sel=parseInt(this.value,10); yeniId=null; renderAll(); });
function gotoAdj(step){
  var list=aylar(); if(!list.length) return;
  var a=seciliAy(), idx=0;
  for(var i=0;i<list.length;i++) if(K(list[i].yil,list[i].ay)===K(a.yil,a.ay)) idx=i;
  idx=Math.min(list.length-1,Math.max(0,idx+step));
  sel=K(list[idx].yil,list[idx].ay); yeniId=null; renderAll();
}
$("bPrev").addEventListener("click",function(){ gotoAdj(-1); });
$("bNext").addEventListener("click",function(){ gotoAdj(1); });
if($("bSave")) $("bSave").addEventListener("click",function(){ kaydet("Bütçe kaydedildi",true); });

$("bCopy").addEventListener("click",function(){
  var list=aylar(), kaynak=list.length?list[list.length-1]:null, y,m;
  if(kaynak){ y=kaynak.yil; m=kaynak.ay+1; if(m>12){ m=1; y++; } }
  else { var d=new Date(); y=d.getFullYear(); m=d.getMonth()+1; }
  if(ayBul(K(y,m))){ sel=K(y,m); renderAll(); durum(ymLabel(y,m)+" zaten var, ona geçildi.","warn"); return; }
  var kgon = (kaynak && (kaynak.gonderimler || (num(kaynak.hesaba)>0 ? [{ad:"Hesaba Gönderim",tutar:num(kaynak.hesaba)}] : []))) || [];
  B().aylar.push({id:uid("a"),yil:y,ay:m,
    maas:kaynak?num(kaynak.maas):0, hesaba:kaynak?num(kaynak.hesaba):0,
    gonderimler:kgon.map(function(x){ return {ad:x.ad,tutar:num(x.tutar)}; }),
    faturalar:(kaynak&&kaynak.faturalar?kaynak.faturalar:[]).map(function(x){ return {ad:x.ad,tutar:num(x.tutar)}; }),
    giderler:(kaynak&&kaynak.giderler?kaynak.giderler:[]).map(function(x){ return {ad:x.ad,tutar:num(x.tutar)}; })});
  sel=K(y,m); yeniId=null; renderAll();
  kaydet(ymLabel(y,m)+" eklendi",true);
  durum(ymLabel(y,m)+(kaynak?" · "+ymLabel(kaynak.yil,kaynak.ay)+" kopyalandı":" eklendi"),"ok");
});

$("bDel").addEventListener("click",function(){
  var a=seciliAy(); if(!a) return;
  D.sheet('<header><span class="nm">Ayı sil</span><span class="acts">'+
    '<button type="button" class="btn ghost sm" data-close>Vazgeç</button>'+
    '<button type="button" class="btn sm" id="bDelGo">Sil</button></span></header>'+
    '<div class="msg"><b>'+ymLabel(a.yil,a.ay)+'</b> ayının maaşı, faturaları ve giderleri silinecek. '+
    'Taksit listesi etkilenmez. Bu işlem geri alınamaz.</div>');
  $("bDelGo").addEventListener("click",function(){
    var bt=B(); bt.aylar=bt.aylar.filter(function(x){ return K(x.yil,x.ay)!==K(a.yil,a.ay); });
    sel=null; D.closeSheet(); renderAll(); kaydet(ymLabel(a.yil,a.ay)+" silindi",true);
  });
});

D.onState(function(){ sel=null; yeniId=null; renderAll(); });
renderAll();
})();
</script>

<script id="odeme-code">
(function(){
"use strict";
var D=window.DEFTER; if(!D) return;
var AY=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
var isArtifact=false;
try{ isArtifact=(typeof claude!=="undefined" && claude && typeof claude.use==="function"); }catch(e){}

function num(v){
  if(typeof v==="number") return isFinite(v)?v:0;
  var s=String(v==null?"":v).trim().replace(/\s/g,"");
  if(!s) return 0;
  if(s.indexOf(",")>-1 && s.indexOf(".")>-1) s=s.replace(/\./g,"").replace(",",".");
  else if(s.indexOf(",")>-1) s=s.replace(",",".");
  var n=parseFloat(s); return isFinite(n)?n:0;
}
function fmt(n,d){ d=(d==null?2:d); if(!isFinite(n)) n=0;
  return n.toLocaleString("tr-TR",{minimumFractionDigits:d,maximumFractionDigits:d}); }
function tl(n,d){ return fmt(n,d)+" ₺"; }
function inp(v){ return v?String(v).replace(".",","):""; }
function uid(){ return "o"+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36); }
function K(y,m){ return y*12+m; }
function yil(k){ return Math.floor((k-1)/12); }
function ay(k){ return k-yil(k)*12; }
function ymLabel(k){ return AY[ay(k)-1]+" "+yil(k); }

var T=new Date(), CK=K(T.getFullYear(),T.getMonth()+1), CD=T.getDate();
var mk=CK;

/* ---------- veri ---------- */
function O(){
  var st=D.getState();
  if(!Array.isArray(st.odemeler)) st.odemeler=[];
  return st.odemeler;
}
function bas(o){ return K(o.bYil,o.bAy); }
function son(o){ return (o.sYil&&o.sAy)?K(o.sYil,o.sAy):0; }   /* 0 = süresiz */
function aktif(o,k){ var s=son(o); return k>=bas(o) && (!s || k<=s); }
function ayTutar(o,k){
  var t=o.tutarlar||{}, best=null;
  for(var key in t){ var kk=parseInt(key,10);
    if(kk<=k && (best===null || kk>best)) best=kk; }
  return best===null ? num(o.tutar) : num(t[best]);
}
function setAyTutar(o,k,v){ o.tutarlar=o.tutarlar||{}; o.tutarlar[k]=v; if(k<=bas(o)) o.tutar=v; }
function odendiMi(o,k){ return !!(o.odendi && o.odendi[k]); }
function setOdendi(o,k,v){ o.odendi=o.odendi||{}; if(v) o.odendi[k]=1; else delete o.odendi[k]; }

function ayListesi(k){
  return O().filter(function(o){ return aktif(o,k); });
}
function durum(o,k){
  if(odendiMi(o,k)) return {s:"ok",t:"ödendi"};
  var g=parseInt(o.gun,10)||1;
  if(k<CK) return {s:"due",t:"ödenmedi"};
  if(k>CK) return {s:"wait",t:"bekliyor"};
  if(CD>g)  return {s:"due",t:(CD-g)+" gün gecikti"};
  if(CD===g) return {s:"due",t:"bugün son gün"};
  return {s:"wait",t:(g-CD)+" gün kaldı"};
}
function hesap(k){
  var list=ayListesi(k), h={adet:list.length,toplam:0,odenen:0,kalan:0,geciken:0,gecikenTutar:0,bugun:0};
  list.forEach(function(o){
    var t=ayTutar(o,k), d=durum(o,k);
    h.toplam+=t;
    if(d.s==="ok") h.odenen+=t; else h.kalan+=t;
    if(d.s==="due"&&!odendiMi(o,k)){ h.geciken++; h.gecikenTutar+=t; }
  });
  return h;
}

/* ---------- kaydetme ---------- */
var saveT=null;
function kaydet(msg,hemen){
  try{ if(D.saveLocal) D.saveLocal(); }catch(e){}
  clearTimeout(saveT);
  var go=function(){
    if(isArtifact && !hemen){ if(D.saveLocal) D.saveLocal(); not("Taslak kaydedildi — yayınlamak için Kaydet","warn"); }
    else D.save(msg||"Ödemeler kaydedildi");
  };
  if(hemen) go(); else saveT=setTimeout(go,900);
}
function not(t,kind){
  var el=document.getElementById("oStatus");
  if(el){ el.textContent=t||""; el.className="status"+(kind?" "+kind:""); }
}

/* ---------- kabuk ---------- */
document.getElementById("mod3").innerHTML=[
'<p class="lede">Her ödemeyi bir kez tanımla: nereye, ne kadar, ayın kaçında ve ne zaman bitecek. Seçtiğin ayda kendiliğinden listelenir — <b class="c-due">ödeme günü gelmiş olanlar kırmızı</b>, <b class="c-wait">günü gelmemişler sarı</b>, <b class="c-ok">ödediklerin yeşil</b>.</p>',
'<section class="monthbar">',
  '<button type="button" class="navbtn" id="oPrev" title="Önceki ay">‹</button>',
  '<select id="oAy" aria-label="Ay"></select>',

  '<button type="button" class="navbtn" id="oNext" title="Sonraki ay">›</button>',
  '<button type="button" class="btn ghost sm" id="oBugun">Bu ay</button>',
  '<span class="grow"></span>',
  '<span class="status" id="oStatus"></span>',
  (isArtifact?'<div class="actions"><button type="button" class="btn sm" id="oSave">Kaydet</button></div>':''),
'</section>',
'<section id="oSummary"></section>',
'<section class="panel" id="oPanel"></section>',
'<footer class="note">',
  '<b>Renkler.</b> Yeşil: ödedin. Kırmızı: son ödeme günü geldi ya da geçti, hâlâ ödenmedi. Sarı: günü gelmedi. ',
  'Renkler bugünün tarihine göre hesaplanır, sayfayı her açtığında güncellenir.<br>',
  '<b>Tutarlar aya göre.</b> Bir ayın tutarını değiştirirsen o ay ve sonraki aylar o tutarı kullanır; ',

'</footer>'
].join("");

var $=function(id){ return document.getElementById(id); };

/* ---------- render ---------- */
function yilAralik(){
  var ys=[yil(CK)-1, yil(CK)+3];
  O().forEach(function(o){
    if(o.bYil && o.bYil<ys[0]) ys[0]=o.bYil;
    if(o.sYil && o.sYil>ys[1]) ys[1]=o.sYil;
  });
  var out=[];
  for(var y=ys[0];y<=ys[1];y++) out.push(y);
  return out;
}
function selectleriDoldur(){
  $("oAy").innerHTML=AY.map(function(a,i){
    return '<option value="'+(i+1)+'"'+(ay(mk)===i+1?" selected":"")+'>'+a+'</option>'; }).join("");
  $("oYil").innerHTML=yilAralik().map(function(y){
    return '<option value="'+y+'"'+(yil(mk)===y?" selected":"")+'>'+y+'</option>'; }).join("");
}
function chip(k,v,cls){ return '<div class="chip'+(cls?" "+cls:"")+'"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'; }

function renderSummary(){
  var h=hesap(mk);
  $("oSummary").innerHTML=['<div class="headline">',
    '<div class="hcell"><span class="k">Bu ay toplam</span><span class="v">',tl(h.toplam),'</span>',
      '<span class="s">',ymLabel(mk),' · ',h.adet,' ödeme</span></div>',
    '<div class="hcell"><span class="k">Ödenen</span><span class="v up">',tl(h.odenen),'</span>',
      '<span class="s">',(h.toplam>0?"%"+fmt(h.odenen/h.toplam*100,0):"—"),' tamam</span></div>',
    '<div class="hcell"><span class="k">Kalan</span><span class="v',(h.geciken?" down":""),'">',tl(h.kalan),'</span>',
      (h.geciken ? '<span class="pill down">▲ '+h.geciken+' ödeme günü geçti · '+fmt(h.gecikenTutar,0)+' ₺</span>'
                 : '<span class="s">günü gelen ödeme yok</span>'),
    '</div></div>'].join("");
}

function renderListe(){
  var list=ayListesi(mk), h=hesap(mk);
  var yillar=yilAralik();
  var canSort = (typeof window.canAdminSort === "function") ? window.canAdminSort() : true;
  function aySel(o,val){
    var s='<option value="0">—</option>';
    for(var m=1;m<=12;m++) s+='<option value="'+m+'"'+(val===m?" selected":"")+'>'+AY[m-1]+'</option>';
    return '<select data-o="'+o.id+'" data-f="sAy">'+s+'</select>';
  }
  function yilSel(o,val){
    var s='<option value="0">—</option>';
    yillar.forEach(function(y){ s+='<option value="'+y+'"'+(val===y?" selected":"")+'>'+y+'</option>'; });
    return '<select data-o="'+o.id+'" data-f="sYil">'+s+'</select>';
  }
  var rows=list.map(function(o, idx){
    var d=durum(o,mk), t=ayTutar(o,mk), g=parseInt(o.gun,10)||1;
    return '<div class="od-row '+d.s+'" data-id="'+o.id+'">'+
      '<label class="od-chk" title="Ödendi işareti"><input type="checkbox" data-od="'+o.id+'"'+(odendiMi(o,mk)?" checked":"")+'><span></span></label>'+
      '<input class="od-ad" type="text" data-o="'+o.id+'" data-f="ad" value="'+D.attr(o.ad||"")+'" placeholder="Nereye ödenecek">'+
      '<input class="od-tut" type="text" inputmode="decimal" data-o="'+o.id+'" data-f="tutar" value="'+inp(t)+'" placeholder="0">'+
      '<span class="od-gun"><span class="mini-l">ayın</span>'+
        '<input class="gun" type="text" inputmode="numeric" data-o="'+o.id+'" data-f="gun" value="'+g+'"><span class="mini-l">günü</span></span>'+
      '<span class="od-bit"><span class="mini-l">bitiş</span>'+aySel(o,parseInt(o.sAy,10)||0)+yilSel(o,parseInt(o.sYil,10)||0)+'</span>'+
      '<span class="od-drm"><span class="tag '+d.s+'">'+d.t+'</span></span>'+
      '<div class="row-acts">'+
        (canSort ? '<button type="button" class="icobtn" data-o-up="'+o.id+'" title="Yukarı taşı"'+(idx===0?' disabled':'')+'>↑</button>'+
                   '<button type="button" class="icobtn" data-o-down="'+o.id+'" title="Aşağı taşı"'+(idx===list.length-1?' disabled':'')+'>↓</button>' : '')+
        '<button type="button" class="icobtn danger" data-osil="'+o.id+'">Sil</button>'+
      '</div>'+
    '</div>';
  }).join("");
  $("oPanel").innerHTML=
    '<div class="panel-head"><h2>'+ymLabel(mk)+' ödemeleri</h2>'+
      '<span class="hint">İstediğiniz sırada düzenleyebilirsiniz · kutuyu işaretleyince yeşile döner</span></div>'+
    '<div class="od-list">'+(rows||'<div class="empty">Bu ayda ödeme yok. Aşağıdan ekle.</div>')+'</div>'+
    '<div class="rowfoot"><button type="button" class="btn ghost sm" id="oEkle">+ Ödeme ekle</button>'+
    '<span class="rowtot">Toplam '+tl(h.toplam)+' · ödenen '+fmt(h.odenen,0)+' · kalan '+fmt(h.kalan,0)+' ₺</span></div>';
  $("oEkle").addEventListener("click",function(){
    var o={id:uid(),ad:"",tutar:0,gun:1,bYil:yil(mk),bAy:ay(mk),sYil:0,sAy:0,odendi:{},tutarlar:{}};
    O().push(o); renderAll(); kaydet();
    var el=$("oPanel").querySelector('.od-row[data-id="'+o.id+'"] .od-ad');
    if(el){ el.focus(); el.scrollIntoView({block:"center",behavior:"smooth"}); }
  });
}

function footTazele(){
  var el=$("oPanel")?$("oPanel").querySelector(".rowtot"):null;
  if(!el) return;
  var h=hesap(mk);
  el.textContent="Toplam "+tl(h.toplam)+" · ödenen "+fmt(h.odenen,0)+" · kalan "+fmt(h.kalan,0)+" ₺";
}
function rozetTazele(id){
  var o=O().filter(function(x){ return x.id===id; })[0];
  var row=$("oPanel")?$("oPanel").querySelector('.od-row[data-id="'+id+'"]'):null;
  if(!o||!row) return;
  var d=durum(o,mk);
  row.className="od-row "+d.s;
  var el=row.querySelector(".od-drm");
  if(el) el.innerHTML='<span class="tag '+d.s+'">'+d.t+'</span>';
}
function tabRozet(){
  var tab=document.querySelector('.tab[data-tab="mod3"]');
  if(!tab) return;
  var h=hesap(CK), dot=tab.querySelector(".tabdot");
  if(h.geciken){
    if(!dot){ dot=document.createElement("span"); dot.className="tabdot"; tab.appendChild(dot); }
    dot.title=h.geciken+" ödemenin günü geldi";
  } else if(dot) dot.remove();
}
function renderAll(){ selectleriDoldur(); renderSummary(); renderListe(); tabRozet(); }

/* ---------- olaylar ---------- */
$("mod3").addEventListener("input",function(e){
  var t=e.target; if(!t.hasAttribute("data-o")) return;
  var o=O().filter(function(x){ return x.id===t.getAttribute("data-o"); })[0];
  if(!o) return;
  var f=t.getAttribute("data-f");
  if(f==="ad") o.ad=t.value;
  else if(f==="tutar") setAyTutar(o,mk,num(t.value));
  else if(f==="gun"){
    var g=parseInt(String(t.value).replace(/\D/g,""),10);
    if(!g) return;
    o.gun=Math.min(31,Math.max(1,g));
  }
  rozetTazele(o.id); renderSummary(); footTazele(); tabRozet(); kaydet();
});
$("mod3").addEventListener("change",function(e){
  var t=e.target;
  if(t.hasAttribute("data-od")){
    var o1=O().filter(function(x){ return x.id===t.getAttribute("data-od"); })[0];
    if(o1){ setOdendi(o1,mk,t.checked); rozetTazele(o1.id); renderSummary(); footTazele(); tabRozet();
      kaydet((o1.ad||"Ödeme")+(t.checked?" ödendi":" işareti kaldırıldı")); }
    return;
  }
  if(t.tagName==="SELECT" && t.hasAttribute("data-o")){
    var o2=O().filter(function(x){ return x.id===t.getAttribute("data-o"); })[0];
    if(o2){ o2[t.getAttribute("data-f")]=parseInt(t.value,10)||0; renderAll(); kaydet(); }
  }
});
$("mod3").addEventListener("click",function(e){
  var b=e.target.closest?e.target.closest("button"):null; if(!b) return;
  if(b.hasAttribute("data-o-up")){
    if(typeof window.canAdminSort === "function" && !window.canAdminSort()) return;
    var idUp=b.getAttribute("data-o-up");
    var allO=O();
    var cIdx=allO.findIndex(function(x){ return x.id===idUp; });
    if(cIdx>0){
      var targetP=-1;
      for(var p=cIdx-1; p>=0; p--){
        if(aktif(allO[p],mk)){ targetP=p; break; }
      }
      if(targetP!==-1){
        var itemUp=allO.splice(cIdx,1)[0];
        allO.splice(targetP,0,itemUp);
        renderAll(); kaydet();
      }
    }
    return;
  }
  if(b.hasAttribute("data-o-down")){
    if(typeof window.canAdminSort === "function" && !window.canAdminSort()) return;
    var idDn=b.getAttribute("data-o-down");
    var allO2=O();
    var cIdx2=allO2.findIndex(function(x){ return x.id===idDn; });
    if(cIdx2>=0 && cIdx2<allO2.length-1){
      var targetN=-1;
      for(var n=cIdx2+1; n<allO2.length; n++){
        if(aktif(allO2[n],mk)){ targetN=n; break; }
      }
      if(targetN!==-1){
        var itemDn=allO2.splice(cIdx2,1)[0];
        allO2.splice(targetN,0,itemDn);
        renderAll(); kaydet();
      }
    }
    return;
  }
  if(b.hasAttribute("data-osil")){
    var id=b.getAttribute("data-osil");
    var o=O().filter(function(x){ return x.id===id; })[0];
    D.sheet('<header><span class="nm">Ödemeyi sil</span><span class="acts">'+
      '<button type="button" class="btn ghost sm" data-close>Vazgeç</button>'+
      '<button type="button" class="btn sm" id="oSilGo">Sil</button></span></header>'+
      '<div class="msg"><b>'+D.attr(o&&o.ad?o.ad:"Bu ödeme")+'</b> tüm aylardan silinecek, ödendi işaretleri de gider. Bu işlem geri alınamaz.</div>');
    $("oSilGo").addEventListener("click",function(){
      var st=D.getState();
      st.odemeler=O().filter(function(x){ return x.id!==id; });
      D.closeSheet(); renderAll(); kaydet("Ödeme silindi",true);
    });
    return;
  }
});
function git(step){ mk=Math.max(12,mk+step); renderAll(); }
$("oPrev").addEventListener("click",function(){ git(-1); });
$("oNext").addEventListener("click",function(){ git(1); });
$("oBugun").addEventListener("click",function(){ mk=CK; renderAll(); });
$("oAy").addEventListener("change",function(){ mk=K(yil(mk),parseInt(this.value,10)); renderAll(); });
$("oYil").addEventListener("change",function(){ mk=K(parseInt(this.value,10),ay(mk)); renderAll(); });
if($("oSave")) $("oSave").addEventListener("click",function(){ kaydet("Ödemeler kaydedildi",true); });

D.onState(function(){ mk=CK; renderAll(); });
renderAll();
})();
</script>

<script id="patates-code">
(function(){
"use strict";
var D = window.DEFTER;
if(!D) return;

var aktifFiltre = "hepsi";      // 'hepsi' | 'bekleyen' | 'teslim' | 'odenmeyen' | 'odenen'
var aramaMetni = "";
var modalTip = null;           // 'siparis' | 'sevkiyat' | 'arac' | 'cuval' | 'stok_yonetim' | 'cuval_yonetim'
var stokModalSekme = "gelen";  // 'gelen' | 'arac'
var duzenlenenId = null;
var formTaslak = null;

function pId(p){
  return (p||"p") + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

function escH(s){
  if(s == null) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function fmtTl(n){
  n = Number(n) || 0;
  return n.toLocaleString("tr-TR", { minimumFractionDigits: 0, maximumFractionDigits: 2 }) + " ₺";
}

function fmtSayi(n){
  n = Number(n) || 0;
  return n.toLocaleString("tr-TR");
}

function getPatates(){
  var st = D.getState();
  if(!st.patates || typeof st.patates !== "object"){
    st.patates = {
      cuvalTipleri: [
        { id: "ct_std", ad: "Standart Çuval (~36 kg)", kg: 36, fiyat: 1300 },
        { id: "ct_yarim", ad: "Yarım Çuval (~18 kg)", kg: 18, fiyat: 650 }
      ],
      sevkiyatlar: [],
      aracYuklemeler: [],
      siparisler: []
    };
  }
  if(!Array.isArray(st.patates.cuvalTipleri) || !st.patates.cuvalTipleri.length){
    st.patates.cuvalTipleri = [
      { id: "ct_std", ad: "Standart Çuval (~36 kg)", kg: 36, fiyat: 1300 },
      { id: "ct_yarim", ad: "Yarım Çuval (~18 kg)", kg: 18, fiyat: 650 }
    ];
  }
  if(!Array.isArray(st.patates.sevkiyatlar)) st.patates.sevkiyatlar = [];
  if(!Array.isArray(st.patates.aracYuklemeler)) st.patates.aracYuklemeler = [];
  if(!Array.isArray(st.patates.siparisler)) st.patates.siparisler = [];
  return st.patates;
}

function kaydet(msg){
  D.saveLocal(msg);
  if(window.DEFTER_DB && DEFTER_DB.aktif() && DEFTER_DB.girisli()){
    D.save(msg);
  }
  patatesModulunuYukle();
}

function hesaplaOzet(pat){
  var gelenCuval = 0;
  (pat.sevkiyatlar || []).forEach(function(s){ gelenCuval += Number(s.cuval) || 0; });

  var yuklenenCuval = 0;
  (pat.aracYuklemeler || []).forEach(function(y){ yuklenenCuval += Number(y.cuval) || 0; });

  var depoKalan = Math.max(0, gelenCuval - yuklenenCuval);

  var teslimCuval = 0;
  var toplamCiro = 0;
  var tahsilEdilen = 0;

  (pat.siparisler || []).forEach(function(s){
    var cAdet = Number(s.cuvalAdet) || 0;
    var tutar = Number(s.toplamTutar) || 0;
    toplamCiro += tutar;
    if(s.teslimEdildi) teslimCuval += cAdet;
    var odenen = (s.odenenTutar != null) ? Number(s.odenenTutar) : (s.odendi ? tutar : 0);
    tahsilEdilen += odenen;
  });

  var aractaKalan = Math.max(0, yuklenenCuval - teslimCuval);
  var kalanAlacak = Math.max(0, toplamCiro - tahsilEdilen);

  return {
    gelenCuval: gelenCuval,
    yuklenenCuval: yuklenenCuval,
    depoKalan: depoKalan,
    teslimCuval: teslimCuval,
    aractaKalan: aractaKalan,
    toplamCiro: toplamCiro,
    tahsilEdilen: tahsilEdilen,
    kalanAlacak: kalanAlacak
  };
}

function patatesModulunuYukle(){
  var root = document.getElementById("mod4");
  if(!root) return;

  var pat = getPatates();
  var ozet = hesaplaOzet(pat);

  // Filtre sayıları
  var sList = pat.siparisler || [];
  var sayiHepsi = sList.length;
  var sayiBekleyen = sList.filter(function(x){ return !x.teslimEdildi; }).length;
  var sayiTeslim = sList.filter(function(x){ return !!x.teslimEdildi; }).length;
  var sayiOdenmeyen = sList.filter(function(x){
    var odenen = (x.odenenTutar != null) ? Number(x.odenenTutar) : (x.odendi ? Number(x.toplamTutar) : 0);
    return odenen < Number(x.toplamTutar);
  }).length;
  var sayiKismi = sList.filter(function(x){
    var odenen = (x.odenenTutar != null) ? Number(x.odenenTutar) : (x.odendi ? Number(x.toplamTutar) : 0);
    return odenen > 0 && odenen < Number(x.toplamTutar);
  }).length;
  var sayiOdenen = sList.filter(function(x){
    var odenen = (x.odenenTutar != null) ? Number(x.odenenTutar) : (x.odendi ? Number(x.toplamTutar) : 0);
    return odenen >= Number(x.toplamTutar);
  }).length;

  var h = [];
  h.push('<div class="pat-container">');

  // Başlık & Ana Butonlar
  h.push('<div class="pat-head">');
  h.push('  <div class="pat-titles">');
  h.push('    <h2>🥔 Patates Dağıtım & Sipariş Takibi</h2>');
  h.push('    <p>Çuval sevkiyatı, araç yüklemeleri, müşteri siparişleri ve anlık tahsilat kontrolü</p>');
