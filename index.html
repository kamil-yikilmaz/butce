<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Birikim ve Bütçe Defteri</title>
<link id="app-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap">
<style id="app-style">
:root{
  --ground:#EEF0F4; --surface:#FFFFFF; --surface-2:#F6F7FA;
  --line:#D7DCE7; --line-soft:#E7EAF1;
  --ink:#141A27; --ink-2:#3D4657; --muted:#6B7488;
  --accent:#2A3F7E; --accent-soft:#E6EAF6;
  --brass:#8F6620; --brass-soft:#F4EDDE;
  --gain:#146C4E; --gain-soft:#E1F0E9;
  --loss:#A8382A; --loss-soft:#F7E7E4;
  --on-accent:#FFFFFF;
  --shadow:0 1px 2px rgba(20,26,39,.06), 0 10px 28px -16px rgba(20,26,39,.28);
  --radius:10px;
}
:root:not([data-theme="light"]){ }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E121A; --surface:#161B26; --surface-2:#1B2130;
    --line:#2B3346; --line-soft:#222939;
    --ink:#E7EAF2; --ink-2:#C2C9D8; --muted:#8A93A8;
    --accent:#93A9EA; --accent-soft:#1E2740;
    --brass:#D9AE63; --brass-soft:#2A2318;
    --gain:#5DCFA0; --gain-soft:#12281F;
    --loss:#E98A78; --loss-soft:#2B1A17;
    --on-accent:#0E121A;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -16px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#0E121A; --surface:#161B26; --surface-2:#1B2130;
  --line:#2B3346; --line-soft:#222939;
  --ink:#E7EAF2; --ink-2:#C2C9D8; --muted:#8A93A8;
  --accent:#93A9EA; --accent-soft:#1E2740;
  --brass:#D9AE63; --brass-soft:#2A2318;
  --gain:#5DCFA0; --gain-soft:#12281F;
  --loss:#E98A78; --loss-soft:#2B1A17;
  --on-accent:#0E121A;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -16px rgba(0,0,0,.7);
}
*,*::before,*::after{box-sizing:border-box}
html{overflow-x:hidden; -webkit-text-size-adjust:100%}
body{
  overflow-x:hidden; width:100%; max-width:100vw; margin:0; padding:0;
  background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:1140px; width:100%; margin:0 auto; padding:32px 20px 72px; display:flex; flex-direction:column; gap:22px; box-sizing:border-box; min-width:0}
h1,h2,h3{margin:0; font-family:"IBM Plex Serif",Georgia,serif; font-weight:600; text-wrap:balance}
h1{font-size:29px; letter-spacing:-.01em}
h2{font-size:19px}
.eyebrow{font-size:11px; letter-spacing:.13em; text-transform:uppercase; color:var(--muted); font-weight:600}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}

/* header */
.masthead{display:flex; flex-wrap:wrap; gap:18px; align-items:flex-end; justify-content:space-between; border-bottom:2px solid var(--ink); padding-bottom:14px}
.masthead p{margin:6px 0 0; color:var(--muted); font-size:13.5px; max-width:58ch}
.lede{margin:0; color:var(--muted); font-size:13.5px; max-width:64ch}
.modpane{display:flex; flex-direction:column; gap:22px; width:100%; max-width:100%; box-sizing:border-box; min-width:0}
.tabs{display:flex; gap:2px; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:3px}
.tab{cursor:pointer; border:0; background:none; border-radius:7px; padding:8px 16px; font-size:14px; font-weight:600;
  color:var(--muted); font-family:"IBM Plex Sans",system-ui,sans-serif; white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.is-on{background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(20,26,39,.10)}

/* rate bar */
.rates{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px 16px; display:flex; flex-wrap:wrap; gap:16px 22px; align-items:flex-end}
.rates .field{display:flex; flex-direction:column; gap:5px}
.rates .field label{font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); font-weight:600}
.rates .grow{flex:1 1 auto; min-width:1px}
.tcmb-link{display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:500; color:var(--accent); text-decoration:none; border-bottom:1px solid transparent; padding-bottom:1px}
.tcmb-link:hover{border-bottom-color:var(--accent)}
.rate-note{font-size:12.5px; color:var(--muted); max-width:40ch; text-align:right}

input,select,button{font:inherit; color:inherit}
input[type=text],input[type=number],select{
  background:var(--surface-2); border:1px solid var(--line); border-radius:8px;
  padding:8px 10px; min-width:0; width:100%;
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums; font-size:14px;
}
select{font-family:"IBM Plex Sans",system-ui,sans-serif}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.rates input{width:118px}

/* summary */
.headline{display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow)}
.hcell{background:var(--surface); padding:18px 20px; display:flex; flex-direction:column; gap:7px}
.hcell .k{font-size:11px; letter-spacing:.11em; text-transform:uppercase; color:var(--muted); font-weight:600}
.hcell .v{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; font-size:26px; font-weight:500; letter-spacing:-.02em}
.hcell .s{font-size:12.5px; color:var(--muted)}
.hcell.result{background:var(--surface)}
.pill{display:inline-flex; align-items:center; gap:5px; align-self:flex-start; padding:3px 9px; border-radius:999px; font-size:12px; font-weight:600; font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}
.pill.up{background:var(--gain-soft); color:var(--gain)}
.pill.down{background:var(--loss-soft); color:var(--loss)}
.pill.flat{background:var(--surface-2); color:var(--muted)}
.v.up{color:var(--gain)} .v.down{color:var(--loss)}

.chips{display:grid; grid-template-columns:repeat(auto-fit,minmax(146px,1fr)); gap:1px; background:var(--line-soft); border:1px solid var(--line-soft); border-radius:var(--radius); overflow:hidden}
.chip{background:var(--surface); padding:12px 14px; display:flex; flex-direction:column; gap:3px}
.chip .k{font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); font-weight:600}
.chip .v{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; font-size:16px; font-weight:500}

/* table */
.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden}
.panel-head{display:flex; flex-wrap:wrap; gap:10px; align-items:baseline; justify-content:space-between; padding:16px 18px 12px; border-bottom:1px solid var(--line-soft)}
.panel-head .hint{font-size:12.5px; color:var(--muted)}
.tscroll{overflow-x:auto}
table{border-collapse:collapse; width:100%; min-width:900px; font-size:13px}
thead th{font-weight:600; color:var(--muted); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; padding:9px 6px; text-align:right; white-space:nowrap; background:var(--surface-2)}
thead tr.groups th{border-bottom:1px solid var(--line-soft); padding-top:11px; padding-bottom:5px; color:var(--ink-2); letter-spacing:.14em}
thead tr.groups th.g-usd{color:var(--accent)}
thead tr.groups th.g-eur{color:var(--brass)}
thead tr.cols th{border-bottom:1px solid var(--line); padding-top:4px}
th.l,td.l{text-align:left}
tbody td{padding:8px 6px; text-align:right; border-bottom:1px solid var(--line-soft); white-space:nowrap; font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}
tbody td.l{font-family:"IBM Plex Sans",system-ui,sans-serif}
tbody tr:hover td{background:var(--surface-2)}
tbody tr.editing td{background:var(--accent-soft)}
td .per{font-size:11px; color:var(--muted)}
.sep{border-left:1px solid var(--line-soft)}
tfoot td{padding:10px 6px; text-align:right; font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; font-weight:600; border-top:2px solid var(--ink); background:var(--surface-2); white-space:nowrap}
tfoot td.l{text-align:left; font-family:"IBM Plex Sans",system-ui,sans-serif; letter-spacing:.04em; text-transform:uppercase; font-size:11.5px}
.dim{color:var(--muted)}
.doclink{color:inherit; text-decoration:none; border-bottom:1px dashed var(--accent); padding-bottom:1px}
.doclink:hover{color:var(--accent); border-bottom-style:solid}
.doc-ico{font-size:9.5px; color:var(--accent); margin-left:3px; vertical-align:2px}
.docpick{display:flex; gap:8px; align-items:stretch}
.docpick input{flex:1 1 auto}
.docpick input[readonly]{color:var(--accent); background:var(--accent-soft); border-color:var(--accent); cursor:default}
.btn.sm{padding:8px 12px; font-size:13px; white-space:nowrap}
.overlay{position:fixed; inset:0; background:rgba(10,14,22,.62); display:flex; align-items:center; justify-content:center; padding:24px; z-index:50}
.sheet{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:0 24px 60px -20px rgba(0,0,0,.55); width:min(940px,100%); max-height:100%; display:flex; flex-direction:column; overflow:hidden}
.sheet header{display:flex; gap:12px; align-items:center; justify-content:space-between; padding:12px 14px; border-bottom:1px solid var(--line-soft)}
.sheet header .nm{font-size:13.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.sheet header .acts{display:flex; gap:8px; align-items:center}
.sheet iframe{border:0; width:100%; height:min(72vh,780px); background:var(--surface-2)}
.sheet .msg{padding:24px 20px; color:var(--ink-2); font-size:14px; line-height:1.6}
.tag{display:inline-block; padding:2px 6px; border-radius:6px; background:var(--accent-soft); color:var(--accent); font-family:"IBM Plex Sans",sans-serif; font-size:11.5px; font-weight:600}
.rowact{display:flex; gap:2px; justify-content:flex-end}
.icobtn{background:none; border:1px solid transparent; border-radius:6px; padding:3px 5px; font-size:11.5px; color:var(--muted); cursor:pointer; font-family:"IBM Plex Sans",sans-serif}
.icobtn:hover{border-color:var(--line); color:var(--ink); background:var(--surface)}
.icobtn.danger:hover{border-color:var(--loss); color:var(--loss); background:var(--loss-soft)}
.icobtn.armed{border-color:var(--loss); color:var(--loss); background:var(--loss-soft)}
.icobtn:disabled{opacity:.22; cursor:not-allowed; pointer-events:none}
.row-acts,.trow-acts{display:inline-flex; align-items:center; gap:2px; justify-content:flex-end}
.row-acts .icobtn,.trow-acts .icobtn{min-width:24px; text-align:center; padding:3px 6px; font-weight:600; font-size:12px}
.empty{padding:34px 18px; text-align:center; color:var(--muted); font-size:14px}

/* form */
form.entry{padding:16px 18px 18px; display:flex; flex-direction:column; gap:14px}
.grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px}
.grid.small{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.grid.docs{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.grid.docs input{font-size:13px}
.grid.docs input::placeholder{color:var(--muted); opacity:.7}
.field{display:flex; flex-direction:column; gap:5px}
.field label{font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); font-weight:600}
.field .calc{font-size:11.5px; color:var(--accent); font-family:"IBM Plex Mono",monospace; min-height:15px}
.formfoot{display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between}
.actions{display:flex; gap:8px}
.btn{cursor:pointer; border-radius:8px; padding:9px 16px; font-size:14px; font-weight:600; border:1px solid var(--accent); background:var(--accent); color:var(--on-accent)}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent; color:var(--ink-2); border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2); filter:none}
.status{font-size:12.5px; color:var(--muted)}
.status.ok{color:var(--gain)}
.status.warn{color:var(--brass)}

footer.note{color:var(--muted); font-size:12.5px; line-height:1.65}
footer.note b{color:var(--ink-2); font-weight:600}

@media (max-width:820px){
  .masthead{
    display:grid;
    grid-template-columns:1fr auto;
    grid-template-areas:
      "brand cip"
      "nav   nav";
    gap:12px 10px;
    align-items:center;
    padding-bottom:12px;
    position:relative;
    z-index:50;
  }
  .mast-brand,.masthead>div:first-child{grid-area:brand; min-width:0}
  .mast-brand h1,.masthead>div:first-child h1{
    font-size:20px;
    line-height:1.25;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .masthead .dbcip{
    grid-area:cip;
    margin-left:0;
    justify-self:end;
    display:flex;
    align-items:center;
    gap:6px;
    max-width:170px;
    min-width:0;
  }
  .masthead .dbcip .dbdurum{
    max-width:115px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    display:inline-block;
    padding:3px 8px;
    font-size:11px;
  }
  .masthead .dbcip .icobtn{
    padding:3px 7px;
    font-size:11.5px;
    white-space:nowrap;
  }
  .tabs{
    display:none !important;
  }
  .nav-module-picker{
    display:block !important;
    grid-area:nav;
    width:100%;
  }
  .wrap{padding:16px 12px 56px; gap:16px}
  .headline{grid-template-columns:1fr}
  .hcell .v{font-size:23px}
  .rates input{width:100%}
  .rates .field{flex:1 1 130px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}

/* ---- modül 2: aylık bütçe ---- */
.monthbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; background:var(--surface);
  border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:12px 14px}
.monthbar .grow{flex:1 1 auto; min-width:1px}
.monthbar select{width:auto; min-width:150px; font-weight:600}
.monthbar .actions{flex-wrap:wrap}
.navbtn{cursor:pointer; background:var(--surface-2); border:1px solid var(--line); border-radius:8px;
  width:34px; height:34px; font-size:18px; line-height:1; color:var(--ink-2); flex:0 0 auto}
.navbtn:hover{color:var(--accent); border-color:var(--accent)}
.gelir{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; padding:14px 18px 18px}
.rows{display:flex; flex-direction:column; padding-top:4px}
.row2{display:grid; grid-template-columns:minmax(140px,1fr) 150px auto; gap:8px; align-items:center; padding:6px 18px}
.rowfoot{display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between;
  padding:12px 18px 16px; margin-top:6px; border-top:1px solid var(--line-soft)}
.rowtot{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; font-size:13.5px; font-weight:600}
table.mini{min-width:620px}
.tag.warn{background:var(--brass-soft); color:var(--brass)}
.tag.ok{background:var(--gain-soft); color:var(--gain)}
.tag.done{background:var(--surface-2); color:var(--muted)}
.trows{display:flex; flex-direction:column; min-width:1120px; padding-top:4px}
.trow{display:grid; grid-template-columns:minmax(132px,1fr) 100px 22px 112px 66px 26px 112px 66px 150px 96px auto;
  gap:6px; align-items:center; padding:6px 18px}
.trow.off{opacity:.5}
.trow input,.trow select{padding:6px 8px; font-size:13px}
.trow .mini-l{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; text-align:right}
.trow-badge{text-align:center}
.chk{display:inline-flex; gap:6px; align-items:center; cursor:pointer}
.chk input{width:auto; margin:0}
@media (max-width:720px){
  .row2{grid-template-columns:1fr 110px auto}
  .monthbar{gap:8px}
  .monthbar select{min-width:120px; flex:1 1 auto}
  .monthbar .grow{display:none}
  .monthbar .actions{width:100%; gap:6px}
  .monthbar .actions .btn{flex:1 1 auto}
  .monthbar .status{width:100%}
  .rowfoot{flex-direction:column; align-items:stretch; gap:8px}
  .rowfoot button{width:100%; text-align:center}
  .rowfoot .rowtot{text-align:center; font-size:12.5px}
}
@media (max-width:540px){
  .row2{
    grid-template-columns:1fr auto;
    gap:6px 8px;
    padding:8px 12px;
    border-bottom:1px solid var(--line-soft);
  }
  .row2 input[data-f="ad"]{grid-column:1/-1}
  .row2 input[data-f="tutar"]{grid-column:1}
  .row2 .row-acts{grid-column:2; justify-self:end}
}

.acc-btn{display:flex; align-items:center; gap:8px; background:none; border:0; padding:0; cursor:pointer; color:inherit; text-align:left}
.acc-btn h2{margin:0}
.acc-btn .chev{display:inline-block; color:var(--muted); font-size:17px; line-height:1; transform:rotate(90deg); transition:transform .16s ease}
.panel.collapsed .acc-btn .chev{transform:rotate(0deg)}
.acc-btn:hover .chev{color:var(--accent)}
.panel.collapsed .panel-body{display:none}
.panel.collapsed .panel-head{border-bottom:0}
td.odn,.odn{font-size:12.5px; white-space:nowrap}
.prog{display:block; height:3px; margin-top:4px; background:var(--line-soft); border-radius:2px; overflow:hidden; min-width:78px}
.prog i{display:block; height:100%; background:var(--accent); border-radius:2px}
.trow .trow-odn{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; text-align:right}

/* ---- bu ayın özeti: kompakt kategori listesi ve açılabilir detaylar ---- */
.ozet{display:flex; flex-direction:column}
.oz-cat-item{border-bottom:1px solid var(--line-soft)}
.oz-cat-row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 18px; cursor:pointer; user-select:none; transition:background .15s}
.oz-cat-row:hover{background:var(--surface-2)}
.oz-cat-left{display:flex; align-items:baseline; gap:10px; min-width:0}
.oz-cat-title{font-size:14px; font-weight:600; color:var(--ink)}
.oz-cat-count{font-size:12px; color:var(--muted); white-space:nowrap}
.oz-cat-right{display:flex; align-items:center; gap:12px; margin-left:auto}
.oz-cat-amount{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; font-size:14.5px; font-weight:600; color:var(--ink); white-space:nowrap}
.oz-detay-btn{font-size:11.5px; padding:3px 9px; border-radius:6px; white-space:nowrap}
.oz-cat-detail{background:var(--surface-2); border-top:1px dashed var(--line-soft); padding:4px 0 8px}
.oz-cat-detail .oz-bos{padding:10px 18px; color:var(--muted); font-size:12.5px}
.oz-sub-row{display:flex; justify-content:space-between; align-items:center; padding:8px 18px; font-size:13px; border-bottom:1px solid var(--line-soft)}
.oz-sub-row:last-child{border-bottom:none}
.oz-sub-ad{font-weight:500; color:var(--ink-2)}
.oz-sub-tut{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; font-weight:600}

.oz-head{display:none}
.oz-grp{display:flex; align-items:baseline; gap:10px; padding:11px 16px 7px;
  background:var(--surface-2); border-bottom:1px solid var(--line); border-top:1px solid var(--line-soft)}
.oz-grp .g-ad{font-size:11px; letter-spacing:.1em; text-transform:uppercase; font-weight:600; color:var(--ink-2)}
.oz-grp .g-kal{font-size:11.5px; color:var(--muted); flex:1 1 auto}
.oz-grp .g-tut{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; font-weight:600; font-size:13.5px}
.oz-bos{padding:12px 16px; color:var(--muted); font-size:13px}
.oz-row{display:grid; grid-template-columns:1fr auto; gap:3px 10px; padding:10px 16px;
  border-bottom:1px solid var(--line-soft); align-items:baseline}
.oz-row .oz-ad{font-size:14px; font-weight:500}
.oz-row .oz-tut{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums;
  font-size:14px; font-weight:600; text-align:right; white-space:nowrap}
.oz-row .oz-donem,.oz-row .oz-tak{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums;
  font-size:12px; color:var(--muted); white-space:nowrap}
.oz-row .oz-tak{text-align:right}
.oz-row .oz-odn{grid-column:1/-1; font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums;
  font-size:12.5px; margin-top:3px}
.oz-row .oz-drm{grid-column:1/-1; font-size:12.5px; margin-top:2px}
.oz-foot{display:flex; align-items:baseline; justify-content:space-between; gap:12px; padding:12px 18px;
  border-top:1px solid var(--line); background:var(--surface-2); font-weight:600; font-size:13px;
  text-transform:uppercase; letter-spacing:.04em}
.oz-foot .v{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; font-size:15px; letter-spacing:0}
.oz-foot.son{border-top:2px solid var(--ink); background:var(--surface); color:var(--gain)}
@media (min-width:780px){
  .oz-head{display:grid; padding:9px 18px; background:var(--surface-2); border-bottom:1px solid var(--line)}
  .oz-head span{font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:600}
  .oz-head,.oz-row{grid-template-columns:minmax(150px,1.5fr) 128px 58px 170px minmax(104px,1fr) 116px;
    gap:10px; align-items:center; padding-top:9px; padding-bottom:9px}
  .oz-head>span,.oz-row>span{grid-row:1}
  .oz-head .oz-ad,.oz-row .oz-ad{grid-column:1}
  .oz-head .oz-donem,.oz-row .oz-donem{grid-column:2}
  .oz-head .oz-tak,.oz-row .oz-tak{grid-column:3; text-align:left}
  .oz-head .oz-odn,.oz-row .oz-odn{grid-column:4; margin-top:0}
  .oz-head .oz-drm,.oz-row .oz-drm{grid-column:5; margin-top:0}
  .oz-head .oz-tut,.oz-row .oz-tut{grid-column:6; text-align:right}
  .oz-grp{padding-left:18px; padding-right:18px}
  .oz-foot{padding-left:18px; padding-right:18px}
}
@media (max-width:720px){
  .oz-cat-row{padding:10px 14px; gap:8px}
  .oz-cat-amount{font-size:13.5px}
  .oz-sub-row{padding:7px 14px}
  .oz-foot{padding:10px 14px}
}
/* ---- taksit listesi: dar ekranda satırlar alt alta ---- */
@media (max-width:820px){
  .trows{min-width:0}
  .trow{grid-template-columns:34px 1fr auto; gap:6px; padding:12px 14px; border-bottom:1px solid var(--line-soft)}
  .trow>input[data-f="ad"]{grid-column:1/-1}
  .trow>input[data-f="tutar"]{grid-column:1/-1}
  .trow .trow-odn{grid-column:1/-1; text-align:left; margin-top:2px}
  .trow .trow-badge{grid-column:1/2; text-align:left}
  .trow .trow-acts{grid-column:2/-1; display:flex; justify-content:flex-end}
  .trow .mini-l{text-align:left}
}

/* ---- modül 3: ödemeler ---- */
.tab{position:relative}
.tabdot{position:absolute; top:5px; right:6px; width:7px; height:7px; border-radius:50%; background:var(--loss)}
.c-ok{color:var(--gain)} .c-due{color:var(--loss)} .c-wait{color:var(--brass)}
.tag.ok{background:var(--gain-soft); color:var(--gain)}
.tag.due{background:var(--loss-soft); color:var(--loss)}
.tag.wait{background:var(--brass-soft); color:var(--brass)}
.od-list{display:flex; flex-direction:column; padding-top:4px}
.od-row{display:grid; gap:6px 10px; align-items:center; padding:10px 16px 10px 12px;
  border-bottom:1px solid var(--line-soft); border-left:4px solid transparent;
  grid-template-columns:28px minmax(120px,1fr) 118px auto auto 1fr auto}
.od-row.ok{border-left-color:var(--gain); background:var(--gain-soft)}
.od-row.due{border-left-color:var(--loss); background:var(--loss-soft)}
.od-row.wait{border-left-color:var(--brass); background:var(--brass-soft)}
.od-row.ok .od-ad{text-decoration:line-through; text-decoration-color:var(--muted)}
.od-row input[type=text]{background:var(--surface); padding:7px 9px; font-size:13.5px}
.od-row .od-ad{font-family:"IBM Plex Sans",system-ui,sans-serif}
.od-row .od-tut{text-align:right; font-weight:600}
.od-row .gun{width:46px; text-align:center}
.od-row .od-gun,.od-row .od-bit{display:flex; align-items:center; gap:5px; white-space:nowrap}
.od-row .od-bit select{width:auto; min-width:92px; padding:6px 8px; font-size:13px}
.od-row .od-bit select:last-of-type{min-width:74px}
.od-row .od-drm{text-align:right}
.od-chk{display:flex; align-items:center; justify-content:center; cursor:pointer}
.od-chk input{width:19px; height:19px; margin:0; accent-color:var(--gain); cursor:pointer}
.od-chk span{display:none}
@media (max-width:860px){
  .od-row{
    grid-template-columns:26px 1fr auto;
    gap:8px 8px;
    padding:11px 12px 11px 10px;
    align-items:center;
  }
  .od-row .od-chk{grid-column:1; grid-row:1; align-self:center}
  .od-row .od-ad{grid-column:2/-1; grid-row:1; width:100%}
  .od-row .od-tut{grid-column:1/3; grid-row:2; width:100%; max-width:160px; text-align:left}
  .od-row .od-drm{grid-column:3; grid-row:2; text-align:right; align-self:center}
  .od-row .od-gun{grid-column:1/3; grid-row:3; display:flex; align-items:center; gap:5px; white-space:nowrap}
  .od-row .gun{width:42px; text-align:center}
  .od-row>button, .od-row .row-acts{grid-column:3; grid-row:3; justify-self:end; align-self:center}
  .od-row .od-bit{grid-column:1/-1; grid-row:4; display:flex; align-items:center; gap:6px; width:100%; margin-top:2px}
  .od-row .od-bit select{min-width:0; flex:1 1 auto; width:100%}
  .od-row .od-bit select:last-of-type{min-width:0; flex:0 0 76px; width:76px}
}
.backup{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; justify-content:space-between;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:12px 16px}
.backup .bk-note{font-size:12.5px; color:var(--muted); max-width:62ch}
.backup .bk-acts{display:flex; gap:8px}
@media (max-width:720px){
  .backup{flex-direction:column; align-items:stretch; gap:10px; padding:12px 14px}
  .backup .bk-acts{flex-wrap:wrap}
  .backup .bk-acts button{flex:1 1 auto}
}

/* Navigation Module Switcher (Mobile & Scalable) */
.nav-module-picker{position:relative; display:none; width:100%; box-sizing:border-box}
.nav-module-btn{
  width:100%; min-height:44px; background:var(--surface); border:1px solid var(--line);
  border-radius:10px; padding:9px 12px; display:flex; align-items:center;
  justify-content:space-between; gap:10px; cursor:pointer; font-family:"IBM Plex Sans",system-ui,sans-serif;

}
.nav-module-cur{display:flex; align-items:center; gap:8px; font-weight:700; font-size:14.5px; color:var(--ink); min-width:0}
.nav-cur-ico{font-size:18px; line-height:1; flex:0 0 auto}
.nav-cur-txt{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.nav-module-chevron{font-size:12px; font-weight:600; color:var(--accent); background:var(--accent-soft); padding:4px 8px; border-radius:6px; white-space:nowrap; flex:0 0 auto}
.nav-module-dropdown{
  position:absolute; top:calc(100% + 5px); left:0; right:0; z-index:99999 !important;
  background:var(--surface); border:1px solid var(--line); border-radius:12px;
  box-shadow:0 16px 40px rgba(0,0,0,0.22), 0 2px 6px rgba(0,0,0,0.06);
  overflow:hidden; display:flex; flex-direction:column; box-sizing:border-box; max-height:420px;
}
.nav-dropdown-title{padding:10px 14px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); background:var(--surface-2); border-bottom:1px solid var(--line-soft)}
.nav-dropdown-list{overflow-y:auto; -webkit-overflow-scrolling:touch; padding:4px 0; display:flex; flex-direction:column}
.nav-item-btn{
  display:flex; align-items:center; gap:10px; padding:11px 14px; background:none; border:0;
  width:100%; text-align:left; cursor:pointer; transition:background .12s; border-bottom:1px solid var(--line-soft);
  color:var(--ink); font-family:"IBM Plex Sans",system-ui,sans-serif; box-sizing:border-box;
}
.nav-item-btn:last-child{border-bottom:none}
.nav-item-btn:hover{background:var(--surface-2)}
.nav-item-btn.is-active{background:var(--accent-soft); color:var(--accent)}
.nav-item-ico{font-size:20px; line-height:1; flex:0 0 auto}
.nav-item-content{display:flex; flex-direction:column; gap:1px; flex:1 1 auto; min-width:0}
.nav-item-title{font-size:14px; font-weight:700; color:inherit}
.nav-item-desc{font-size:11.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.nav-item-check{font-size:15px; font-weight:700; color:var(--gain); flex:0 0 auto}

/* admin panel */
.admin-container{max-width:960px; width:100%; margin:0 auto; display:flex; flex-direction:column; gap:16px; box-sizing:border-box}
.admin-card-head{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px}
.admin-head-titles h2{margin:0; font-size:20px}
.admin-head-titles p{margin:3px 0 0; font-size:13px; color:var(--muted)}

/* Searchable Custom Dropdown in Admin Panel */
.admin-picker-panel{
  padding:16px 18px; border-radius:10px; box-sizing:border-box; width:100%;
  position:relative; z-index:100; overflow:visible !important;
}
.admin-picker-top{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:10px}
.admin-picker-label{font-weight:700; font-size:14.5px; color:var(--ink)}
.admin-count-badge{font-size:12px; color:var(--muted); font-weight:500}

.custom-dropdown-wrap{position:relative; width:100%; box-sizing:border-box}
.custom-dropdown-trigger{
  width:100%; min-height:44px; padding:10px 14px; background:var(--surface);
  border:1px solid var(--line); border-radius:8px; color:var(--ink);
  font-size:14.5px; font-weight:600; display:flex; align-items:center;
  justify-content:space-between; gap:10px; cursor:pointer; box-sizing:border-box;
  text-align:left; font-family:"IBM Plex Sans",system-ui,sans-serif;
  transition:border-color .15s, box-shadow .15s;
}
.custom-dropdown-trigger:hover, .custom-dropdown-trigger:focus{border-color:var(--accent)}
.custom-dropdown-trigger-text{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1 1 auto}
.custom-dropdown-arrow{font-size:14px; color:var(--muted); flex:0 0 auto; transition:transform .15s ease}
.custom-dropdown-wrap.is-open .custom-dropdown-arrow{transform:rotate(180deg)}

.custom-dropdown-menu{
  position:absolute; top:calc(100% + 4px); left:0; right:0; z-index:99999 !important;
  background:var(--surface); border:1px solid var(--line); border-radius:10px;
  box-shadow:0 14px 36px rgba(0,0,0,0.22), 0 2px 6px rgba(0,0,0,0.06);
  display:flex; flex-direction:column; overflow:hidden; box-sizing:border-box; max-height:360px;
}
.custom-dropdown-search-wrap{
  position:relative; padding:8px 10px; background:var(--surface-2); border-bottom:1px solid var(--line-soft);
  display:flex; align-items:center; position:sticky; top:0; z-index:2;
}
.custom-dropdown-search-ico{
  position:absolute; left:20px; top:50%; transform:translateY(-50%);
  font-size:14px; color:var(--muted); pointer-events:none; z-index:2; line-height:1;
}
.custom-dropdown-search-input, input[type=text].custom-dropdown-search-input{
  flex:1 1 auto; width:100% !important; padding:8px 30px 8px 38px !important; font-size:14.5px !important;
  border:1px solid var(--line); border-radius:6px; background:var(--surface); color:var(--ink);
  outline:none; box-sizing:border-box; font-family:"IBM Plex Sans",system-ui,sans-serif;
}
.custom-dropdown-search-input:focus{border-color:var(--accent)}
.custom-dropdown-clear-btn{
  position:absolute; right:14px; top:50%; transform:translateY(-50%);
  background:none; border:0; color:var(--muted); font-size:13px; cursor:pointer;
  padding:4px; line-height:1; border-radius:4px; z-index:2;
}
.custom-dropdown-clear-btn:hover{color:var(--ink)}
.custom-dropdown-list{overflow-y:auto; -webkit-overflow-scrolling:touch; max-height:240px; padding:4px 0}
.custom-dropdown-item{
  padding:10px 14px; font-size:13.5px; color:var(--ink); cursor:pointer;
  display:flex; align-items:center; gap:8px; border-bottom:1px solid var(--line-soft);
  transition:background .12s; user-select:none; box-sizing:border-box;
}
.custom-dropdown-item:last-child{border-bottom:none}
.custom-dropdown-item:hover{background:var(--surface-2)}
.custom-dropdown-item.is-selected{background:var(--accent-soft); color:var(--accent); font-weight:600}
.custom-item-ico{font-size:16px; flex:0 0 auto}
.custom-item-info{display:flex; flex-direction:column; gap:1px; flex:1 1 auto; min-width:0}
.custom-item-email{font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.custom-item-id{font-size:11px; color:var(--muted); font-family:"IBM Plex Mono",monospace}
.custom-item-check{font-size:14px; font-weight:700; color:var(--gain); flex:0 0 auto}
.custom-dropdown-empty{padding:18px 14px; text-align:center; color:var(--muted); font-size:13px}
.custom-dropdown-footer{padding:6px 12px; background:var(--surface-2); border-top:1px solid var(--line-soft); font-size:11.5px; color:var(--muted); text-align:right}

.admin-user-card{padding:18px 20px; border-radius:10px; box-sizing:border-box; width:100%; overflow:hidden}
.admin-user-header{display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:10px; border-bottom:1px solid var(--line-soft); padding-bottom:12px; margin-bottom:14px}
.admin-user-info{min-width:0; flex:1 1 auto}
.admin-user-email{font-weight:700; font-size:16px; color:var(--ink); word-break:break-all}
.admin-user-id{font-size:11px; color:var(--muted); font-family:"IBM Plex Mono",monospace; margin-top:2px; word-break:break-all}

.admin-modules-list{display:flex; flex-direction:column; gap:12px; width:100%; box-sizing:border-box}
.admin-mod-card{background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:14px 16px; display:flex; flex-direction:column; gap:10px; box-sizing:border-box; width:100%}
.admin-mod-top{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; border-bottom:1px solid var(--line-soft); padding-bottom:10px}
.admin-mod-title{display:flex; align-items:center; gap:10px; min-width:0}
.admin-mod-ico{font-size:22px; line-height:1; flex:0 0 auto}
.admin-mod-name{font-size:15px; font-weight:700; color:var(--ink)}
.admin-mod-desc{font-size:12px; color:var(--muted); margin-top:1px}
.admin-toggle-label{display:inline-flex; align-items:center; gap:7px; cursor:pointer; background:var(--surface); border:1px solid var(--line); padding:6px 11px; border-radius:8px; font-size:13px; font-weight:600; color:var(--ink); flex:0 0 auto; user-select:none}
.admin-toggle-label input{width:17px; height:17px; margin:0; accent-color:var(--accent); cursor:pointer}

.admin-mod-mode-box{display:flex; flex-direction:column; gap:7px; width:100%; box-sizing:border-box}
.admin-mod-mode-label{font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; font-weight:600; color:var(--muted)}
.admin-mod-mode-options{display:grid; grid-template-columns:1fr 1fr; gap:8px; width:100%; box-sizing:border-box}
.admin-mode-pill{display:flex; align-items:flex-start; gap:9px; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:10px 12px; cursor:pointer; transition:border-color .15s, background .15s; box-sizing:border-box; user-select:none; min-width:0}
.admin-mode-pill:hover{border-color:var(--accent)}
.admin-mode-pill input{margin-top:2px; accent-color:var(--accent); cursor:pointer; flex:0 0 auto}
.admin-pill-content{display:flex; flex-direction:column; gap:2px; min-width:0}
.admin-pill-title{font-size:13px; font-weight:600; color:var(--ink); line-height:1.3}
.admin-pill-desc{font-size:11.5px; color:var(--muted); line-height:1.3}

.admin-save-bar{display:flex; justify-content:flex-end; align-items:center; gap:12px; margin-top:14px; border-top:1px solid var(--line-soft); padding-top:14px; flex-wrap:wrap; width:100%; box-sizing:border-box}
.admin-save-status{font-size:13px; font-weight:600; color:var(--gain)}

@media (max-width:768px){
  .admin-container{gap:12px}
  .admin-picker-panel{padding:14px 12px}
  .custom-dropdown-search-input{font-size:15px}
  
  .admin-user-card{padding:14px 12px}
  .admin-mod-card{padding:12px 10px}
  .admin-mod-top{flex-direction:column; align-items:stretch; gap:8px}
  .admin-toggle-label{width:100%; justify-content:center; padding:9px 12px}
  .admin-mod-mode-options{grid-template-columns:1fr; gap:6px}
  .admin-mode-pill{padding:10px 12px}
  
  .admin-save-bar{flex-direction:column; align-items:stretch; gap:8px}
  .admin-save-bar button{width:100%; padding:12px 16px; font-size:14.5px}
  .admin-save-status{text-align:center}
}

/* ============================================================================
   Modül 4: Patates Dağıtım & Sipariş Takibi Stilleri
   ========================================================================== */
.pat-container{display:flex; flex-direction:column; gap:16px; width:100%; box-sizing:border-box}

.pat-head{
  display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;
  gap:12px; margin-bottom:4px;
}
.pat-titles h2{margin:0; font-size:20px; display:flex; align-items:center; gap:8px}
.pat-titles p{margin:4px 0 0; font-size:13px; color:var(--muted)}
.pat-head-actions{display:flex; align-items:center; gap:8px; flex-wrap:wrap}

/* İstatistik Kartları Grid */
.pat-stats-grid{
  display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr));
  gap:10px; width:100%; box-sizing:border-box;
}
.pat-stat-card{
  background:var(--surface); border:1px solid var(--line); border-radius:10px;
  padding:12px 14px; display:flex; flex-direction:column; gap:3px; box-sizing:border-box;
  transition:border-color .15s;
}
.pat-stat-card:hover{border-color:var(--accent)}
.pat-stat-lbl{font-size:11px; text-transform:uppercase; letter-spacing:.05em; font-weight:700; color:var(--muted)}
.pat-stat-val{font-size:20px; font-weight:700; font-family:"IBM Plex Mono",monospace; color:var(--ink); line-height:1.2}
.pat-stat-sub{font-size:11px; color:var(--muted); line-height:1.2}
.pat-stat-card.stat-gain .pat-stat-val{color:var(--gain)}
.pat-stat-card.stat-loss .pat-stat-val{color:var(--loss)}
.pat-stat-card.stat-accent .pat-stat-val{color:var(--accent)}

/* Alt Sekmeler (Siparişler, Stok/Araç, Çuval Tipleri) */
.pat-subnav{
  display:flex; gap:6px; border-bottom:1px solid var(--line-soft);
  padding-bottom:10px; overflow-x:auto; -webkit-overflow-scrolling:touch; width:100%;
}
.pat-subnav-btn{
  padding:8px 14px; border-radius:8px; font-size:13px; font-weight:600;
  border:1px solid transparent; background:transparent; color:var(--muted);
  cursor:pointer; display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  transition:all .15s;
}
.pat-subnav-btn:hover{color:var(--ink); background:var(--surface-2)}
.pat-subnav-btn.is-active{background:var(--accent-soft); color:var(--accent); border-color:var(--line-soft)}

/* Filtre & Arama Çubuğu */
.pat-filter-box{
  background:var(--surface); border:1px solid var(--line); border-radius:10px;
  padding:12px 14px; display:flex; flex-direction:column; gap:10px; width:100%; box-sizing:border-box;
}
.pat-filter-top{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap}
.pat-chips{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.pat-chip{
  padding:6px 12px; font-size:12.5px; font-weight:600; border-radius:20px;
  border:1px solid var(--line); background:var(--surface-2); color:var(--ink);
  cursor:pointer; display:inline-flex; align-items:center; gap:5px; transition:all .12s;
  user-select:none;
}
.pat-chip:hover{border-color:var(--accent)}
.pat-chip.is-active{background:var(--accent); color:#fff; border-color:var(--accent)}
.pat-chip.chip-loss.is-active{background:var(--loss); color:#fff; border-color:var(--loss)}
.pat-chip.chip-gain.is-active{background:var(--gain); color:#fff; border-color:var(--gain)}
.pat-chip-count{font-size:11px; opacity:0.85; padding:1px 6px; border-radius:10px; background:rgba(0,0,0,0.08)}
.pat-chip.is-active .pat-chip-count{background:rgba(255,255,255,0.25)}

.pat-search-wrap{position:relative; width:100%; box-sizing:border-box; display:flex; align-items:center}
.pat-search-ico{
  position:absolute; left:14px; top:50%; transform:translateY(-50%);
  font-size:16px; color:var(--muted); pointer-events:none; z-index:2; line-height:1;
  display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px;
}
.pat-search-input, input[type=text].pat-search-input{
  width:100% !important; min-height:44px !important; padding:10px 38px 10px 46px !important;

function readState(){

  var embedded=fallback;
  try{ embedded=JSON.parse(document.getElementById("app-state").textContent)||fallback; }catch(e){}
  var local=null;

  if(local && Number(local.savedAt||0)>Number(embedded.savedAt||0)) return normalize(local);
  return normalize(embedded);
}
function normalize(s){
  s=s||{};
  var defCuval = [
    { id: "ct_std", ad: "Standart Çuval (~36 kg)", kg: 36, fiyat: 1300 },
    { id: "ct_yarim", ad: "Yarım Çuval (~18 kg)", kg: 18, fiyat: 650 }
  ];
  var pat = (s.patates && typeof s.patates === "object") ? s.patates : {};
  return {
    savedAt:Number(s.savedAt)||0,
    usdRate:num(s.usdRate)||0,
    eurRate:num(s.eurRate)||0,
    rateDate:String(s.rateDate||""),
    rows:(Array.isArray(s.rows)?s.rows:[]).map(function(r){
      return {id:String(r.id||uid()),year:parseInt(r.year,10)||new Date().getFullYear(),
        month:Math.min(12,Math.max(1,parseInt(r.month,10)||1)),
        usd:num(r.usd),usdTl:num(r.usdTl),eur:num(r.eur),eurTl:num(r.eurTl),extra:num(r.extra),tax:num(r.tax),
        usdDoc:normDoc(r.usdDoc),eurDoc:normDoc(r.eurDoc)};
    }),
    butce:(s.butce&&typeof s.butce==="object")?s.butce:{taksitler:[],aylar:[]},
    odemeler:Array.isArray(s.odemeler)?s.odemeler:[],
    patates:{
      cuvalTipleri: (Array.isArray(pat.cuvalTipleri) && pat.cuvalTipleri.length) ? pat.cuvalTipleri : defCuval,
      sevkiyatlar: Array.isArray(pat.sevkiyatlar) ? pat.sevkiyatlar : [],
      aracYuklemeler: Array.isArray(pat.aracYuklemeler) ? pat.aracYuklemeler : [],
      siparisler: Array.isArray(pat.siparisler) ? pat.siparisler : []
    }
  };
}
function uid(){ return "r"+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36); }
function num(v){
  if(typeof v==="number") return isFinite(v)?v:0;
  var s=String(v==null?"":v).trim().replace(/\s/g,"");
  if(!s) return 0;
  if(s.indexOf(",")>-1 && s.indexOf(".")>-1) s=s.replace(/\./g,"").replace(",",".");
  else if(s.indexOf(",")>-1) s=s.replace(",",".");
  var n=parseFloat(s); return isFinite(n)?n:0;
}
function fmt(n,d){
  d=d==null?2:d;
  if(!isFinite(n)) n=0;
  return n.toLocaleString("tr-TR",{minimumFractionDigits:d,maximumFractionDigits:d});
}
function tl(n,d){ return fmt(n,d==null?2:d)+" ₺"; }
function key(r){ return r.year*12+r.month; }
function normDoc(v){
  if(!v) return null;
  if(typeof v==="string"){ var u=v.trim(); return u?{kind:"url",url:u}:null; }
  if(v.kind==="file"&&v.id) return {kind:"file",id:String(v.id),name:String(v.name||"dekont.pdf")};
  if(v.kind==="storage"&&v.path) return {kind:"storage",path:String(v.path),name:String(v.name||"dekont.pdf")};
  if(v.url) { var t=String(v.url).trim(); return t?{kind:"url",url:t}:null; }
  return null;
}
function docLabel(d){ return d ? (d.kind==="file" ? d.name : d.url) : ""; }
function docUrl(v){
  var s=String(v==null?"":v).trim();
  if(!s) return "";
  if(/^\s*(javascript|data|vbscript|blob):/i.test(s)) return "";
  if(/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(s)) return s;
  if(/^[A-Za-z]:[\\/]/.test(s)) return "file:///"+s.replace(/\\/g,"/");
  if(/^\\\\/.test(s)) return "file://"+s.replace(/\\/g,"/");
  if(/^\//.test(s)) return "file://"+s;
  if(/^www\./i.test(s)) return "https://"+s;
  return s;
}
function attr(s){ return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function amount(val,doc,label){
  if(!val) return '<span class="dim">—</span>';
  var d=normDoc(doc);
  if(!d) return fmt(val);
  if(d.kind==="file")
    return '<a class="doclink" href="#" data-file="'+attr(d.id)+'" title="'+attr(label+" · "+d.name)+'">'+fmt(val)+'<span class="doc-ico">↗</span></a>';
  if(d.kind==="storage")
    return '<a class="doclink" href="#" data-sfile="'+attr(d.path)+'" title="'+attr(label+" · "+d.name)+'">'+fmt(val)+'<span class="doc-ico">↗</span></a>';
  var u=docUrl(d.url);
  if(!u) return fmt(val);
  return '<a class="doclink" href="'+attr(u)+'" target="_blank" rel="noopener" title="'+attr(label+" · "+d.url)+'">'+fmt(val)+'<span class="doc-ico">↗</span></a>';
}

function derive(r){
  var usdRate = r.usd>0 ? r.usdTl/r.usd : 0;
  var eurRate = r.eur>0 ? r.eurTl/r.eur : 0;
  var yatan = r.usdTl + r.eurTl + (r.extra||0);
  var iade = yatan*r.tax/100;
  var net = yatan - iade;
  var bugun = r.usd*state.usdRate + r.eur*state.eurRate;
  return {usdRate:usdRate,eurRate:eurRate,yatan:yatan,iade:iade,net:net,bugun:bugun,fark:bugun-net};
}
function totals(){
  var t={usd:0,usdTl:0,eur:0,eurTl:0,extra:0,yatan:0,iade:0,net:0,bugun:0};
  state.rows.forEach(function(r){
    var d=derive(r);
    t.usd+=r.usd; t.usdTl+=r.usdTl; t.eur+=r.eur; t.eurTl+=r.eurTl; t.extra+=(r.extra||0);
    t.yatan+=d.yatan; t.iade+=d.iade; t.net+=d.net; t.bugun+=d.bugun;
  });
  t.fark=t.bugun-t.net;
  t.yuzde = t.net>0 ? (t.fark/t.net*100) : 0;
  t.ortUsd = t.usd>0 ? t.usdTl/t.usd : 0;
  t.ortEur = t.eur>0 ? t.eurTl/t.eur : 0;
  return t;
}

}

/* ==========================================================================
   DÖVİZ BİRİKİM TAHMİNİ & 60 AYLIK AYRI SİGORTA PROJEKSİYONU
   ========================================================================== */
var tahminState = {
  accordionAcik: false,
  activeTab: "usd", // "usd" | "eur" | "all"
  usd: {
    vadeAy: 60,
    aylikMiktar: null,
    yillikArtis: null,
    taxRate: null
  },
  eur: {
    vadeAy: 60,
    aylikMiktar: null,
    yillikArtis: null,
    taxRate: null
  },
  tabloAcik: false,
  raporAcik: false
};

function findPolicyStart(rows, cur) {
  var sorted = rows.filter(function(r){ return (r[cur] || 0) > 0; })
                   .sort(function(a,b){ return (a.year * 12 + a.month) - (b.year * 12 + b.month); });
  if (sorted.length > 0) {
    return { year: sorted[0].year, month: sorted[0].month };
  }
  return cur === "usd" ? { year: 2026, month: 4 } : { year: 2026, month: 6 };
}

function calcHistoricalCagr(rows, cur, baseRate) {
  var sorted = rows.filter(function(r){ return (r[cur] || 0) > 0; })
                   .sort(function(a,b){ return (a.year * 12 + a.month) - (b.year * 12 + b.month); });
  if (sorted.length < 2) return cur === "usd" ? 32 : 30;
  var first = sorted[0];
  var firstTl = cur === "usd" ? first.usdTl : first.eurTl;
  var firstAmt = first[cur];
  if (!firstAmt || !firstTl) return cur === "usd" ? 32 : 30;
  var firstRate = firstTl / firstAmt;

  var last = sorted[sorted.length - 1];
  var monthDiff = (last.year * 12 + last.month) - (first.year * 12 + first.month);
  if (monthDiff < 1) return cur === "usd" ? 32 : 30;

  var currentRate = num(baseRate) || (cur === "usd" ? 48.07 : 55.98);
  var growth = currentRate / firstRate;
  var annualized = Math.pow(growth, 12 / monthDiff) - 1;
  var pct = Math.round(annualized * 100);
  if (isNaN(pct) || pct <= 5 || pct > 120) return cur === "usd" ? 32 : 30;
  return pct;
}

function getPolicyDefaults(rows, cur, baseRate) {
  var sorted = rows.filter(function(r){ return (r[cur] || 0) > 0; });
  var count = sorted.length;
  var sumAmt = 0, sumTl = 0, sumTax = 0;
  sorted.forEach(function(r){
    sumAmt += r[cur] || 0;
    sumTl += (cur === "usd" ? r.usdTl : r.eurTl) || 0;
    sumTax += r.tax || 0;
  });
  var avgAmt = count > 0 ? Math.round(sumAmt / count) : (cur === "usd" ? 250 : 150);
  var avgTax = count > 0 ? Math.round(sumTax / count) : 27;
  var histCagr = calcHistoricalCagr(rows, cur, baseRate);
  return {
    avgAmt: avgAmt,
    avgTax: avgTax,
    histCagr: histCagr
  };
}

function simulateSinglePolicy(cur, config) {
  var rows = config.rows || [];
  var baseRate = config.baseRate;
  var start = config.start;
  var vadeAy = config.vadeAy;
  var aylikMiktar = config.aylikMiktar;
  var yillikArtis = config.yillikArtis;
  var taxRate = config.taxRate;
  var refKey = config.refKey;

  var annualFactor = Math.max(0.01, 1 + (yillikArtis / 100));
  var monthlyCompound = Math.pow(annualFactor, 1 / 12);

  var rowMap = {};
  rows.forEach(function(r){
    if ((r[cur] || 0) > 0) {
      rowMap[r.year + "-" + r.month] = r;
    }
  });

  var cumAmount = 0;
  var cumNetTl = 0;
  var timeline = [];

  for (var m = 1; m <= vadeAy; m++) {
    var totalM = (start.month - 1) + (m - 1);
    var y = start.year + Math.floor(totalM / 12);
    var mo = (totalM % 12) + 1;
    var itemKey = y * 12 + mo;
    var existing = rowMap[y + "-" + mo];
    var isActual = false;

    var rate = 0;
    var addAmount = 0;
    var netTl = 0;

    if (existing && itemKey <= refKey) {
      isActual = true;
      addAmount = existing[cur];
      var grossTl = cur === "usd" ? existing.usdTl : existing.eurTl;
      rate = addAmount > 0 ? (grossTl / addAmount) : baseRate;
      var refund = grossTl * (existing.tax / 100);
      netTl = grossTl - refund;
    } else {
      isActual = false;
      addAmount = aylikMiktar;
      var futureDiff = Math.max(0, itemKey - refKey);
      rate = baseRate * Math.pow(monthlyCompound, futureDiff);
      var gross = addAmount * rate;
      var ref = gross * (taxRate / 100);
      netTl = gross - ref;
    }

    cumAmount += addAmount;
    cumNetTl += netTl;
    var pVal = cumAmount * rate;
    var profit = pVal - cumNetTl;
    var roi = cumNetTl > 0 ? (profit / cumNetTl * 100) : 0;
    var mult = cumNetTl > 0 ? (pVal / cumNetTl) : 0;

    var curSym = cur === "usd" ? "$" : "€";

    timeline.push({
      m: m,
      year: y,
      month: mo,
      label: AYLAR[mo - 1] + " " + y,
      isActual: isActual,
      rate: rate,
      usdRate: cur === "usd" ? rate : 0,
      eurRate: cur === "eur" ? rate : 0,
      addAmount: addAmount,
      curSym: curSym,
      addAmountText: "+" + fmt(addAmount, 0) + " " + curSym,
      addUsd: cur === "usd" ? addAmount : 0,
      addEur: cur === "eur" ? addAmount : 0,
      netTl: netTl,
      cumAmount: cumAmount,
      cumUsd: cur === "usd" ? cumAmount : 0,
      cumEur: cur === "eur" ? cumAmount : 0,
      cumNetTl: cumNetTl,
      pVal: pVal,
      profit: profit,
      roi: roi,
      mult: mult
    });
  }

  return timeline;
}

function simulateCombinedPolicy(config) {
  var usdTimeline = config.usdTimeline;
  var eurTimeline = config.eurTimeline;
  var baseUsdRate = config.baseUsdRate;
  var baseEurRate = config.baseEurRate;

  var usdMap = {}, eurMap = {};
  var minKey = Infinity, maxKey = -Infinity;

  usdTimeline.forEach(function(item){
    var k = item.year * 12 + item.month;
    usdMap[k] = item;
    if (k < minKey) minKey = k;
    if (k > maxKey) maxKey = k;
  });

  eurTimeline.forEach(function(item){
    var k = item.year * 12 + item.month;
    eurMap[k] = item;
    if (k < minKey) minKey = k;
    if (k > maxKey) maxKey = k;
  });

  var timeline = [];
  var mIdx = 0;
  var cumNetTl = 0;

  for (var k = minKey; k <= maxKey; k++) {
    mIdx++;
    var y = Math.floor((k - 1) / 12);
    var mo = ((k - 1) % 12) + 1;
    var uItem = usdMap[k];
    var eItem = eurMap[k];

    var addUsd = uItem ? uItem.addAmount : 0;
    var addEur = eItem ? eItem.addAmount : 0;
    var uRate = uItem ? uItem.rate : (timeline.length ? timeline[timeline.length - 1].usdRate : baseUsdRate);
    var eRate = eItem ? eItem.rate : (timeline.length ? timeline[timeline.length - 1].eurRate : baseEurRate);
    var netTl = (uItem ? uItem.netTl : 0) + (eItem ? eItem.netTl : 0);
    cumNetTl += netTl;

    var cumUsd = uItem ? uItem.cumAmount : (timeline.length ? timeline[timeline.length - 1].cumUsd : 0);
    var cumEur = eItem ? eItem.cumAmount : (timeline.length ? timeline[timeline.length - 1].cumEur : 0);

    var pVal = (cumUsd * uRate) + (cumEur * eRate);
    var profit = pVal - cumNetTl;
    var roi = cumNetTl > 0 ? (profit / cumNetTl * 100) : 0;
    var mult = cumNetTl > 0 ? (pVal / cumNetTl) : 0;

    var addAmountText = "";
    if (addUsd > 0 && addEur > 0) {
      addAmountText = "+" + fmt(addUsd, 0) + " $ / +" + fmt(addEur, 0) + " €";
    } else if (addUsd > 0) {
      addAmountText = "+" + fmt(addUsd, 0) + " $";
    } else if (addEur > 0) {
      addAmountText = "+" + fmt(addEur, 0) + " €";
    } else {
      addAmountText = "—";
    }

    var isActual = (uItem && uItem.isActual) || (eItem && eItem.isActual);

    timeline.push({
      m: mIdx,
      year: y,
      month: mo,
      label: AYLAR[mo - 1] + " " + y,
      isActual: isActual,
      usdRate: uRate,
      eurRate: eRate,
      rate: 0,
      addUsd: addUsd,
      addEur: addEur,
      addAmountText: addAmountText,
      netTl: netTl,
      cumUsd: cumUsd,
      cumEur: cumEur,
      cumNetTl: cumNetTl,
      pVal: pVal,
      profit: profit,
      roi: roi,
      mult: mult
    });
  }

  return timeline;
}

function renderTahmin(tot){
  var root = document.getElementById("tahminPanel");
  if(!root) return;
  var rows = state.rows || [];

  var baseUsdRate = num(state.usdRate) || 48.07;
  var baseEurRate = num(state.eurRate) || 55.98;

  // Reference date: last entered record month/year or current clock
  var refKey = (new Date().getFullYear()) * 12 + (new Date().getMonth() + 1);
  if (rows.length > 0) {
    var maxKey = 0;
    rows.forEach(function(r){
      var k = (r.year || 0) * 12 + (r.month || 0);
      if (k > maxKey) maxKey = k;
    });
    if (maxKey > refKey) refKey = maxKey;
  }

  // Currency specific starts and defaults
  var usdStart = findPolicyStart(rows, "usd");
  var eurStart = findPolicyStart(rows, "eur");

  var usdDef = getPolicyDefaults(rows, "usd", baseUsdRate);
  var eurDef = getPolicyDefaults(rows, "eur", baseEurRate);

  // Active configurations
  var usdConfig = {
    vadeAy: Math.max(1, parseInt(tahminState.usd.vadeAy, 10) || 60),
    aylikMiktar: (tahminState.usd.aylikMiktar !== null && tahminState.usd.aylikMiktar !== undefined) ? Number(tahminState.usd.aylikMiktar) : usdDef.avgAmt,
    yillikArtis: (tahminState.usd.yillikArtis !== null && tahminState.usd.yillikArtis !== undefined) ? Number(tahminState.usd.yillikArtis) : Math.min(45, Math.max(25, usdDef.histCagr || 32)),
    taxRate: (tahminState.usd.taxRate !== null && tahminState.usd.taxRate !== undefined) ? Number(tahminState.usd.taxRate) : usdDef.avgTax
  };

  var eurConfig = {
    vadeAy: Math.max(1, parseInt(tahminState.eur.vadeAy, 10) || 60),
    aylikMiktar: (tahminState.eur.aylikMiktar !== null && tahminState.eur.aylikMiktar !== undefined) ? Number(tahminState.eur.aylikMiktar) : eurDef.avgAmt,
    yillikArtis: (tahminState.eur.yillikArtis !== null && tahminState.eur.yillikArtis !== undefined) ? Number(tahminState.eur.yillikArtis) : Math.min(45, Math.max(25, eurDef.histCagr || 30)),
    taxRate: (tahminState.eur.taxRate !== null && tahminState.eur.taxRate !== undefined) ? Number(tahminState.eur.taxRate) : eurDef.avgTax
  };

  // Run single simulations
  var usdTimeline = simulateSinglePolicy("usd", {
    rows: rows,
    baseRate: baseUsdRate,
    start: usdStart,
    vadeAy: usdConfig.vadeAy,
    aylikMiktar: usdConfig.aylikMiktar,
    yillikArtis: usdConfig.yillikArtis,
    taxRate: usdConfig.taxRate,
    refKey: refKey
  });

  var eurTimeline = simulateSinglePolicy("eur", {
    rows: rows,
    baseRate: baseEurRate,
    start: eurStart,
    vadeAy: eurConfig.vadeAy,
    aylikMiktar: eurConfig.aylikMiktar,
    yillikArtis: eurConfig.yillikArtis,
    taxRate: eurConfig.taxRate,
    refKey: refKey
  });

  // Active tab selection
  var activeTab = tahminState.activeTab || "usd";
  if (activeTab !== "usd" && activeTab !== "eur" && activeTab !== "all") {
    activeTab = "usd";
  }

  var activeTimeline = [];
  var activeVade = 60;
  var startLabel = "";
  var endLabel = "";
  var finalItem = null;
  var milestones = [];

  if (activeTab === "usd") {
    activeTimeline = usdTimeline;
    activeVade = usdConfig.vadeAy;
    startLabel = activeTimeline[0].label;
    endLabel = activeTimeline[activeTimeline.length - 1].label;
    finalItem = activeTimeline[activeTimeline.length - 1];
  } else if (activeTab === "eur") {
    activeTimeline = eurTimeline;
    activeVade = eurConfig.vadeAy;
    startLabel = activeTimeline[0].label;
    endLabel = activeTimeline[activeTimeline.length - 1].label;
    finalItem = activeTimeline[activeTimeline.length - 1];
  } else {
    activeTimeline = simulateCombinedPolicy({
      usdTimeline: usdTimeline,
      eurTimeline: eurTimeline,
      baseUsdRate: baseUsdRate,
      baseEurRate: baseEurRate
    });
    activeVade = activeTimeline.length;
    startLabel = activeTimeline[0].label;
    endLabel = activeTimeline[activeTimeline.length - 1].label;
    finalItem = activeTimeline[activeTimeline.length - 1];
  }

  // Milestones: yearly and end
  for (var step = 12; step < activeTimeline.length; step += 12) {
    milestones.push(activeTimeline[step - 1]);
  }
  if (milestones.indexOf(finalItem) === -1) {
    milestones.push(finalItem);
  }

  var isAccOpen = !!tahminState.accordionAcik;

function bindTahminEvents(root, raporMetni){
  var accToggle = document.getElementById("tahminAccordionToggle");
  if(accToggle){
    accToggle.onclick = function(e){
      e.stopPropagation();
      tahminState.accordionAcik = !tahminState.accordionAcik;
      renderTahmin();
    };
  }
  if(!tahminState.accordionAcik) return;

  // TAB SEÇİMİ (USD, EUR, ALL)
  var tabs = root.querySelectorAll(".tahmin-tab[data-ttab]");
  for(var t=0; t<tabs.length; t++)(function(tabBtn){
    tabBtn.onclick = function(){
      tahminState.activeTab = tabBtn.getAttribute("data-ttab");
      renderTahmin();
    };
  })(tabs[t]);

  // Vade butonları
  var vBtns = root.querySelectorAll("[data-setvade]");
  for(var i=0; i<vBtns.length; i++)(function(btn){
    btn.onclick = function(){
      var v = parseInt(btn.getAttribute("data-setvade"), 10) || 60;
      if (tahminState.activeTab === "usd") {
        tahminState.usd.vadeAy = v;
      } else if (tahminState.activeTab === "eur") {
        tahminState.eur.vadeAy = v;
      }
      renderTahmin();
    };
  })(vBtns[i]);

  // Dolar preset butonları
  var uBtns = root.querySelectorAll("[data-setusd]");
  for(var u=0; u<uBtns.length; u++)(function(btn){
    btn.onclick = function(){
      tahminState.usd.aylikMiktar = parseFloat(btn.getAttribute("data-setusd")) || 250;
      renderTahmin();
    };
  })(uBtns[u]);

  // Euro preset butonları
  var eBtns = root.querySelectorAll("[data-seteur]");
  for(var e=0; e<eBtns.length; e++)(function(btn){
    btn.onclick = function(){
      tahminState.eur.aylikMiktar = parseFloat(btn.getAttribute("data-seteur")) || 150;
      renderTahmin();
    };
  })(eBtns[e]);

  // Artış preset butonları
  var aBtns = root.querySelectorAll("[data-setartis]");
  for(var a=0; a<aBtns.length; a++)(function(btn){
    btn.onclick = function(){
      var val = parseFloat(btn.getAttribute("data-setartis")) || 30;
      if (tahminState.activeTab === "usd") {
        tahminState.usd.yillikArtis = val;
      } else if (tahminState.activeTab === "eur") {
        tahminState.eur.yillikArtis = val;
      }
      renderTahmin();
    };
  })(aBtns[a]);

  // Vergi preset butonları
  var txBtns = root.querySelectorAll("[data-settax]");
  for(var tx=0; tx<txBtns.length; tx++)(function(btn){
    btn.onclick = function(){
      var tVal = parseFloat(btn.getAttribute("data-settax")) || 27;
      if (tahminState.activeTab === "usd") {
        tahminState.usd.taxRate = tVal;
      } else if (tahminState.activeTab === "eur") {
        tahminState.eur.taxRate = tVal;
      }
      renderTahmin();
    };
  })(txBtns[tx]);

  // Input alanları
  var vadeInp = document.getElementById("tahminVadeInp");
  if(vadeInp){
    vadeInp.onchange = function(){
      var v = Math.max(1, parseInt(this.value, 10) || 60);
      if (tahminState.activeTab === "usd") tahminState.usd.vadeAy = v;
      else if (tahminState.activeTab === "eur") tahminState.eur.vadeAy = v;
      renderTahmin();
    };
  }

  var usdInp = document.getElementById("tahminUsdInp");
  if(usdInp){
    usdInp.onchange = function(){
      tahminState.usd.aylikMiktar = Math.max(0, parseFloat(this.value) || 0);
      renderTahmin();
    };
  }

  var eurInp = document.getElementById("tahminEurInp");
  if(eurInp){
    eurInp.onchange = function(){
      tahminState.eur.aylikMiktar = Math.max(0, parseFloat(this.value) || 0);
      renderTahmin();
    };
  }

  var artisInp = document.getElementById("tahminArtisInp");
  if(artisInp){
    artisInp.onchange = function(){
      var aVal = Math.max(0, parseFloat(this.value) || 0);
      if (tahminState.activeTab === "usd") tahminState.usd.yillikArtis = aVal;
      else if (tahminState.activeTab === "eur") tahminState.eur.yillikArtis = aVal;
      renderTahmin();
    };
  }

  var artisUsdInp = document.getElementById("tahminArtisUsdInp");
  if(artisUsdInp){
    artisUsdInp.onchange = function(){
      tahminState.usd.yillikArtis = Math.max(0, parseFloat(this.value) || 0);
      renderTahmin();
    };
  }

  var artisEurInp = document.getElementById("tahminArtisEurInp");
  if(artisEurInp){
    artisEurInp.onchange = function(){
      tahminState.eur.yillikArtis = Math.max(0, parseFloat(this.value) || 0);
      renderTahmin();
    };
  }

  var taxInp = document.getElementById("tahminTaxInp");
  if(taxInp){
    taxInp.onchange = function(){
      var tVal = Math.max(0, Math.min(100, parseFloat(this.value) || 0));
      if (tahminState.activeTab === "usd") tahminState.usd.taxRate = tVal;
      else if (tahminState.activeTab === "eur") tahminState.eur.taxRate = tVal;
      renderTahmin();
    };
  }

  var btnTablo = document.getElementById("btnToggleTahminTablo");
  if(btnTablo){
    btnTablo.onclick = function(){
      tahminState.tabloAcik = !tahminState.tabloAcik;
      renderTahmin();
    };
  }

  var btnRapor = document.getElementById("btnToggleTahminRapor");
  if(btnRapor){
    btnRapor.onclick = function(){
      tahminState.raporAcik = !tahminState.raporAcik;
      renderTahmin();
    };
  }

  var btnKopya = document.getElementById("btnKopyalaTahminRapor");
  var kopyaStatus = document.getElementById("tahminKopyaStatus");
  if(btnKopya){
    btnKopya.onclick = function(){
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(raporMetni).then(function(){
          if(kopyaStatus){
            kopyaStatus.style.display = "inline";
            setTimeout(function(){ kopyaStatus.style.display = "none"; }, 3000);
          }
        }).catch(function(){
          alert("Metin kopyalanamadı. Raporu açıp kopyalayabilirsiniz.");
        });
      } else {
        tahminState.raporAcik = true;
        renderTahmin();
        alert("Rapor açıldı, metni seçip kopyalayabilirsiniz.");
      }
    };
  }
}


/* ---------- belge deposu (IndexedDB) ---------- */
var DB_NAME="doviz-defteri-docs", DB_STORE="files", dbP=null;
function idbOpen(){
  if(dbP) return dbP;
  dbP=new Promise(function(res,rej){
    try{
      if(!window.indexedDB) return rej(new Error("no-idb"));
      var q=indexedDB.open(DB_NAME,1);
      q.onupgradeneeded=function(e){ var d=e.target.result; if(!d.objectStoreNames.contains(DB_STORE)) d.createObjectStore(DB_STORE); };
      q.onsuccess=function(){ res(q.result); };
      q.onerror=function(){ rej(q.error||new Error("idb")); };
      setTimeout(function(){ rej(new Error("idb-timeout")); },4000);
    }catch(e){ rej(e); }
  }).catch(function(e){ dbP=null; throw e; });
  return dbP;
}
function idbTx(mode,fn){
  return idbOpen().then(function(db){
    return new Promise(function(res,rej){
      var tx=db.transaction(DB_STORE,mode), st=tx.objectStore(DB_STORE), out;
      out=fn(st);
      tx.oncomplete=function(){ res(out && out.result!==undefined ? out.result : out); };
      tx.onerror=function(){ rej(tx.error); };
      tx.onabort=function(){ rej(tx.error); };
    });
  });
}
function idbPut(id,rec){ return idbTx("readwrite",function(st){ st.put(rec,id); return true; }); }
function idbGet(id){ return idbTx("readonly",function(st){ return st.get(id); }); }
function idbDel(id){ return idbTx("readwrite",function(st){ st.delete(id); return true; }); }
function idbKeys(){ return idbTx("readonly",function(st){ return st.getAllKeys(); }); }
var idbOk=true;
idbOpen().catch(function(){ idbOk=false; var b=document.querySelectorAll("[data-pick]");
  for(var i=0;i<b.length;i++){ b[i].disabled=true; b[i].title="Bu tarayıcıda dosya saklanamıyor, bağlantı yapıştır."; } });

function cleanupDocs(){
  idbKeys().then(function(keys){
    var used={};
    state.rows.forEach(function(r){
      if(r.usdDoc&&r.usdDoc.kind==="file") used[r.usdDoc.id]=1;
      if(r.eurDoc&&r.eurDoc.kind==="file") used[r.eurDoc.id]=1;
    });
    if(pending.usd&&pending.usd.kind==="file") used[pending.usd.id]=1;
    if(pending.eur&&pending.eur.kind==="file") used[pending.eur.id]=1;
    (keys||[]).forEach(function(k){ if(!used[k]) idbDel(k); });
  }).catch(function(){});
}

/* ---------- dekont görüntüleyici ---------- */
function closeSheet(){ var o=document.querySelector(".overlay"); if(o) o.remove(); }
function sheet(inner){
  closeSheet();
  var o=document.createElement("div"); o.className="overlay";
  o.innerHTML='<div class="sheet" role="dialog" aria-modal="true">'+inner+'</div>';
  o.addEventListener("click",function(e){ if(e.target===o) closeSheet(); });
  o.querySelectorAll("[data-close]").forEach(function(b){ b.addEventListener("click",closeSheet); });
  document.body.appendChild(o);
  return o;
}
document.addEventListener("keydown",function(e){ if(e.key==="Escape") closeSheet(); });
function sheetMsg(text){
  sheet('<header><span class="nm">Dekont</span><span class="acts"><button type="button" class="btn ghost sm" data-close>Kapat</button></span></header>'+
        '<div class="msg">'+attr(text)+'</div>');
}
function openStorage(path){
  var w=null;
  try{ w=window.open("","_blank"); }catch(e){}
  if(!(window.DEFTER_DB && DEFTER_DB.girisli())){
    if(w){ try{ w.close(); }catch(e){} }
    sheetMsg("Dekontu açmak için önce giriş yapmalısın."); return;
  }
  DEFTER_DB.dosyaLink(path).then(function(u){
    if(w && !w.closed){ w.location.href=u; return; }
    var o=sheet('<header><span class="nm">Dekont</span><span class="acts">'+
      '<a class="btn ghost sm" href="'+attr(u)+'" target="_blank" rel="noopener">Yeni sekmede aç</a>'+
