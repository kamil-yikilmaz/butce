    m.push('        <input type="text" id="fSevNot" class="pat-form-input" placeholder="Tır plakası veya açıklama...">');
    m.push('      </div>');
    m.push('      <div class="pat-modal-foot">');
    m.push('        <button type="button" class="btn ghost sm" id="patModalIptal">İptal</button>');
    m.push('        <button type="submit" class="btn sm">💾 Sevkiyatı Ekle</button>');
    m.push('      </div>');
    m.push('    </form>');
  }

  // MODAL: ARACA YÜKLEME
  else if(modalTip === "arac"){
    m.push('    <div class="pat-modal-head">');
    m.push('      <h3>🚚 Araca Çuval Yükleme (Dağıtım)</h3>');
    m.push('      <button type="button" class="pat-modal-close" id="patModalClose">✕</button>');
    m.push('    </div>');
    m.push('    <form id="patAracForm" class="pat-modal-body">');
    m.push('      <div class="pat-form-group">');
    m.push('        <label for="fAracPlaka">Araç / Şoför / Plaka *</label>');
    m.push('        <input type="text" id="fAracPlaka" class="pat-form-input" placeholder="Örn: 06 ABC 123 (Dağıtım Aracı)" required>');
    m.push('      </div>');
    m.push('      <div class="pat-form-row">');
    m.push('        <div class="pat-form-group">');
    m.push('          <label for="fAracTarih">Yükleme Tarihi *</label>');
    m.push('          <input type="date" id="fAracTarih" class="pat-form-input" value="' + new Date().toISOString().slice(0, 10) + '" required>');
    m.push('        </div>');
    m.push('        <div class="pat-form-group">');
    m.push('          <label for="fAracCuval">Yüklenen Çuval Adedi *</label>');
    m.push('          <input type="number" id="fAracCuval" class="pat-form-input" min="1" step="1" placeholder="Örn: 50" required>');
    m.push('        </div>');
    m.push('      </div>');
    m.push('      <div class="pat-form-group">');
    m.push('        <label for="fAracNot">Açıklama / Not</label>');
    m.push('        <input type="text" id="fAracNot" class="pat-form-input" placeholder="İsteğe bağlı not...">');
    m.push('      </div>');
    m.push('      <div class="pat-modal-foot">');
    m.push('        <button type="button" class="btn ghost sm" id="patModalIptal">İptal</button>');
    m.push('        <button type="submit" class="btn sm">💾 Araca Yükle</button>');
    m.push('      </div>');
    m.push('    </form>');
  }

  // MODAL: ÇUVAL TİPİ
  else if(modalTip === "cuval"){
    var cTip = formTaslak || {};
    var isEditC = !!duzenlenenId;
    m.push('    <div class="pat-modal-head">');
    m.push('      <h3>' + (isEditC ? "✏️ Çuval Tipini Düzenle" : "🥔 Yeni Çuval Tipi Ekle") + '</h3>');
    m.push('      <button type="button" class="pat-modal-close" id="patModalClose">✕</button>');
    m.push('    </div>');
    m.push('    <form id="patCuvalForm" class="pat-modal-body">');
    m.push('      <div class="pat-form-group">');
    m.push('        <label for="fCuvalAd">Çuval Adı *</label>');
    m.push('        <input type="text" id="fCuvalAd" class="pat-form-input" placeholder="Örn: Standart Çuval (~36 kg)" value="' + escH(cTip.ad || "") + '" required>');
    m.push('      </div>');
    m.push('      <div class="pat-form-row">');
    m.push('        <div class="pat-form-group">');
    m.push('          <label for="fCuvalKg">Yaklaşık Ağırlık (kg)</label>');
    m.push('          <input type="number" id="fCuvalKg" class="pat-form-input" min="1" step="any" placeholder="36" value="' + (cTip.kg || 36) + '">');
    m.push('        </div>');
    m.push('        <div class="pat-form-group">');
    m.push('          <label for="fCuvalFiyat">Birim Satış Fiyatı (₺) *</label>');
    m.push('          <input type="number" id="fCuvalFiyat" class="pat-form-input" min="0" step="any" placeholder="1300" value="' + (cTip.fiyat || 1300) + '" required>');
    m.push('        </div>');
    m.push('      </div>');
    m.push('      <div class="pat-modal-foot">');
    m.push('        <button type="button" class="btn ghost sm" id="patModalIptal">İptal</button>');
    m.push('        <button type="submit" class="btn sm">💾 Kaydet</button>');
    m.push('      </div>');
    m.push('    </form>');
  }

  // MODAL: SEVKİYAT & ARAÇ YÜKLEME GEÇMİŞİ VE YÖNETİMİ
  else if(modalTip === "stok_yonetim"){
    var ozetS = hesaplaOzet(pat);
    var sevkiyatlar = pat.sevkiyatlar || [];
    var aracYuklemeler = pat.aracYuklemeler || [];

    m.push('    <div class="pat-modal-head">');
    m.push('      <h3>🚚 Sevkiyat & Araç Yükleme Yönetimi</h3>');
    m.push('      <button type="button" class="pat-modal-close" id="patModalClose">✕</button>');
    m.push('    </div>');
    m.push('    <div class="pat-modal-body">');

    // Stok Durum Kartları
    m.push('      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">');
    m.push('        <div class="pat-stat-card" style="padding:10px 12px; background:var(--surface-2);">');
    m.push('          <span class="pat-stat-lbl">📦 Depo Stoğu</span>');
    m.push('          <span class="pat-stat-val" style="font-size:18px;">' + fmtSayi(ozetS.depoKalan) + ' çuval</span>');
    m.push('          <span class="pat-stat-sub">Gelen: ' + fmtSayi(ozetS.gelenCuval) + ' | Yüklenen: ' + fmtSayi(ozetS.yuklenenCuval) + '</span>');
    m.push('        </div>');
    m.push('        <div class="pat-stat-card stat-accent" style="padding:10px 12px; background:var(--surface-2);">');
    m.push('          <span class="pat-stat-lbl">🚚 Araçta Kalan</span>');
    m.push('          <span class="pat-stat-val" style="font-size:18px;">' + fmtSayi(ozetS.aractaKalan) + ' çuval</span>');
    m.push('          <span class="pat-stat-sub">Dağıtılan: ' + fmtSayi(ozetS.teslimCuval) + ' çuval</span>');
    m.push('        </div>');
    m.push('      </div>');

    // Alt Sekmeler & Eylem Butonu
    m.push('      <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; border-bottom:1px solid var(--line-soft); padding-bottom:8px; flex-wrap:wrap;">');
    m.push('        <div style="display:flex; gap:6px;">');
    m.push('          <button type="button" class="pat-subnav-btn ' + (stokModalSekme === "gelen" ? "is-active" : "") + '" id="patStokSekmeGelen">📦 Gelen Sevkiyatlar (' + sevkiyatlar.length + ')</button>');
    m.push('          <button type="button" class="pat-subnav-btn ' + (stokModalSekme === "arac" ? "is-active" : "") + '" id="patStokSekmeArac">🚚 Araç Yüklemeleri (' + aracYuklemeler.length + ')</button>');
    m.push('        </div>');
    if(stokModalSekme === "gelen"){
      m.push('        <button type="button" class="btn sm" id="patAddSevkiyatBtn">+ Yeni Sevkiyat Ekle</button>');
    } else {
      m.push('        <button type="button" class="btn sm" id="patAddAracBtn">+ Araca Yükle</button>');
    }
    m.push('      </div>');

    // Liste İçeriği
    m.push('      <div class="pat-stock-list" style="max-height:360px; overflow-y:auto; padding-right:2px;">');
    if(stokModalSekme === "gelen"){
      if(sevkiyatlar.length === 0){
        m.push('        <div style="padding:24px 16px; text-align:center; color:var(--muted); font-size:13px; background:var(--surface-2); border-radius:8px;">Henüz kaydedilmiş bir sevkiyat bulunmuyor.</div>');
      } else {
        sevkiyatlar.slice().reverse().forEach(function(sev){
          m.push('        <div class="pat-stock-item">');
          m.push('          <div class="pat-stock-item-info">');
          m.push('            <div class="pat-stock-item-name">' + escH(sev.turAdi || "Sevkiyat") + '</div>');
          m.push('            <div class="pat-stock-item-meta">📅 ' + escH(sev.tarih || "") + (sev.not ? ' · ' + escH(sev.not) : '') + '</div>');
          m.push('          </div>');
          m.push('          <div style="display:flex; align-items:center; gap:8px;">');
          m.push('            <span class="pat-stock-item-badge">+' + fmtSayi(sev.cuval) + ' Çuval</span>');
          m.push('            <button type="button" class="icobtn" data-patsil-sev="' + sev.id + '" title="Sil" style="color:var(--loss); cursor:pointer;">✕</button>');
          m.push('          </div>');
          m.push('        </div>');
        });
      }
    } else {
      if(aracYuklemeler.length === 0){
        m.push('        <div style="padding:24px 16px; text-align:center; color:var(--muted); font-size:13px; background:var(--surface-2); border-radius:8px;">Henüz araca yükleme kaydı bulunmuyor.</div>');
      } else {
        aracYuklemeler.slice().reverse().forEach(function(ay){
          m.push('        <div class="pat-stock-item">');
          m.push('          <div class="pat-stock-item-info">');
          m.push('            <div class="pat-stock-item-name">' + escH(ay.plaka || "Dağıtım Aracı") + '</div>');
          m.push('            <div class="pat-stock-item-meta">📅 ' + escH(ay.tarih || "") + (ay.not ? ' · ' + escH(ay.not) : '') + '</div>');
          m.push('          </div>');
          m.push('          <div style="display:flex; align-items:center; gap:8px;">');
          m.push('            <span class="pat-stock-item-badge" style="color:var(--brass);">' + fmtSayi(ay.cuval) + ' Çuval</span>');
          m.push('            <button type="button" class="icobtn" data-patsil-arac="' + ay.id + '" title="Sil" style="color:var(--loss); cursor:pointer;">✕</button>');
          m.push('          </div>');
          m.push('        </div>');
        });
      }
    }
    m.push('      </div>');

    m.push('      <div class="pat-modal-foot">');
    m.push('        <button type="button" class="btn ghost sm" id="patModalKapat">Kapat</button>');
    m.push('      </div>');
    m.push('    </div>');
  }

  // MODAL: ÇUVAL VE FİYAT TİPLERİ YÖNETİMİ
  else if(modalTip === "cuval_yonetim"){
    var cTipleri = pat.cuvalTipleri || [];
    m.push('    <div class="pat-modal-head">');
    m.push('      <h3>⚙️ Çuval & Satış Fiyat Tipleri</h3>');
    m.push('      <button type="button" class="pat-modal-close" id="patModalClose">✕</button>');
    m.push('    </div>');
    m.push('    <div class="pat-modal-body">');
    m.push('      <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;">');
    m.push('        <div style="font-size:12.5px; color:var(--muted);">Farklı çuval boyutları (36 kg, 18 kg vb.) ve satış fiyatları</div>');
    m.push('        <button type="button" class="btn sm" id="patAddCuvalTipBtn">+ Yeni Çuval Tipi Ekle</button>');
    m.push('      </div>');

    m.push('      <div class="pat-cuval-list" style="margin-top:4px; max-height:380px; overflow-y:auto; padding-right:2px;">');
    cTipleri.forEach(function(c){
      m.push('        <div class="pat-cuval-card">');
      m.push('          <div class="pat-cuval-top">');
      m.push('            <div>');
      m.push('              <div class="pat-cuval-title">' + escH(c.ad) + '</div>');
      m.push('              <div class="pat-cuval-kg">Ağırlık: ' + (c.kg ? escH(c.kg) + ' kg' : 'Standart') + '</div>');
      m.push('            </div>');
      m.push('            <div class="pat-cuval-price">' + fmtTl(c.fiyat) + '</div>');
      m.push('          </div>');
      m.push('          <div style="display:flex; justify-content:flex-end; gap:6px; margin-top:6px; padding-top:6px; border-top:1px solid var(--line-soft);">');
      m.push('            <button type="button" class="btn ghost sm" data-patedit-cuval="' + c.id + '">✏️ Düzenle</button>');
      if(cTipleri.length > 1){
        m.push('            <button type="button" class="btn ghost sm" data-patsil-cuval="' + c.id + '" style="color:var(--loss);">🗑️ Sil</button>');
      }
      m.push('          </div>');
      m.push('        </div>');
    });
    m.push('      </div>');

    m.push('      <div class="pat-modal-foot">');
    m.push('        <button type="button" class="btn ghost sm" id="patModalKapat">Kapat</button>');
    m.push('      </div>');
    m.push('    </div>');
  }

  // MODAL: KISMİ / PARÇALI ÖDEME
  else if(modalTip === "kismi_odeme"){
    var sK = (pat.siparisler || []).find(function(x){ return x.id === duzenlenenId; }) || {};
    var topTutar = Number(sK.toplamTutar) || 0;
    var odenenTutar = (sK.odenenTutar != null) ? Number(sK.odenenTutar) : (sK.odendi ? topTutar : 0);
    var kalanBorc = Math.max(0, topTutar - odenenTutar);

    m.push('    <div class="pat-modal-head">');
    m.push('      <h3>💳 Kısmi / Parçalı Ödeme Girişi</h3>');
    m.push('      <button type="button" class="pat-modal-close" id="patModalClose">✕</button>');
    m.push('    </div>');
    m.push('    <form id="patKismiOdemeForm" class="pat-modal-body">');
    
    // Müşteri & Sipariş Özeti
    m.push('      <div style="background:var(--surface-2); padding:12px 14px; border-radius:8px; display:flex; flex-direction:column; gap:6px;">');
    m.push('        <div style="font-size:15px; font-weight:700; color:var(--ink);">👤 ' + escH(sK.musteriAd || "Müşteri") + '</div>');
    m.push('        <div style="display:flex; justify-content:space-between; font-size:13px; color:var(--muted);">');
    m.push('          <span>Toplam Sipariş Tutarı (' + (sK.cuvalAdet || 0) + ' Çuval):</span>');
    m.push('          <strong style="color:var(--ink); font-family:IBM Plex Mono,monospace;">' + fmtTl(topTutar) + '</strong>');
    m.push('        </div>');
    m.push('        <div style="display:flex; justify-content:space-between; font-size:13px; color:var(--gain);">');
    m.push('          <span>Şu Ana Kadar Alınan:</span>');
    m.push('          <strong style="font-family:IBM Plex Mono,monospace;">' + fmtTl(odenenTutar) + '</strong>');
    m.push('        </div>');
    m.push('        <div style="display:flex; justify-content:space-between; font-size:14px; font-weight:700; color:var(--loss); border-top:1px dashed var(--line); padding-top:4px;">');
    m.push('          <span>Mevcut Kalan Borç:</span>');
    m.push('          <strong style="font-family:IBM Plex Mono,monospace;">' + fmtTl(kalanBorc) + '</strong>');
    m.push('        </div>');
    m.push('      </div>');

    // Bu Sefer Alınan Tutar
    m.push('      <div class="pat-form-group">');
    m.push('        <label for="fKismiYeniEklenen">Bu Sefer Alınan / Eklenen Tutar (₺) *</label>');
    m.push('        <input type="number" id="fKismiYeniEklenen" class="pat-form-input" min="0" step="any" placeholder="Örn: 5000" autofocus required>');
    m.push('      </div>');

    // Hızlı Doldurma Butonları
    m.push('      <div style="display:flex; gap:6px; flex-wrap:wrap;">');
    if(kalanBorc > 0){
      m.push('        <button type="button" class="btn ghost sm" id="btnKismiKalanKapat" style="color:var(--gain); font-weight:600;">Tamamını Kapat (' + fmtTl(kalanBorc) + ')</button>');
    }
    if(kalanBorc >= 1000){
      m.push('        <button type="button" class="btn ghost sm" data-addhizli="1000">+1.000 ₺</button>');
    }
    if(kalanBorc >= 500){
      m.push('        <button type="button" class="btn ghost sm" data-addhizli="500">+500 ₺</button>');
    }
    m.push('      </div>');

    // Toplam Tahsil Edilecek Tutar (Canlı Hesaplanır)
    m.push('      <div class="pat-form-group" style="margin-top:6px;">');
    m.push('        <label for="fKismiToplamOdenen" style="font-size:12px; color:var(--muted);">Toplam Alınmış Olacak Tutar (₺):</label>');
    m.push('        <input type="number" id="fKismiToplamOdenen" class="pat-form-input" min="0" max="' + topTutar + '" step="any" value="' + odenenTutar + '">');
    m.push('      </div>');

    // Canlı Bilgi Kutusu
    m.push('      <div id="kismiCanliHesap" style="font-size:13px; padding:10px 12px; border-radius:8px; background:var(--surface-2); border:1px solid var(--line-soft);">');
    m.push('        İşlem sonrası kalan borç: <strong id="kismiCanliKalan">' + fmtTl(kalanBorc) + '</strong>');
    m.push('      </div>');

    m.push('      <div class="pat-modal-foot">');
    m.push('        <button type="button" class="btn ghost sm" id="patModalIptal">İptal</button>');
    m.push('        <button type="submit" class="btn sm">💾 Ödemeyi Kaydet</button>');
    m.push('      </div>');
    m.push('    </form>');
  }

  m.push('  </div>');
  m.push('</div>');
  return m.join("");
}

function bindPatatesEvents(root, pat){
  // Sekme butonları
  var tabBtns = root.querySelectorAll("[data-pattab]");
  for(var i=0; i<tabBtns.length; i++)(function(btn){
    btn.onclick = function(){
      aktifSekme = btn.getAttribute("data-pattab");
      patatesModulunuYukle();
    };
  })(tabBtns[i]);

  // Filtre çipleri
  var chipBtns = root.querySelectorAll("[data-patflt]");
  for(var j=0; j<chipBtns.length; j++)(function(btn){
    btn.onclick = function(){
      aktifFiltre = btn.getAttribute("data-patflt");
      patatesModulunuYukle();
    };
  })(chipBtns[j]);

  // Arama kutusu
  var searchInp = document.getElementById("patSearchInp");
  var searchClear = document.getElementById("patSearchClear");
  if(searchInp){
    searchInp.oninput = function(){
      aramaMetni = this.value;
      // Anlık filtrele
      var q = aramaMetni.trim().toLowerCase();
      var cards = root.querySelectorAll(".pat-order-card");
      for(var k=0; k<cards.length; k++){
        var cTxt = cards[k].textContent.toLowerCase();
        cards[k].style.display = (!q || cTxt.indexOf(q) > -1) ? "" : "none";
      }
      if(searchClear) searchClear.style.display = aramaMetni ? "flex" : "none";
    };
  }
  if(searchClear){
    searchClear.onclick = function(){
      aramaMetni = "";
      patatesModulunuYukle();
    };
  }

  // Üst eylem butonları
  var addSipBtn = document.getElementById("patYeniSiparisBtn");
  if(addSipBtn){
    addSipBtn.onclick = function(){
      duzenlenenId = null;
      formTaslak = null;
      modalTip = "siparis";
      patatesModulunuYukle();
    };
  }
  var emptyAddBtn = document.getElementById("patEmptyAddBtn");
  if(emptyAddBtn){
    emptyAddBtn.onclick = function(){
      duzenlenenId = null;
      formTaslak = null;
      modalTip = "siparis";
      patatesModulunuYukle();
    };
  }

  var addSevBtn = document.getElementById("patYeniSevkiyatBtn");
  if(addSevBtn){
    addSevBtn.onclick = function(){
      modalTip = "stok_yonetim";
      stokModalSekme = "gelen";
      patatesModulunuYukle();
    };
  }
  var addSevBtn2 = document.getElementById("patAddSevkiyatBtn");
  if(addSevBtn2){
    addSevBtn2.onclick = function(){
      modalTip = "sevkiyat";
      patatesModulunuYukle();
    };
  }

  var addAracBtn = document.getElementById("patAddAracBtn");
  if(addAracBtn){
    addAracBtn.onclick = function(){
      modalTip = "arac";
      patatesModulunuYukle();
    };
  }

  var tabGelen = document.getElementById("patStokSekmeGelen");
  if(tabGelen){
    tabGelen.onclick = function(){
      stokModalSekme = "gelen";
      patatesModulunuYukle();
    };
  }
  var tabArac = document.getElementById("patStokSekmeArac");
  if(tabArac){
    tabArac.onclick = function(){
      stokModalSekme = "arac";
      patatesModulunuYukle();
    };
  }

  var cuvalAyarBtn = document.getElementById("patCuvalAyarBtn");
  if(cuvalAyarBtn){
    cuvalAyarBtn.onclick = function(){
      modalTip = "cuval_yonetim";
      patatesModulunuYukle();
    };
  }
  var addCuvalTipBtn = document.getElementById("patAddCuvalTipBtn");
  if(addCuvalTipBtn){
    addCuvalTipBtn.onclick = function(){
      duzenlenenId = null;
      formTaslak = null;
      modalTip = "cuval";
      patatesModulunuYukle();
    };
  }
  var kapatBtn = document.getElementById("patModalKapat");
  if(kapatBtn){
    kapatBtn.onclick = function(){
      modalTip = null;
      patatesModulunuYukle();
    };
  }

  // Hızlı Tek Tıkla Teslimat Tiki
  var teslimBtns = root.querySelectorAll("[data-pattoggle-teslim]");
  for(var t=0; t<teslimBtns.length; t++)(function(btn){
    btn.onclick = function(e){
      e.stopPropagation();
      var id = btn.getAttribute("data-pattoggle-teslim");
      var s = (pat.siparisler || []).find(function(x){ return x.id === id; });
      if(!s) return;
      s.teslimEdildi = !s.teslimEdildi;
      s.teslimTarih = s.teslimEdildi ? new Date().toISOString().slice(0, 10) : "";
      kaydet(s.teslimEdildi ? "Sipariş teslim edildi olarak güncellendi" : "Teslimat geri alındı");
    };
  })(teslimBtns[t]);

  // Hızlı Tek Tıkla Ödeme Tiki
  var odemeBtns = root.querySelectorAll("[data-pattoggle-odeme]");
  for(var o=0; o<odemeBtns.length; o++)(function(btn){
    btn.onclick = function(e){
      e.stopPropagation();
      var id = btn.getAttribute("data-pattoggle-odeme");
      var s = (pat.siparisler || []).find(function(x){ return x.id === id; });
      if(!s) return;
      var topTutar = Number(s.toplamTutar) || 0;
      var curOdenen = (s.odenenTutar != null) ? Number(s.odenenTutar) : (s.odendi ? topTutar : 0);
      if(curOdenen >= topTutar && topTutar > 0){
        s.odenenTutar = 0;
        s.odendi = false;
        s.odemeTarih = "";
        kaydet("Ödeme durumu geri alındı (ödenmedi yapıldı)");
      } else {
        s.odenenTutar = topTutar;
        s.odendi = true;
        s.odemeTarih = new Date().toISOString().slice(0, 10);
        kaydet("Ödemenin tamamı tahsil edildi (" + fmtTl(topTutar) + ")");
      }
    };
  })(odemeBtns[o]);

  // Kısmi Ödeme Butonu
  var kismiBtns = root.querySelectorAll("[data-patkismi]");
  for(var kp=0; kp<kismiBtns.length; kp++)(function(btn){
    btn.onclick = function(e){
      e.stopPropagation();
      duzenlenenId = btn.getAttribute("data-patkismi");
      modalTip = "kismi_odeme";
      patatesModulunuYukle();
    };
  })(kismiBtns[kp]);

  // Tekrar Sipariş Butonu
  var tekrarBtns = root.querySelectorAll("[data-pattekrar]");
  for(var r=0; r<tekrarBtns.length; r++)(function(btn){
    btn.onclick = function(e){
      e.stopPropagation();
      var id = btn.getAttribute("data-pattekrar");
      var s = (pat.siparisler || []).find(function(x){ return x.id === id; });
      if(!s) return;
      duzenlenenId = null;
      formTaslak = {
        musteriAd: s.musteriAd,
        telefon: s.telefon,
        adres: s.adres,
        cuvalTipId: s.cuvalTipId,
        cuvalAdet: s.cuvalAdet,
        birimFiyat: s.birimFiyat,
        toplamTutar: s.toplamTutar,
        siparisTarih: new Date().toISOString().slice(0, 10),
        teslimEdildi: false,
        odendi: false,
        odenenTutar: 0,
        not: ""
      };
      modalTip = "siparis";
      patatesModulunuYukle();
    };
  })(tekrarBtns[r]);

  // Düzenle Butonu
  var editBtns = root.querySelectorAll("[data-patduzenle]");
  for(var ed=0; ed<editBtns.length; ed++)(function(btn){
    btn.onclick = function(e){
      e.stopPropagation();
      var id = btn.getAttribute("data-patduzenle");
      var s = (pat.siparisler || []).find(function(x){ return x.id === id; });
      if(!s) return;
      duzenlenenId = id;
      formTaslak = Object.assign({}, s);
      modalTip = "siparis";
      patatesModulunuYukle();
    };
  })(editBtns[ed]);

  // Sil Butonu
  var delBtns = root.querySelectorAll("[data-patsil]");
  for(var d=0; d<delBtns.length; d++)(function(btn){
    btn.onclick = function(e){
      e.stopPropagation();
      var id = btn.getAttribute("data-patsil");
      var s = (pat.siparisler || []).find(function(x){ return x.id === id; });
      if(!s) return;
      if(confirm((s.musteriAd || "Bu") + " siparişini silmek istediğinize emin misiniz?")){
        pat.siparisler = (pat.siparisler || []).filter(function(x){ return x.id !== id; });
        kaydet("Sipariş silindi");
      }
    };
  })(delBtns[d]);

  // Sevkiyat Sil
  var delSevBtns = root.querySelectorAll("[data-patsil-sev]");
  for(var ds=0; ds<delSevBtns.length; ds++)(function(btn){
    btn.onclick = function(e){
      e.stopPropagation();
      var id = btn.getAttribute("data-patsil-sev");
      if(confirm("Bu sevkiyat kaydını silmek istediğinize emin misiniz?")){
        pat.sevkiyatlar = (pat.sevkiyatlar || []).filter(function(x){ return x.id !== id; });
        kaydet("Sevkiyat kaydı silindi");
      }
    };
  })(delSevBtns[ds]);

  // Araç Yükleme Sil
  var delAracBtns = root.querySelectorAll("[data-patsil-arac]");
  for(var da=0; da<delAracBtns.length; da++)(function(btn){
    btn.onclick = function(e){
      e.stopPropagation();
      var id = btn.getAttribute("data-patsil-arac");
      if(confirm("Bu araç yükleme kaydını silmek istediğinize emin misiniz?")){
        pat.aracYuklemeler = (pat.aracYuklemeler || []).filter(function(x){ return x.id !== id; });
        kaydet("Araç yükleme kaydı silindi");
      }
    };
  })(delAracBtns[da]);

  // Çuval Düzenle & Sil
  var editCuvalBtns = root.querySelectorAll("[data-patedit-cuval]");
  for(var ec=0; ec<editCuvalBtns.length; ec++)(function(btn){
    btn.onclick = function(e){
      e.stopPropagation();
      var id = btn.getAttribute("data-patedit-cuval");
      var c = (pat.cuvalTipleri || []).find(function(x){ return x.id === id; });
      if(!c) return;
      duzenlenenId = id;
      formTaslak = Object.assign({}, c);
      modalTip = "cuval";
      patatesModulunuYukle();
    };
  })(editCuvalBtns[ec]);

  var delCuvalBtns = root.querySelectorAll("[data-patsil-cuval]");
  for(var dc=0; dc<delCuvalBtns.length; dc++)(function(btn){
    btn.onclick = function(e){
      e.stopPropagation();
      var id = btn.getAttribute("data-patsil-cuval");
      if(confirm("Bu çuval tipini silmek istediğinize emin misiniz?")){
        pat.cuvalTipleri = (pat.cuvalTipleri || []).filter(function(x){ return x.id !== id; });
        kaydet("Çuval tipi silindi");
      }
    };
  })(delCuvalBtns[dc]);

  // Modal Kapatma
  function closeModal(){
    if(modalTip === "sevkiyat" || modalTip === "arac"){
      modalTip = "stok_yonetim";
    } else if(modalTip === "cuval"){
      modalTip = "cuval_yonetim";
    } else {
      modalTip = null;
    }
    patatesModulunuYukle();
  }
  var backdrop = document.getElementById("patModalBackdrop");
  if(backdrop) backdrop.onclick = closeModal;
  var closeBtn = document.getElementById("patModalClose");
  if(closeBtn) closeBtn.onclick = closeModal;
  var iptalBtn = document.getElementById("patModalIptal");
  if(iptalBtn) iptalBtn.onclick = closeModal;

  // Modal Form Gönderimleri:
  // 1. Sipariş Formu
  var sipForm = document.getElementById("patSiparisForm");
  if(sipForm){
    var cTipSel = document.getElementById("fCuvalTipId");
    var cAdetInp = document.getElementById("fCuvalAdet");
    var birimInp = document.getElementById("fBirimFiyat");
    var topInp = document.getElementById("fToplamTutar");

    function recalcTotal(){
      var bFiyat = parseFloat(birimInp.value) || 0;
      var adet = parseInt(cAdetInp.value, 10) || 0;
      topInp.value = bFiyat * adet;
    }

    if(cTipSel){
      cTipSel.onchange = function(){
        var opt = this.options[this.selectedIndex];
        var f = opt ? parseFloat(opt.getAttribute("data-fiyat")) : 1300;
        if(f > 0){
          birimInp.value = f;
          recalcTotal();
        }
      };
    }
    if(cAdetInp) cAdetInp.oninput = recalcTotal;
    if(birimInp) birimInp.oninput = recalcTotal;

    var musteriInp = document.getElementById("fMusteriAd");
    var oneriList = document.getElementById("fMusteriOneriList");
    var alertBox = document.getElementById("fMusteriVarAlert");
    var telInp = document.getElementById("fTelefon");
    var adresInp = document.getElementById("fAdres");

    // Sistemdeki kayıtlı tüm müşterileri topla
    var eskiMusteriler = [];
    var musMap = {};
    (pat.siparisler || []).forEach(function(item){
      var ad = (item.musteriAd || "").trim();
      if(!ad) return;
      var k = ad.toLowerCase();
      if(!musMap[k]){
        musMap[k] = {
          ad: ad,
          telefon: (item.telefon || "").trim(),
          adres: (item.adres || "").trim(),
          cuvalTipId: item.cuvalTipId || "",
          birimFiyat: item.birimFiyat || 0
        };
        eskiMusteriler.push(musMap[k]);
      } else {
        if(!musMap[k].telefon && item.telefon) musMap[k].telefon = item.telefon.trim();
        if(!musMap[k].adres && item.adres) musMap[k].adres = item.adres.trim();
      }
    });

    function checkMusteriOneri(){
      if(!musteriInp || !oneriList) return;
      var q = musteriInp.value.trim().toLowerCase();
      if(!q){
        oneriList.style.display = "none";
        oneriList.innerHTML = "";
        if(alertBox) alertBox.style.display = "none";
        return;
      }

      var matches = eskiMusteriler.filter(function(m){
        return m.ad.toLowerCase().indexOf(q) > -1 || (m.telefon && m.telefon.indexOf(q) > -1) || (m.adres && m.adres.toLowerCase().indexOf(q) > -1);
      });

      var tamEslesme = eskiMusteriler.find(function(m){ return m.ad.toLowerCase() === q; });

      if(tamEslesme && alertBox){
        alertBox.style.display = "block";
        alertBox.className = "pat-alert-box";
        alertBox.innerHTML = 'ℹ️ <strong>' + escH(tamEslesme.ad) + '</strong> daha önce kayıtlı! Bilgiler otomatik getirildi. Aynı müşteriye yeni bir sipariş açıyorsunuz.';
      } else if(alertBox){
        alertBox.style.display = "none";
      }

      if(matches.length === 0){
        oneriList.style.display = "none";
        oneriList.innerHTML = "";
        return;
      }

      oneriList.style.display = "block";
      var oHtml = [];
      matches.slice(0, 6).forEach(function(m, idx){
        oHtml.push('<div class="pat-suggest-item" data-sug-idx="' + idx + '">');
        oHtml.push('  <div class="pat-sug-name"><span>👤 <strong>' + escH(m.ad) + '</strong></span> <span class="pat-sug-badge">Kayıtlı Müşteri</span></div>');
        var detay = [];
        if(m.telefon) detay.push('📞 ' + escH(m.telefon));
        if(m.adres) detay.push('📍 ' + escH(m.adres));
        if(detay.length){
          oHtml.push('  <div class="pat-sug-sub">' + detay.join(' · ') + '</div>');
        }
        oHtml.push('</div>');
      });
      oneriList.innerHTML = oHtml.join("");

      var items = oneriList.querySelectorAll(".pat-suggest-item");
      for(var si=0; si<items.length; si++)(function(item, mObj){
        item.onmousedown = function(e){
          e.preventDefault();
          musteriInp.value = mObj.ad;
          if(telInp && mObj.telefon) telInp.value = mObj.telefon;
          if(adresInp && mObj.adres) adresInp.value = mObj.adres;
          if(mObj.cuvalTipId && cTipSel){
            cTipSel.value = mObj.cuvalTipId;
            cTipSel.dispatchEvent(new Event("change"));
          }
          oneriList.style.display = "none";
          if(alertBox){
            alertBox.style.display = "block";
            alertBox.className = "pat-alert-box is-success";
            alertBox.innerHTML = '✓ <strong>' + escH(mObj.ad) + '</strong> seçildi. Bilgiler otomatik dolduruldu.';
          }
        };
      })(items[si], matches[si]);
    }

    if(musteriInp){
      musteriInp.oninput = checkMusteriOneri;
      musteriInp.onfocus = checkMusteriOneri;
      musteriInp.onblur = function(){
        setTimeout(function(){
          if(oneriList) oneriList.style.display = "none";
        }, 220);
      };
    }

    var fOdendiCb = document.getElementById("fOdendi");
    var fOdenenWrap = document.getElementById("fOdenenTutarWrap");
    var fOdenenInp = document.getElementById("fOdenenTutar");
    if(fOdendiCb && fOdenenWrap){
      fOdendiCb.onchange = function(){
        if(this.checked){
          fOdenenWrap.style.display = "none";
          if(fOdenenInp && topInp) fOdenenInp.value = topInp.value;
        } else {
          fOdenenWrap.style.display = "block";
        }
      };
    }

    sipForm.onsubmit = function(e){
      e.preventDefault();
      var cTipId = cTipSel ? cTipSel.value : "";
      var cTipObj = (pat.cuvalTipleri || []).find(function(x){ return x.id === cTipId; });
      var cTipAd = cTipObj ? cTipObj.ad : "Standart Çuval";

      var topTutarVal = parseFloat(document.getElementById("fToplamTutar").value) || 0;
      var isOdendiCb = document.getElementById("fOdendi") ? document.getElementById("fOdendi").checked : false;
      var odenenTutarVal = 0;
      if(isOdendiCb){
        odenenTutarVal = topTutarVal;
      } else {
        var inpOd = document.getElementById("fOdenenTutar");
        odenenTutarVal = inpOd ? (parseFloat(inpOd.value) || 0) : 0;
      }
      var isTamOdendi = (topTutarVal > 0 && odenenTutarVal >= topTutarVal) || isOdendiCb;
      if(isTamOdendi && odenenTutarVal < topTutarVal) odenenTutarVal = topTutarVal;

      var payload = {
        id: duzenlenenId || pId("sip"),
        musteriAd: document.getElementById("fMusteriAd").value.trim(),
        telefon: document.getElementById("fTelefon").value.trim(),
        adres: document.getElementById("fAdres").value.trim(),
        siparisTarih: document.getElementById("fSiparisTarih").value || new Date().toISOString().slice(0, 10),
        cuvalTipId: cTipId,
        cuvalTipAd: cTipAd,
        cuvalAdet: parseInt(document.getElementById("fCuvalAdet").value, 10) || 1,
        birimFiyat: parseFloat(document.getElementById("fBirimFiyat").value) || 0,
        toplamTutar: topTutarVal,
        odenenTutar: odenenTutarVal,
        teslimEdildi: document.getElementById("fTeslimEdildi").checked,
        teslimTarih: document.getElementById("fTeslimEdildi").checked ? new Date().toISOString().slice(0, 10) : "",
        odendi: isTamOdendi,
        odemeTarih: isTamOdendi ? new Date().toISOString().slice(0, 10) : (odenenTutarVal > 0 ? new Date().toISOString().slice(0, 10) : ""),
        not: document.getElementById("fNot").value.trim()
      };

      var wasEditS = !!duzenlenenId;
      if(duzenlenenId){
        var idx = (pat.siparisler || []).findIndex(function(x){ return x.id === duzenlenenId; });
        if(idx > -1) pat.siparisler[idx] = payload;
      } else {
        pat.siparisler.push(payload);
      }

      modalTip = null;
      duzenlenenId = null;
      formTaslak = null;
      kaydet(wasEditS ? "Sipariş güncellendi" : "Yeni sipariş kaydedildi");
    };
  }

  // 1.1 Kısmi / Parçalı Ödeme Formu
  var kismiForm = document.getElementById("patKismiOdemeForm");
  if(kismiForm){
    var sK = (pat.siparisler || []).find(function(x){ return x.id === duzenlenenId; });
    if(sK){
      var kTopTutar = Number(sK.toplamTutar) || 0;
      var kOncekiOdenen = (sK.odenenTutar != null) ? Number(sK.odenenTutar) : (sK.odendi ? kTopTutar : 0);
      var fYeniEklenen = document.getElementById("fKismiYeniEklenen");
      var fTopOdenen = document.getElementById("fKismiToplamOdenen");
      var canliKalanEl = document.getElementById("kismiCanliKalan");
      var btnKapat = document.getElementById("btnKismiKalanKapat");

      function syncKismiCalculations(fromYeni){
        var yVal = parseFloat(fYeniEklenen ? fYeniEklenen.value : 0) || 0;
        var tVal = parseFloat(fTopOdenen ? fTopOdenen.value : 0) || 0;
        if(fromYeni){
          tVal = Math.min(kTopTutar, Math.max(0, kOncekiOdenen + yVal));
          if(fTopOdenen) fTopOdenen.value = tVal;
        } else {
          yVal = Math.max(0, tVal - kOncekiOdenen);
          if(fYeniEklenen) fYeniEklenen.value = yVal > 0 ? yVal : "";
        }
        var kalan = Math.max(0, kTopTutar - tVal);
        if(canliKalanEl){
          canliKalanEl.textContent = fmtTl(kalan);
          canliKalanEl.style.color = kalan === 0 ? "var(--gain)" : "var(--loss)";
        }
      }

      if(fYeniEklenen){
        fYeniEklenen.oninput = function(){ syncKismiCalculations(true); };
      }
      if(fTopOdenen){
        fTopOdenen.oninput = function(){ syncKismiCalculations(false); };
      }

      if(btnKapat){
        btnKapat.onclick = function(){
          var kalanSimdi = Math.max(0, kTopTutar - kOncekiOdenen);
          if(fYeniEklenen) fYeniEklenen.value = kalanSimdi;
          syncKismiCalculations(true);
        };
      }

      var quickBtns = kismiForm.querySelectorAll("[data-addhizli]");
      for(var qb=0; qb<quickBtns.length; qb++)(function(qBtn){
        qBtn.onclick = function(){
          var addAmount = parseFloat(qBtn.getAttribute("data-addhizli")) || 0;
          var curY = parseFloat(fYeniEklenen ? fYeniEklenen.value : 0) || 0;
          var maxCanAdd = Math.max(0, kTopTutar - kOncekiOdenen);
          var nextY = Math.min(maxCanAdd, curY + addAmount);
          if(fYeniEklenen) fYeniEklenen.value = nextY;
          syncKismiCalculations(true);
        };
      })(quickBtns[qb]);

      kismiForm.onsubmit = function(e){
        e.preventDefault();
        var nihaiOdenen = parseFloat(fTopOdenen ? fTopOdenen.value : 0) || 0;
        if(nihaiOdenen > kTopTutar) nihaiOdenen = kTopTutar;
        if(nihaiOdenen < 0) nihaiOdenen = 0;

        sK.odenenTutar = nihaiOdenen;
        sK.odendi = (nihaiOdenen >= kTopTutar && kTopTutar > 0);
        sK.odemeTarih = (nihaiOdenen > 0) ? new Date().toISOString().slice(0, 10) : "";

        modalTip = null;
        duzenlenenId = null;
        var mesaj = sK.odendi ? ("Ödemenin tamamı tahsil edildi (" + fmtTl(kTopTutar) + ")") : ("Kısmi ödeme kaydedildi (" + fmtTl(nihaiOdenen) + " / " + fmtTl(kTopTutar) + ")");
        kaydet(mesaj);
      };
    }
  }

  // 2. Sevkiyat Formu
  var sevForm = document.getElementById("patSevkiyatForm");
  if(sevForm){
    sevForm.onsubmit = function(e){
      e.preventDefault();
      var sPayload = {
        id: pId("sev"),
        turAdi: document.getElementById("fSevTur").value.trim(),
        tarih: document.getElementById("fSevTarih").value || new Date().toISOString().slice(0, 10),
        cuval: parseInt(document.getElementById("fSevCuval").value, 10) || 0,
        not: document.getElementById("fSevNot").value.trim()
      };
      pat.sevkiyatlar.push(sPayload);
      modalTip = "stok_yonetim";
      stokModalSekme = "gelen";
      kaydet("Sevkiyat girişi kaydedildi");
    };
  }

  // 3. Araç Yükleme Formu
  var aracForm = document.getElementById("patAracForm");
  if(aracForm){
    aracForm.onsubmit = function(e){
      e.preventDefault();
      var aPayload = {
        id: pId("arac"),
        plaka: document.getElementById("fAracPlaka").value.trim(),
        tarih: document.getElementById("fAracTarih").value || new Date().toISOString().slice(0, 10),
        cuval: parseInt(document.getElementById("fAracCuval").value, 10) || 0,
        not: document.getElementById("fAracNot").value.trim()
      };
      pat.aracYuklemeler.push(aPayload);
      modalTip = "stok_yonetim";
      stokModalSekme = "arac";
      kaydet("Araca yükleme kaydedildi");
    };
  }

  // 4. Çuval Tipi Formu
  var cuvalForm = document.getElementById("patCuvalForm");
  if(cuvalForm){
    cuvalForm.onsubmit = function(e){
      e.preventDefault();
      var cPayload = {
        id: duzenlenenId || pId("ct"),
        ad: document.getElementById("fCuvalAd").value.trim(),
        kg: parseFloat(document.getElementById("fCuvalKg").value) || 36,
        fiyat: parseFloat(document.getElementById("fCuvalFiyat").value) || 0
      };
      var wasEditC = !!duzenlenenId;
      if(duzenlenenId){
        var cIdx = (pat.cuvalTipleri || []).findIndex(function(x){ return x.id === duzenlenenId; });
        if(cIdx > -1) pat.cuvalTipleri[cIdx] = cPayload;
      } else {
        pat.cuvalTipleri.push(cPayload);
      }
      modalTip = "cuval_yonetim";
      duzenlenenId = null;
      formTaslak = null;
      kaydet(wasEditC ? "Çuval tipi güncellendi" : "Yeni çuval tipi eklendi");
    };
  }
}

// Dışa aktar ve ilk yükleme
window.patatesModulunuYukle = patatesModulunuYukle;

D.onState(function(){
  if(document.getElementById("mod4") && !document.getElementById("mod4").hidden){
    patatesModulunuYukle();
  }
});

// Sayfa yüklendiğinde mod4 aktifse çiz
setTimeout(function(){
  if(document.getElementById("mod4") && !document.getElementById("mod4").hidden){
    patatesModulunuYukle();
  }
}, 50);

})();
</script>

<script id="tcmb-kur">
(function(){
  var uk=document.getElementById("uk"), ek=document.getElementById("ek"), kt=document.getElementById("kt");
  if(!uk||!ek||!kt) return;
  var noteEl=document.querySelector(".rates .rate-note");
  if(noteEl) noteEl.id="fetchNote";
  var btn=document.createElement("button");
  btn.type="button"; btn.className="btn sm"; btn.id="fetchTcmb"; btn.textContent="🔄 TCMB'den Çek";
  btn.title="today.xml üzerinden Efektif Alış kurlarını çeker";
  var actions=document.querySelector(".rates .actions");
  if(actions) actions.insertBefore(btn,actions.firstChild); else document.querySelector(".rates").appendChild(btn);

  function note(t,warn){ var n=document.getElementById("fetchNote"); if(!n) return;
    n.textContent=t; n.style.color = warn ? "var(--brass)" : "var(--muted)"; }
  function setVal(el,v){ el.value=String(v).replace(".",","); el.dispatchEvent(new Event("input",{bubbles:true})); }
  function apply(u,e,d,kaynak){
    setVal(uk,u); setVal(ek,e);
    if(d){ kt.value=d; kt.dispatchEvent(new Event("input",{bubbles:true})); }
    note("TCMB ("+(d||"")+") Efektif Alış: $ "+(typeof fmt==="function"?fmt(u,4):u)+" · € "+(typeof fmt==="function"?fmt(e,4):e)+" · "+kaynak,false);
    try{
      var saveBtn=document.getElementById("saveRates");
      if(saveBtn) saveBtn.click();
    }catch(err){}
  }

  function parseXml(txt){
    if(!txt || typeof txt!=="string") return null;
    txt=txt.trim();
    if(txt.startsWith("{")){
      try{
        var j=JSON.parse(txt);
        return {
          usd: j.usd ? (j.usd.efektifAlis || j.usd.dovizAlis) : NaN,
          eur: j.eur ? (j.eur.efektifAlis || j.eur.dovizAlis) : NaN,
          tarih: j.tarih || ""
        };
      }catch(e){}
    }

    var mDate = txt.match(/Tarih_Date[^>]*Tarih="([^"]+)"/i);
    var tarih = mDate ? mDate[1] : "";

    function rate(code){
      var re = new RegExp('<Currency[^>]*(?:Kod|CurrencyCode)="' + code + '"[\\s\\S]*?<\\/Currency>', 'i');
      var m = txt.match(re);
      if(!m) return NaN;
      var chunk = m[0];
      // Kullanıcı tercihi: Efektif Alış (Banknote Buying)
      var b = chunk.match(/<BanknoteBuying>([^<]+)<\/BanknoteBuying>/i);
      var val = b ? parseFloat(b[1].trim().replace(",", ".")) : NaN;
      if(isNaN(val) || val <= 0){
        var f = chunk.match(/<ForexBuying>([^<]+)<\/ForexBuying>/i);
        val = f ? parseFloat(f[1].trim().replace(",", ".")) : NaN;
      }
      return val;
    }

    return {usd:rate("USD"), eur:rate("EUR"), tarih:tarih};
  }

        if(k && isFinite(k.usd) && k.usd > 0 && isFinite(k.eur) && k.eur > 0){
          found=k;

        }
      }catch(e){}
    }

    btn.textContent="🔄 TCMB'den Çek";

      apply(found.usd, found.eur, found.tarih, kaynak);

    }

      sheet(
        '<header><span class="nm">TCMB Kurlarını Getir</span><span class="acts"><button type="button" class="btn ghost sm" data-close>Kapat</button></span></header>' +
        '<div class="msg" style="line-height:1.6">' +
          '<p>Tarayıcınızın CORS güvenlik kısıtlaması nedeniyle doğrudan <b>today.xml</b> bağlantısına erişilemedi.</p>' +
          '<p>1. Aşağıdaki bağlantıya tıklayarak TCMB sayfasını açın:<br>' +
          '<a href="https://www.tcmb.gov.tr/kurlar/today.xml" target="_blank" rel="noopener" class="tcmb-link" style="font-size:14px; margin:6px 0; display:inline-block">🔗 TCMB today.xml\'i Aç ↗</a></p>' +
          '<p>2. Açılan sayfadaki XML içeriğini kopyalayıp aşağıdaki kutucuğa yapıştırın:</p>' +
          '<textarea id="tcmbXmlPaste" style="width:100%; height:110px; font-family:monospace; font-size:12px; padding:8px; border:1px solid var(--line); border-radius:6px; resize:vertical" placeholder="<Tarih_Date..."></textarea>' +
          '<div style="margin-top:12px; text-align:right">' +
            '<button type="button" class="btn sm" id="btnXmlIsle">Kurları Çıkar ve Uygula</button>' +
          '</div>' +
        '</div>'
      );
      var btnIsle = document.getElementById("btnXmlIsle");
      if(btnIsle){
        btnIsle.addEventListener("click", function(){
          var txt = (document.getElementById("tcmbXmlPaste") || {}).value || "";

          }
        });
      }
    }
  }

  btn.addEventListener("click",function(){ pull(true); });
  // Sayfa açılışında kurları otomatik kontrol et (mevcut kurlar 0 veya boşsa)
  if(!num(uk.value) || !num(ek.value)) { pull(false); }
})();

<script id="backup-tools">

      '<input type="file" id="bkFile" accept="application/json,.json" hidden>'+
    '</span>';
  host.appendChild(bar);

  function b64(blob){
    return new Promise(function(res,rej){
      var r=new FileReader();
      r.onload=function(){ var s=String(r.result); res(s.slice(s.indexOf(",")+1)); };
      r.onerror=function(){ rej(r.error); };
      r.readAsDataURL(blob);
    });
  }
  function fromB64(b,type){
    var bin=atob(b), n=bin.length, arr=new Uint8Array(n);
    for(var i=0;i<n;i++) arr[i]=bin.charCodeAt(i);
    return new Blob([arr],{type:type||"application/pdf"});
  }
  function usedIds(st){
    var ids=[];
    (st.rows||[]).forEach(function(r){
      if(r.usdDoc&&r.usdDoc.kind==="file") ids.push(r.usdDoc.id);
      if(r.eurDoc&&r.eurDoc.kind==="file") ids.push(r.eurDoc.id);
    });

  }
  document.getElementById("bkExport").addEventListener("click",function(){
    var st=D.getState();
    var ids=usedIds(st), docs={}, chain=Promise.resolve();
    D.setStatus("Yedek hazırlanıyor…","");
    ids.forEach(function(id){
      chain=chain.then(function(){
        return D.idb.get(id).then(function(rec){
          if(rec&&rec.blob) return b64(rec.blob).then(function(d){ docs[id]={name:rec.name,type:rec.type,data:d}; });
        }).catch(function(){});
      });
    });
    chain.then(function(){
      var pack={format:"doviz-defteri",v:1,alindi:new Date().toISOString(),state:st,docs:docs};
      var blob=new Blob([JSON.stringify(pack)],{type:"application/json"});
      var url=URL.createObjectURL(blob);
      var a=document.createElement("a");
      var d=new Date(), pad=function(n){ return (n<10?"0":"")+n; };
      a.href=url; a.download="doviz-defteri-"+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+".json";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); },20000);
      var mb=(blob.size/1048576).toFixed(2);
      D.setStatus("Yedek indirildi ("+mb+" MB, "+(st.rows||[]).length+" ay, "+Object.keys(docs).length+" dekont).","ok");
    });
  });

  document.getElementById("bkImport").addEventListener("click",function(){ document.getElementById("bkFile").click(); });
  document.getElementById("bkFile").addEventListener("change",function(){
    var f=this.files&&this.files[0]; this.value="";
    if(!f) return;
    var r=new FileReader();
    r.onload=function(){
      var pack;
      try{ pack=JSON.parse(String(r.result)); }catch(e){ D.setStatus("Dosya okunamadı — geçerli bir yedek değil.","warn"); return; }
      if(!pack||pack.format!=="doviz-defteri"||!pack.state){ D.setStatus("Bu dosya bu defterin yedeği değil.","warn"); return; }
      var n=(pack.state.rows||[]).length, nd=Object.keys(pack.docs||{}).length;
      var mevcut=(D.getState().rows||[]).length;
      D.sheet('<header><span class="nm">Yedeği yükle</span><span class="acts">'+
        '<button type="button" class="btn ghost sm" data-close>Vazgeç</button>'+
        '<button type="button" class="btn sm" id="bkGo">Yükle</button></span></header>'+
        '<div class="msg">Yedekte <b>'+n+' ay</b> ve <b>'+nd+' dekont</b> var. Yüklersen şu anki '+mevcut+
        ' aylık kayıt silinip yerine bunlar gelir. Bu işlem geri alınamaz.</div>');
      document.getElementById("bkGo").addEventListener("click",function(){
        var dbOn = !!(window.DEFTER_DB && DEFTER_DB.aktif() && DEFTER_DB.girisli());
        var chain=Promise.resolve(), esle={};
        Object.keys(pack.docs||{}).forEach(function(id){
          var d=pack.docs[id];
          chain=chain.then(function(){
            var blob=fromB64(d.data,d.type);
            if(dbOn){
              try{ blob.name=d.name; }catch(e){}
              var f = (typeof File==="function") ? new File([blob],d.name,{type:d.type||"application/pdf"}) : blob;
              return DEFTER_DB.dosyaYukle(f).then(function(doc){ esle[id]=doc; }).catch(function(){});
            }
            return D.idb.put(id,{name:d.name,type:d.type,blob:blob}).catch(function(){});
          });
        });
        chain.then(function(){
          if(dbOn){
            (pack.state.rows||[]).forEach(function(r){
              ["usdDoc","eurDoc"].forEach(function(k){
                var v=r[k];
                if(v && v.kind==="file" && esle[v.id]) r[k]=esle[v.id];
              });
            });
          }
          D.setState(pack.state);
          D.closeSheet();
          D.save("Yedek yüklendi");
          D.cleanupDocs();
        });
      });
    };
    r.readAsText(f);
  });
})();
</script>

  (st.rows||[]).forEach(function(r){

      eur:n(r.eur),eur_tl:n(r.eurTl),ek_tl:n(r.extra),vergi_dilimi:n(r.tax),
      usd_dekont:r.usdDoc||null,eur_dekont:r.eurDoc||null};
  });
  var b=(st.butce||{});
  (b.taksitler||[]).forEach(function(t, i){
    if(!t.id) t.id=yeniId("t");
    out.taksit[t.id]={id:t.id,user_id:m.butce,ad:String(t.ad||""),tutar:n(t.tutar),
      bas_yil:t.bYil,bas_ay:t.bAy,bit_yil:t.sYil,bit_ay:t.sAy,sira:i};
  });
  (b.aylar||[]).forEach(function(a){
    if(!a.id) a.id=yeniId("a");
    out.bay[a.id]={id:a.id,user_id:m.butce,yil:a.yil,ay:a.ay,maas:n(a.maas),hesaba:n(a.hesaba),gonderimler:a.gonderimler||[]};
    [["fatura",a.faturalar],["gider",a.giderler]].forEach(function(p){
      (p[1]||[]).forEach(function(k,i){
        if(!k.id) k.id=yeniId("k");
        out.bkalem[k.id]={id:k.id,user_id:m.butce,ay_id:a.id,tur:p[0],ad:String(k.ad||""),tutar:n(k.tutar),sira:i};
      });
    });
  });
  (st.odemeler||[]).forEach(function(o, i){
    if(!o.id) o.id=yeniId("o");
    out.odeme[o.id]={id:o.id,user_id:m.odemeler,ad:String(o.ad||""),tutar:n(o.tutar),
      gun:Math.min(31,Math.max(1,parseInt(o.gun,10)||1)),
      bas_yil:o.bYil,bas_ay:o.bAy,bit_yil:parseInt(o.sYil,10)||0,bit_ay:parseInt(o.sAy,10)||0,sira:i};
    var d=o.odendi||{};
    for(var k in d){ if(!d[k]) continue; var kk=parseInt(k,10);
      out.oddurum[o.id+"|"+kk]={odeme_id:o.id,yil:kYil(kk),ay:kAy(kk),user_id:m.odemeler,odendi:true}; }
    var t2=o.tutarlar||{};
    for(var k2 in t2){ var k3=parseInt(k2,10);
      out.odtutar[o.id+"|"+k3]={odeme_id:o.id,yil:kYil(k3),ay:kAy(k3),user_id:m.odemeler,tutar:n(t2[k2])}; }
  });
  if(st.patates){
    out.patates[m.patates]={user_id:m.patates,veri:st.patates,guncellendi:new Date().toISOString()};
  }
  return out;
}

/* ---------- fark bul ve yaz ---------- */
function fark(yeni,eski){
  var ekle=[],cikar=[];
  for(var k in yeni){ if(!eski[k] || JSON.stringify(eski[k])!==JSON.stringify(yeni[k])) ekle.push(yeni[k]); }
  for(var k2 in eski){ if(!yeni[k2]) cikar.push(k2); }
  return {ekle:ekle,cikar:cikar};
}
function kaydet(st){
  if(!girisli()) return Promise.reject(new Error("oturum yok"));
  if(!snap) return Promise.reject(new Error("veri henüz yüklenmedi"));
  zincir=zincir.then(function(){ return yaz(st); }).catch(function(e){ throw e; });
  return zincir;
}
function yaz(st){
  var yeni=satirlar(st), eski=snap||{ayarlar:{},doviz:{},taksit:{},bay:{},bkalem:{},odeme:{},oddurum:{},odtutar:{},patates:{}};
  var f={}; ["ayarlar","doviz","taksit","bay","bkalem","odeme","oddurum","odtutar","patates"].forEach(function(k){
    f[k]=fark(yeni[k],eski[k]); });

  var p=Promise.resolve();
  /* önce silmeler: bağımlı tablolardan başla */
  if(f.oddurum.cikar.length) p=p.then(function(){ return silCift("odeme_durum",f.oddurum.cikar); });
  if(f.odtutar.cikar.length) p=p.then(function(){ return silCift("odeme_tutar",f.odtutar.cikar); });
  if(f.bkalem.cikar.length)  p=p.then(function(){ return sil("butce_kalemler","id="+inliste(f.bkalem.cikar)); });
  if(f.odeme.cikar.length)   p=p.then(function(){ return sil("odemeler","id="+inliste(f.odeme.cikar)); });
  if(f.bay.cikar.length)     p=p.then(function(){ return sil("butce_aylar","id="+inliste(f.bay.cikar)); });
  if(f.taksit.cikar.length)  p=p.then(function(){ return sil("taksitler","id="+inliste(f.taksit.cikar)); });
  if(f.doviz.cikar.length)   p=p.then(function(){ return sil("doviz_aylar","id="+inliste(f.doviz.cikar)); });
  /* sonra eklemeler: üst tablolar önce */
  p=p.then(function(){ return upsert("ayarlar",f.ayarlar.ekle,"user_id"); });
  p=p.then(function(){ return upsert("doviz_aylar",f.doviz.ekle,"id"); });
  p=p.then(function(){
    return upsert("taksitler",f.taksit.ekle,"id").catch(function(err){
      if(/sira|column.*does not exist/i.test(err && err.message)){
        var stripped = f.taksit.ekle.map(function(item){
          var cp = Object.assign({}, item);
          delete cp.sira;
          return cp;
        });
        return upsert("taksitler", stripped, "id");
      }
      throw err;
    });
  });
  p=p.then(function(){
    return upsert("butce_aylar",f.bay.ekle,"id").catch(function(err){
      if(/gonderimler|column.*does not exist/i.test(err && err.message)){
        var stripped = f.bay.ekle.map(function(item){
          var cp = Object.assign({}, item);
          delete cp.gonderimler;
          return cp;
        });
        return upsert("butce_aylar", stripped, "id");
      }
      throw err;
    });
  });
  p=p.then(function(){ return upsert("butce_kalemler",f.bkalem.ekle,"id"); });
  p=p.then(function(){
    return upsert("odemeler",f.odeme.ekle,"id").catch(function(err){
      if(/sira|column.*does not exist/i.test(err && err.message)){
        var stripped = f.odeme.ekle.map(function(item){
          var cp = Object.assign({}, item);
          delete cp.sira;
          return cp;
        });
        return upsert("odemeler", stripped, "id");
      }
      throw err;
    });
  });
  p=p.then(function(){ return upsert("odeme_durum",f.oddurum.ekle,"odeme_id,yil,ay"); });
  p=p.then(function(){ return upsert("odeme_tutar",f.odtutar.ekle,"odeme_id,yil,ay"); });
  if(f.patates && f.patates.ekle.length){
    p=p.then(function(){
      return upsert("patates_veriler", f.patates.ekle, "user_id").catch(function(err){
        console.warn("patates_veriler tablosuna yazılamadı:", err);
        return null;
      });
    });
  }
  return p.then(function(){
    snap=yeni;
    var s=0; for(var k in f) s+=f[k].ekle.length+f[k].cikar.length;
    return s;
  });
}
function silCift(tablo,anahtarlar){
  var p=Promise.resolve();
  var u=uid();
  anahtarlar.forEach(function(a){
    var par=a.split("|"), k=parseInt(par[1],10);
    p=p.then(function(){ return sil(tablo,"odeme_id=eq."+encodeURIComponent(par[0])+"&yil=eq."+kYil(k)+"&ay=eq."+kAy(k)+(u?"&user_id=eq."+u:"")); });
  });
  return p;
}

/* ---------- dekont deposu ---------- */
function dosyaYukle(file){
  var ad=String(file.name||"dekont.pdf").replace(/[^\w.\-]+/g,"_");
  var yol=uid()+"/"+Date.now().toString(36)+"-"+ad;
  return token().then(function(t){
    return fetch(URL_+"/storage/v1/object/dekontlar/"+encodeURI(yol),{
      method:"POST",
      headers:{"apikey":KEY,"Authorization":"Bearer "+t,
               "Content-Type":file.type||"application/octet-stream","x-upsert":"true"},
      body:file});
  }).then(function(r){
    if(!r.ok) return r.text().then(function(t){ throw new Error("yükleme başarısız: "+t.slice(0,120)); });
    return {kind:"storage",path:yol,name:file.name||ad};
  });
}
function dosyaLink(yol){
  return token().then(function(t){
    return fetch(URL_+"/storage/v1/object/sign/dekontlar/"+encodeURI(yol),{
      method:"POST",
      headers:{"apikey":KEY,"Authorization":"Bearer "+t,"Content-Type":"application/json"},
      body:JSON.stringify({expiresIn:3600})});
  }).then(function(r){ return r.json(); }).then(function(j){
    if(!j||!j.signedURL) throw new Error("bağlantı alınamadı");
    return URL_+"/storage/v1"+j.signedURL;
  });
}
function dosyaSil(yol){
  return token().then(function(t){
    return fetch(URL_+"/storage/v1/object/dekontlar/"+encodeURI(yol),{
      method:"DELETE",headers:{"apikey":KEY,"Authorization":"Bearer "+t}});
  });
}

              '<div class="admin-mod-top">' +
                '<div class="admin-mod-title">' +
                  '<span class="admin-mod-ico">📊</span>' +
                  '<div>' +
                    '<div class="admin-mod-name">Aylık Bütçe</div>' +
                    '<div class="admin-mod-desc">Maaş, taksitler, faturalar ve giderler</div>' +
                  '</div>' +
                '</div>' +
                '<label class="admin-toggle-label">' +
                  '<input type="checkbox" id="erisim_butce_' + u.id + '" ' + (bP.erisim ? 'checked' : '') + '> ' +
                  '<span>Modülü görsün</span>' +
                '</label>' +
              '</div>' +
              '<div class="admin-mod-mode-box">' +
                '<div class="admin-mod-mode-label">Veri Paylaşım Modu:</div>' +
                '<div class="admin-mod-mode-options">' +
                  '<label class="admin-mode-pill">' +
                    '<input type="radio" name="mod_butce_' + u.id + '" value="ozel" ' + (bP.veri_modu === 'ozel' ? 'checked' : '') + '> ' +
                    '<div class="admin-pill-content">' +
                      '<span class="admin-pill-title">🔒 Kendine Özel (Bağımsız)</span>' +
                      '<span class="admin-pill-desc">Sadece kendi bütçe kayıtlarını görür</span>' +
                    '</div>' +
                  '</label>' +
                  '<label class="admin-mode-pill">' +
                    '<input type="radio" name="mod_butce_' + u.id + '" value="ortak" ' + (bP.veri_modu === 'ortak' ? 'checked' : '') + '> ' +
                    '<div class="admin-pill-content">' +
                      '<span class="admin-pill-title">👥 Admin ile Ortak</span>' +
                      '<span class="admin-pill-desc">Tüm bütçe verileri admin ile ortaktır</span>' +
                    '</div>' +
                  '</label>' +
                '</div>' +
              '</div>' +
            '</div>' +

              '<div class="admin-mod-top">' +
                '<div class="admin-mod-title">' +
                  '<span class="admin-mod-ico">💳</span>' +
                  '<div>' +

                  '</div>' +
                '</div>' +
                '<label class="admin-toggle-label">' +
                  '<input type="checkbox" id="erisim_odemeler_' + u.id + '" ' + (oP.erisim ? 'checked' : '') + '> ' +
                  '<span>Modülü görsün</span>' +
                '</label>' +
              '</div>' +
              '<div class="admin-mod-mode-box">' +
                '<div class="admin-mod-mode-label">Veri Paylaşım Modu:</div>' +
                '<div class="admin-mod-mode-options">' +
                  '<label class="admin-mode-pill">' +

                    '<div class="admin-pill-content">' +
                      '<span class="admin-pill-title">🔒 Kendine Özel (Bağımsız)</span>' +
                      '<span class="admin-pill-desc">Sadece kendi ödeme listesini görür</span>' +
                    '</div>' +
                  '</label>' +
                  '<label class="admin-mode-pill">' +
                    '<input type="radio" name="mod_odemeler_' + u.id + '" value="ortak" ' + (oP.veri_modu === 'ortak' ? 'checked' : '') + '> ' +
                    '<div class="admin-pill-content">' +
                      '<span class="admin-pill-title">👥 Admin ile Ortak</span>' +
                      '<span class="admin-pill-desc">Ödemeler admin ile ortaktır</span>' +
                    '</div>' +
                  '</label>' +
                '</div>' +
              '</div>' +
            '</div>' +

            '<!-- Modül 4: Patates Dağıtım -->' +
            '<div class="admin-mod-card">' +
              '<div class="admin-mod-top">' +
                '<div class="admin-mod-title">' +
                  '<span class="admin-mod-ico">🥔</span>' +
                  '<div>' +
                    '<div class="admin-mod-name">Patates Dağıtım</div>' +
                    '<div class="admin-mod-desc">Çuval stok, araç yükleme ve müşteri siparişleri</div>' +
                  '</div>' +
                '</div>' +
                '<label class="admin-toggle-label">' +
                  '<input type="checkbox" id="erisim_patates_' + u.id + '" ' + (pP.erisim ? 'checked' : '') + '> ' +
                  '<span>Modülü görsün</span>' +
                '</label>' +
              '</div>' +
              '<div class="admin-mod-mode-box">' +
                '<div class="admin-mod-mode-label">Veri Paylaşım Modu:</div>' +
                '<div class="admin-mod-mode-options">' +
                  '<label class="admin-mode-pill">' +
                    '<input type="radio" name="mod_patates_' + u.id + '" value="ozel" ' + (pP.veri_modu === 'ozel' ? 'checked' : '') + '> ' +
                    '<div class="admin-pill-content">' +
                      '<span class="admin-pill-title">🔒 Kendine Özel (Bağımsız)</span>' +
                      '<span class="admin-pill-desc">Sadece kendi sipariş ve stok verilerini görür</span>' +
                    '</div>' +
                  '</label>' +
                  '<label class="admin-mode-pill">' +
                    '<input type="radio" name="mod_patates_' + u.id + '" value="ortak" ' + (pP.veri_modu === 'ortak' ? 'checked' : '') + '> ' +
                    '<div class="admin-pill-content">' +
                      '<span class="admin-pill-title">👥 Admin ile Ortak</span>' +
                      '<span class="admin-pill-desc">Tüm sipariş ve stok verileri admin ile ortaktır</span>' +
                    '</div>' +
                  '</label>' +
                '</div>' +
              '</div>' +
            '</div>' +

          '</div>' +

          '<div class="admin-save-bar">' +
            '<span id="kaydetDurum_' + u.id + '" class="admin-save-status"></span>' +
            '<button type="button" class="btn sm" id="adminKaydetBtn_' + u.id + '">💾 ' + u.email + ' İzinlerini Kaydet</button>' +
          '</div>' +
        '</div>';

        panelContainer.innerHTML = cardHtml;

        var saveBtn = document.getElementById("adminKaydetBtn_" + u.id);
        if(saveBtn){
          saveBtn.onclick = function(){
            var eD = document.getElementById("erisim_doviz_" + u.id).checked;
            var mD = (panelContainer.querySelector('input[name="mod_doviz_' + u.id + '"]:checked') || {}).value || 'ozel';

            var eB = document.getElementById("erisim_butce_" + u.id).checked;
            var mB = (panelContainer.querySelector('input[name="mod_butce_' + u.id + '"]:checked') || {}).value || 'ozel';

            var eO = document.getElementById("erisim_odemeler_" + u.id).checked;
            var mO = (panelContainer.querySelector('input[name="mod_odemeler_' + u.id + '"]:checked') || {}).value || 'ozel';

            var eP = document.getElementById("erisim_patates_" + u.id).checked;
            var mP = (panelContainer.querySelector('input[name="mod_patates_' + u.id + '"]:checked') || {}).value || 'ozel';

            var rows = [
              { user_id: u.id, modul: 'doviz', erisim: eD, veri_modu: mD, guncellendi: new Date().toISOString() },
              { user_id: u.id, modul: 'butce', erisim: eB, veri_modu: mB, guncellendi: new Date().toISOString() },
              { user_id: u.id, modul: 'odemeler', erisim: eO, veri_modu: mO, guncellendi: new Date().toISOString() },
              { user_id: u.id, modul: 'patates', erisim: eP, veri_modu: mP, guncellendi: new Date().toISOString() }
            ];

            saveBtn.disabled = true;
            var dSpan = document.getElementById("kaydetDurum_" + u.id);
            if(dSpan) dSpan.textContent = "Kaydediliyor…";

            upsert("kullanici_izinleri", rows, "user_id,modul").then(function(){
              permMap[u.id] = {
                doviz: { erisim: eD, veri_modu: mD },
                butce: { erisim: eB, veri_modu: mB },
                odemeler: { erisim: eO, veri_modu: mO },
                patates: { erisim: eP, veri_modu: mP }
              };
              if(normalizeEmail(u.email) === normalizeEmail(aktifEposta())){
                kullaniciIzinleri = permMap[u.id];
                if(typeof API !== "undefined") API.kullaniciIzinleri = kullaniciIzinleri;
                if(window.DEFTER_DB) window.DEFTER_DB.kullaniciIzinleri = kullaniciIzinleri;
                uygulaIzinArayuz();
              }
              if(dSpan) dSpan.textContent = "✅ İzinler başarıyla kaydedildi!";
              setTimeout(function(){ if(dSpan) dSpan.textContent = ""; }, 3000);
            }).catch(function(err){
              alert("Kaydedilemedi: " + (err && err.message));
              if(dSpan) dSpan.textContent = "❌ Hata oluştu!";
            }).then(function(){
              saveBtn.disabled = false;
            });
          };
        }
      }

      var wrap = document.getElementById("customUserDropdown");
      var triggerBtn = document.getElementById("customUserTrigger");
      var triggerText = document.getElementById("customUserTriggerText");
      var menu = document.getElementById("customUserMenu");
      var searchInput = document.getElementById("customUserSearchInput");
      var clearBtn = document.getElementById("customUserClearBtn");
      var userList = document.getElementById("customUserList");
      var footerText = document.getElementById("customUserFooter");
      var countText = document.getElementById("adminUserCountText");

      var isMenuOpen = false;

      function openMenu(){
        isMenuOpen = true;
        if(wrap) wrap.classList.add("is-open");
        if(menu) menu.style.display = "flex";
        if(triggerBtn) triggerBtn.setAttribute("aria-expanded", "true");
        setTimeout(function(){
          if(searchInput) searchInput.focus();
        }, 40);
      }

      function closeMenu(){
        isMenuOpen = false;
        if(wrap) wrap.classList.remove("is-open");
        if(menu) menu.style.display = "none";
        if(triggerBtn) triggerBtn.setAttribute("aria-expanded", "false");
      }

      function toggleMenu(){
        if(isMenuOpen) closeMenu();
        else openMenu();
      }

      if(triggerBtn){
        triggerBtn.onclick = function(e){
          e.stopPropagation();
          toggleMenu();
        };
      }

      function onOutsideClick(e){
        if(isMenuOpen && wrap && !wrap.contains(e.target)){
          closeMenu();
        }
      }
      document.addEventListener("click", onOutsideClick);

      function onKeyDown(e){
        if(isMenuOpen && (e.key === "Escape" || e.keyCode === 27)){
          closeMenu();
          if(triggerBtn) triggerBtn.focus();
        }
      }
      document.addEventListener("keydown", onKeyDown);

      function updateTriggerLabel(u){
        if(!triggerText) return;
        if(u){
          var isAdmUser = (normalizeEmail(u.email) === normalizeEmail(ADMIN_EMAIL));
          var shortId = u.id ? (u.id.slice(0, 8) + "…") : "";
          if(isAdmUser){
            triggerText.innerHTML = '👑 <strong>' + (u.email || "") + '</strong> <span style="background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:11px;padding:2px 6px;border-radius:4px;margin-left:6px;">Yönetici (Admin)</span>';
          } else {
            triggerText.innerHTML = '👤 <strong>' + (u.email || "") + '</strong> <span style="opacity:0.75; font-weight:normal; font-size:12px; margin-left:6px;">(ID: ' + shortId + ')</span>';
          }
        } else {
          triggerText.textContent = "👤 Kullanıcı seçin...";
        }
      }

      function renderDropdownList(q){
        q = (q || "").trim().toLowerCase();
        var matches = allUsers.filter(function(x){
          if(!q) return true;
          return (x.email || "").toLowerCase().indexOf(q) > -1 || (x.id || "").toLowerCase().indexOf(q) > -1;
        });

        var countStr = q ? ("Eşleşen " + matches.length + " / " + allUsers.length + " kullanıcı") : ("Toplam " + allUsers.length + " kullanıcı");
        if(countText) countText.textContent = countStr;
        if(footerText) footerText.textContent = countStr;

        if(!userList) return;
        userList.innerHTML = "";

        if(matches.length === 0){
          var emptyDiv = document.createElement("div");
          emptyDiv.className = "custom-dropdown-empty";
          emptyDiv.textContent = "🔍 Aramaya uygun kullanıcı bulunamadı.";
          userList.appendChild(emptyDiv);
          return;
        }

        matches.forEach(function(u){
          var isSel = (u.id === selectedUid);
          var isAdmUser = (normalizeEmail(u.email) === normalizeEmail(ADMIN_EMAIL));
          var item = document.createElement("div");
          item.className = "custom-dropdown-item" + (isSel ? " is-selected" : "");
          item.setAttribute("role", "option");
          item.setAttribute("aria-selected", isSel ? "true" : "false");

          var shortId = u.id ? (u.id.slice(0, 8) + "…") : "";
          var ico = isAdmUser ? "👑" : "👤";
          var badge = isAdmUser ? ' <span style="background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:10px;padding:1px 5px;border-radius:3px;margin-left:4px;">Admin</span>' : '';
          item.innerHTML = '<span class="custom-item-ico">' + ico + '</span>' +
            '<div class="custom-item-info">' +
              '<span class="custom-item-email">' + (u.email || "") + badge + '</span>' +
              '<span class="custom-item-id">ID: ' + shortId + '</span>' +
            '</div>' +
            '<span class="custom-item-check" style="' + (isSel ? '' : 'display:none;') + '">✓</span>';

          item.onclick = function(e){
            e.stopPropagation();
            selectedUid = u.id;
            updateTriggerLabel(u);
            renderCard(u.id);
            renderDropdownList(searchInput ? searchInput.value : "");
            closeMenu();
          };

          userList.appendChild(item);
        });
      }

      if(searchInput){
        searchInput.oninput = function(){
          renderDropdownList(this.value);
        };
      }

      if(clearBtn){
        clearBtn.onclick = function(e){
          e.stopPropagation();
          if(searchInput){
            searchInput.value = "";
            renderDropdownList("");
            searchInput.focus();
          }
        };
      }

      // Başlangıçta ilk kullanıcıyı seç ve listeyi oluştur
      var initUser = allUsers.find(function(x){ return x.id === selectedUid; }) || allUsers[0];
      if(initUser){
        selectedUid = initUser.id;
        updateTriggerLabel(initUser);
        renderCard(initUser.id);
      }
      renderDropdownList("");
    });
  }
  window.adminPaneliniYukle = adminPaneliniYukle;

  function veriyiAl(){
    window.DB_DURUM && DB_DURUM("yükleniyor…");
    return izinleriYukle().then(function(){
      uygulaIzinArayuz();
      return yukle();
    }).then(function(st){
      D.setState(st);
      try{ localStorage.setItem("doviz-defteri", JSON.stringify(st)); }catch(e){}
      goster(false); cip();
      window.DB_DURUM && DB_DURUM((ses&&ses.email)||"bağlandı","ok");
    });
  }

  document.getElementById("girisForm").addEventListener("submit",function(e){
    e.preventDefault();
    var b=document.getElementById("girisBtn");
    var mail=document.getElementById("girisEposta").value.trim();
    var pw=document.getElementById("girisParola").value;
    if(!mail){ hata("E-posta boş olamaz."); return; }
    if(!pw){ hata("Parola boş olamaz."); return; }
    b.disabled=true; hata("Kontrol ediliyor…");
    giris(mail, pw).then(veriyiAl).then(function(){ hata(""); })
      .catch(function(err){
        var m=String(err&&err.message||""), kod=String(err&&err.kod||""), st=err&&err.status;
        var t;
        if(/email_not_confirmed|not confirmed/i.test(kod+m))
          t="Kullanıcı onaylanmamış. Supabase panelinde Authentication → Users → kullanıcıyı aç → Confirm email.";
        else if(/invalid_credentials|invalid login credentials|invalid_grant/i.test(kod+m))
          t="E-posta ("+mail+") ya da parola eşleşmedi. Lütfen bilgilerinizi kontrol edin.";
        else if(st===401||/api key|apikey|jwt/i.test(m))
          t="Anahtar kabul edilmedi. Sayfadaki publishable anahtarı kontrol et.";
        else if(/failed to fetch|networkerror|load failed/i.test(m))
          t="Sunucuya ulaşılamadı. İnternet bağlantısını ve proje adresini kontrol et.";
        else t="Bağlanılamadı.";
        hata(t);
        var d=document.getElementById("girisAyrinti");
        if(d) d.textContent="ayrıntı: "+(st?("HTTP "+st+" · "):"")+(kod?(kod+" · "):"")+m;
      })
      .then(function(){ b.disabled=false; });
  });

  document.getElementById("girisSina").addEventListener("click",function(){
    hata("Sınanıyor…");
    var d=document.getElementById("girisAyrinti");
    sina().then(function(r){
      hata("Sonuç aşağıda. 401/Invalid API key varsa anahtar yanlış ya da eksik kopyalanmış.");
      if(d) d.textContent =
        "adres: "+r.url+"\n"+
        "anahtar: "+r.anahtar+"\n"+
        "hesap: "+r.eposta+"\n"+
        "auth: "+r.health+" "+(r.healthYanit||"")+"\n"+
        "rest: "+r.rest+" "+(r.restYanit||"");
    });
  });

  if(girisli()){
    veriyiAl().catch(function(){ sesSil(); goster(true); hata("Oturum süresi doldu, tekrar gir."); });
  } else {
    goster(true);
  }
})();

return API;
})();
