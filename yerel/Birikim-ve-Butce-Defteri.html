<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob:; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; connect-src 'self' https://*.supabase.co https://www.tcmb.gov.tr https://*.allorigins.win https://corsproxy.io https://api.codetabs.com https://open.er-api.com https://api.frankfurter.app; img-src 'self' data: blob: https:; frame-src 'self' blob: data: https://*.supabase.co;">
<title>Birikim ve Bütçe Defteri</title>
<link id="app-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&display=swap">
<style id="app-style">
:root{
  --ground:#F0F2F6; --surface:#FFFFFF; --surface-2:#F6F8FB;
  --line:#D5DAE5; --line-soft:#E4E8F1;
  --ink:#121722; --ink-2:#353F52; --muted:#646E82;
  --accent:#204DB3; --accent-soft:#EBF1FD;
  --brass:#946316; --brass-soft:#FAF2E3;
  --gain:#0E7550; --gain-soft:#E4F5EE;
  --loss:#B82B1B; --loss-soft:#FCEAE8;
  --on-accent:#FFFFFF;
  --shadow:0 1px 3px rgba(18,23,34,.07), 0 10px 28px -16px rgba(18,23,34,.22);
  --radius:11px;
}
:root:not([data-theme="light"]){ }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0C1017; --surface:#151B26; --surface-2:#1B2332;
    --line:#283244; --line-soft:#202837;
    --ink:#EAEFF8; --ink-2:#C2CBE0; --muted:#8B95AC;
    --accent:#8DA7F4; --accent-soft:#1C2744;
    --brass:#E2B86E; --brass-soft:#2E2416;
    --gain:#52D6A1; --gain-soft:#112B21;
    --loss:#F08B7A; --loss-soft:#331A17;
    --on-accent:#0C1017;
    --shadow:0 1px 3px rgba(0,0,0,.45), 0 10px 28px -16px rgba(0,0,0,.75);
  }
}
:root[data-theme="dark"]{
  --ground:#0C1017; --surface:#151B26; --surface-2:#1B2332;
  --line:#283244; --line-soft:#202837;
  --ink:#EAEFF8; --ink-2:#C2CBE0; --muted:#8B95AC;
  --accent:#8DA7F4; --accent-soft:#1C2744;
  --brass:#E2B86E; --brass-soft:#2E2416;
  --gain:#52D6A1; --gain-soft:#112B21;
  --loss:#F08B7A; --loss-soft:#331A17;
  --on-accent:#0C1017;
  --shadow:0 1px 3px rgba(0,0,0,.45), 0 10px 28px -16px rgba(0,0,0,.75);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
img{max-width:100%}
[hidden]{display:none!important}
body{
  background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1140px; margin:0 auto; padding:32px 20px 72px; display:flex; flex-direction:column; gap:22px}
h1,h2,h3{margin:0; font-family:"IBM Plex Serif",Georgia,serif; font-weight:600; text-wrap:balance}
h1{font-size:29px; letter-spacing:-.01em}
h2{font-size:19px}
.eyebrow{font-size:11px; letter-spacing:.13em; text-transform:uppercase; color:var(--muted); font-weight:600}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}

/* header */
.masthead{display:flex; flex-wrap:wrap; gap:18px; align-items:flex-end; justify-content:space-between; border-bottom:2px solid var(--ink); padding-bottom:14px}
.masthead p{margin:6px 0 0; color:var(--muted); font-size:13.5px; max-width:58ch}
.lede{margin:0; color:var(--muted); font-size:13.5px; max-width:64ch}
.modpane{display:flex; flex-direction:column; gap:22px}
.tabs{position:sticky; top:0; z-index:45; display:flex; gap:4px; background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:4px; box-shadow:0 2px 8px rgba(18,23,34,.05); backdrop-filter:blur(8px)}
.tab{cursor:pointer; border:0; background:none; border-radius:8px; padding:9px 18px; font-size:14px; font-weight:600;
  color:var(--muted); font-family:"IBM Plex Sans",system-ui,sans-serif; white-space:nowrap; transition:all .15s ease; min-height:42px; display:inline-flex; align-items:center; justify-content:center}
.tab:hover{color:var(--ink)}
.tab.is-on{background:var(--surface); color:var(--accent); box-shadow:0 2px 6px rgba(18,23,34,.09); border:1px solid var(--line-soft)}

/* rate bar */
.rates{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px 18px; display:flex; flex-wrap:wrap; gap:16px 20px; align-items:flex-end}
.rates .field{display:flex; flex-direction:column; gap:5px}
.rates .field label{font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600}
.rates .grow{flex:1 1 auto; min-width:1px}
.tcmb-link{display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color:var(--accent); text-decoration:none; border-bottom:1px solid transparent; padding-bottom:1px}
.tcmb-link:hover{border-bottom-color:var(--accent)}
.rate-note{font-size:12.5px; color:var(--muted); max-width:44ch; text-align:right}

input,select,button{font:inherit; color:inherit}
input[type=text],input[type=number],input[type=email],input[type=password],select{
  background:var(--surface-2); border:1px solid var(--line); border-radius:8px;
  padding:8px 10px; min-width:0; width:100%;
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums; font-size:14px;
}
select{font-family:"IBM Plex Sans",system-ui,sans-serif}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.rates input{width:118px}

/* summary */
.headline{display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow)}
.hcell{background:var(--surface); padding:18px 20px; display:flex; flex-direction:column; gap:7px; border-top:3px solid transparent}
.hcell:nth-child(1){border-top-color:var(--accent)}
.hcell:nth-child(2){border-top-color:var(--ink-2)}
.hcell:nth-child(3){border-top-color:var(--gain)}
.hcell .k{font-size:11px; letter-spacing:.11em; text-transform:uppercase; color:var(--muted); font-weight:600}
.hcell .v{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; font-size:26px; font-weight:600; letter-spacing:-.02em}
.hcell .s{font-size:12.5px; color:var(--muted)}
.hcell.result{background:var(--surface)}
.pill{display:inline-flex; align-items:center; gap:5px; align-self:flex-start; padding:3px 9px; border-radius:999px; font-size:12px; font-weight:600; font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}
.pill.up{background:var(--gain-soft); color:var(--gain)}
.pill.down{background:var(--loss-soft); color:var(--loss)}
.pill.flat{background:var(--surface-2); color:var(--muted)}
.v.up{color:var(--gain)} .v.down{color:var(--loss)}

.chips{display:grid; grid-template-columns:repeat(auto-fit,minmax(146px,1fr)); gap:1px; background:var(--line-soft); border:1px solid var(--line-soft); border-radius:var(--radius); overflow:hidden}
.chip{background:var(--surface); padding:12px 14px; display:flex; flex-direction:column; gap:3px}
.chip .k{font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); font-weight:600}
.chip .v{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; font-size:16px; font-weight:500}

/* table */
.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden}
.panel-head{display:flex; flex-wrap:wrap; gap:10px; align-items:baseline; justify-content:space-between; padding:16px 18px 12px; border-bottom:1px solid var(--line-soft)}
.panel-head .hint{font-size:12.5px; color:var(--muted)}
.tscroll{overflow-x:auto}
table{border-collapse:collapse; width:100%; min-width:900px; font-size:13px}
thead th{font-weight:600; color:var(--muted); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; padding:9px 6px; text-align:right; white-space:nowrap; background:var(--surface-2)}
thead tr.groups th{border-bottom:1px solid var(--line-soft); padding-top:11px; padding-bottom:5px; color:var(--ink-2); letter-spacing:.14em}
thead tr.groups th.g-usd{color:var(--accent)}
thead tr.groups th.g-eur{color:var(--brass)}
thead tr.cols th{border-bottom:1px solid var(--line); padding-top:4px}
th.l,td.l{text-align:left}
tbody td{padding:8px 6px; text-align:right; border-bottom:1px solid var(--line-soft); white-space:nowrap; font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}
tbody td.l{font-family:"IBM Plex Sans",system-ui,sans-serif}
tbody tr:hover td{background:var(--surface-2)}
tbody tr.editing td{background:var(--accent-soft)}
td .per{font-size:11px; color:var(--muted)}
.sep{border-left:1px solid var(--line-soft)}
tfoot td{padding:10px 6px; text-align:right; font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; font-weight:600; border-top:2px solid var(--ink); background:var(--surface-2); white-space:nowrap}
tfoot td.l{text-align:left; font-family:"IBM Plex Sans",system-ui,sans-serif; letter-spacing:.04em; text-transform:uppercase; font-size:11.5px}
.dim{color:var(--muted)}
.doclink{color:inherit; text-decoration:none; border-bottom:1px dashed var(--accent); padding-bottom:1px}
.doclink:hover{color:var(--accent); border-bottom-style:solid}
.doc-ico{font-size:9.5px; color:var(--accent); margin-left:3px; vertical-align:2px}
.docpick{display:flex; gap:8px; align-items:stretch}
.docpick input{flex:1 1 auto}
.docpick input[readonly]{color:var(--accent); background:var(--accent-soft); border-color:var(--accent); cursor:default}
.btn.sm{padding:8px 12px; font-size:13px; white-space:nowrap}
.overlay{position:fixed; inset:0; background:rgba(10,14,22,.62); display:flex; align-items:center; justify-content:center; padding:24px; z-index:50}
.sheet{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:0 24px 60px -20px rgba(0,0,0,.55); width:min(940px,100%); max-height:100%; display:flex; flex-direction:column; overflow:hidden}
.sheet header{display:flex; gap:12px; align-items:center; justify-content:space-between; padding:12px 14px; border-bottom:1px solid var(--line-soft)}
.sheet header .nm{font-size:13.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.sheet header .acts{display:flex; gap:8px; align-items:center}
.sheet iframe{border:0; width:100%; height:min(72vh,780px); background:var(--surface-2)}
.sheet .msg{padding:24px 20px; color:var(--ink-2); font-size:14px; line-height:1.6}
.tag{display:inline-block; padding:2px 6px; border-radius:6px; background:var(--accent-soft); color:var(--accent); font-family:"IBM Plex Sans",sans-serif; font-size:11.5px; font-weight:600}
.rowact{display:flex; gap:2px; justify-content:flex-end}
.icobtn{background:none; border:1px solid transparent; border-radius:6px; padding:3px 5px; font-size:11.5px; color:var(--muted); cursor:pointer; font-family:"IBM Plex Sans",sans-serif}
.icobtn:hover{border-color:var(--line); color:var(--ink); background:var(--surface)}
.icobtn.danger:hover{border-color:var(--loss); color:var(--loss); background:var(--loss-soft)}
.icobtn.armed{border-color:var(--loss); color:var(--loss); background:var(--loss-soft)}
.empty{padding:34px 18px; text-align:center; color:var(--muted); font-size:14px}

/* form */
form.entry{padding:16px 18px 18px; display:flex; flex-direction:column; gap:14px}
.grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px}
.grid.small{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.grid.docs{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.grid.docs input{font-size:13px}
.grid.docs input::placeholder{color:var(--muted); opacity:.7}
.field{display:flex; flex-direction:column; gap:5px}
.field label{font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); font-weight:600}
.field .calc{font-size:11.5px; color:var(--accent); font-family:"IBM Plex Mono",monospace; min-height:15px}
.formfoot{display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between}
.actions{display:flex; gap:8px}
.btn{cursor:pointer; border-radius:8px; padding:9px 16px; font-size:14px; font-weight:600; border:1px solid var(--accent); background:var(--accent); color:var(--on-accent)}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent; color:var(--ink-2); border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2); filter:none}
.status{font-size:12.5px; color:var(--muted)}
.status.ok{color:var(--gain)}
.status.warn{color:var(--brass)}

footer.note{color:var(--muted); font-size:12.5px; line-height:1.65}
footer.note b{color:var(--ink-2); font-weight:600}

@media (max-width:768px){
  .masthead{gap:12px; padding-bottom:10px}
  .masthead h1{font-size:22px}
  .tabs{width:100%; overflow-x:auto; -ms-overflow-style:none; scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:1 1 0; padding:10px 8px; font-size:13px; text-align:center}
  .wrap{padding:14px 12px 64px; gap:16px}
  .headline{grid-template-columns:1fr; gap:8px; background:none; border:none; box-shadow:none}
  .hcell{border-radius:var(--radius); border:1px solid var(--line-soft); box-shadow:var(--shadow); padding:16px}
  .hcell .v{font-size:24px}
  .chips{grid-template-columns:repeat(2,1fr)}
  .rates{padding:14px 12px; gap:12px}
  .rates .field{flex:1 1 calc(50% - 6px)}
  .rates input{width:100%; font-size:15px}
  .rates .grow{display:none}
  .rate-info-box{width:100% !important; align-items:flex-start !important}
  .rates .actions{width:100%; display:flex; flex-wrap:wrap; gap:8px}
  .rates .actions .btn{flex:1 1 calc(50% - 4px); text-align:center; justify-content:center}
  
  /* Mobilde tablo: İlk kolon (Dönem) yapışkan kalsın, sağa kaydırırken ay kaybolmasın */
  .tscroll{position:relative; overflow-x:auto; -webkit-overflow-scrolling:touch}
  table thead tr.cols th.l,
  table tbody td.l,
  table tfoot td.l{
    position:sticky; left:0; z-index:3;
    border-right:2px solid var(--line);
    box-shadow:2px 0 6px rgba(0,0,0,.06);
  }
  table tbody td.l{background:var(--surface)}
  table thead tr.cols th.l,table tfoot td.l{background:var(--surface-2)}
  tbody tr:hover td.l{background:var(--surface-2)}
  tbody tr.editing td.l{background:var(--accent-soft)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}

/* ---- modül 2: aylık bütçe ---- */
.monthbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; background:var(--surface);
  border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:12px 14px}
.monthbar .grow{flex:1 1 auto; min-width:1px}
.monthbar select{width:auto; min-width:150px; font-weight:600}
.monthbar .actions{flex-wrap:wrap}
.navbtn{cursor:pointer; background:var(--surface-2); border:1px solid var(--line); border-radius:8px;
  width:40px; height:40px; font-size:18px; line-height:1; font-weight:bold; color:var(--ink-2); flex:0 0 auto;
  display:inline-flex; align-items:center; justify-content:center}
.navbtn:hover{color:var(--accent); border-color:var(--accent); background:var(--surface)}
.gelir{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; padding:14px 18px 18px}
.rows{display:flex; flex-direction:column; padding-top:4px}
.row2{display:grid; grid-template-columns:minmax(140px,1fr) 150px auto; gap:8px; align-items:center; padding:8px 18px}
.rowfoot{display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between;
  padding:12px 18px 16px; margin-top:6px; border-top:1px solid var(--line-soft)}
.rowtot{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; font-size:13.5px; font-weight:600}
table.mini{min-width:620px}
.tag.warn{background:var(--brass-soft); color:var(--brass); border:1px solid rgba(148,99,22,.2)}
.tag.ok{background:var(--gain-soft); color:var(--gain); border:1px solid rgba(14,117,80,.2)}
.tag.done{background:var(--surface-2); color:var(--muted)}
.trows{display:flex; flex-direction:column; min-width:1080px; padding-top:4px}
.trow{display:grid; grid-template-columns:minmax(132px,1fr) 100px 22px 112px 66px 26px 112px 66px 150px 96px 46px;
  gap:6px; align-items:center; padding:8px 18px; border-bottom:1px solid var(--line-soft)}
.trow.off{opacity:.55; background:var(--surface-2)}
.trow input,.trow select{padding:7px 9px; font-size:13.5px}
.trow .mini-l{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; text-align:right}
.trow-badge{text-align:center}
.chk{display:inline-flex; gap:6px; align-items:center; cursor:pointer}
.chk input{width:auto; margin:0}
@media (max-width:720px){
  .row2{grid-template-columns:1fr 120px auto; padding:8px 12px}
  .row2 .icobtn{min-height:36px; padding:6px 10px}
  .monthbar{gap:8px; padding:10px}
  .monthbar select{min-width:110px; flex:1 1 auto; font-size:14.5px; padding:8px 10px}
  .monthbar .grow{display:none}
  .monthbar .actions{width:100%; gap:8px}
  .monthbar .actions .btn{flex:1 1 calc(50% - 4px); text-align:center; justify-content:center}
  .monthbar .status{width:100%}
}

.acc-btn{display:flex; align-items:center; gap:8px; background:none; border:0; padding:0; cursor:pointer; color:inherit; text-align:left}
.acc-btn h2{margin:0}
.acc-btn .chev{display:inline-block; color:var(--muted); font-size:17px; line-height:1; transform:rotate(90deg); transition:transform .16s ease}
.panel.collapsed .acc-btn .chev{transform:rotate(0deg)}
.acc-btn:hover .chev{color:var(--accent)}
.panel.collapsed .panel-body{display:none}
.panel.collapsed .panel-head{border-bottom:0}
td.odn,.odn{font-size:12.5px; white-space:nowrap}
.prog{display:block; height:5px; margin-top:5px; background:var(--line-soft); border-radius:3px; overflow:hidden; min-width:80px}
.prog i{display:block; height:100%; background:var(--accent); border-radius:3px}
.trow .trow-odn{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; text-align:right}

/* ---- bu ayın özeti: dar ekranda kart, geniş ekranda tablo ---- */
.ozet{display:flex; flex-direction:column}
.oz-head{display:none}
.oz-grp{display:flex; align-items:baseline; gap:10px; padding:12px 16px 8px;
  background:var(--surface-2); border-bottom:1px solid var(--line); border-top:1px solid var(--line-soft)}
.oz-grp .g-ad{font-size:11.5px; letter-spacing:.09em; text-transform:uppercase; font-weight:700; color:var(--ink)}
.oz-grp .g-kal{font-size:11.5px; color:var(--muted); flex:1 1 auto}
.oz-grp .g-tut{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; font-weight:600; font-size:14px}
.oz-bos{padding:14px 16px; color:var(--muted); font-size:13.5px}
.oz-row{display:grid; grid-template-columns:1fr auto; gap:4px 12px; padding:11px 16px;
  border-bottom:1px solid var(--line-soft); align-items:baseline}
.oz-row:nth-child(even){background:rgba(0,0,0,.012)}
.oz-row .oz-ad{font-size:14.5px; font-weight:600}
.oz-row .oz-tut{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums;
  font-size:14.5px; font-weight:600; text-align:right; white-space:nowrap}
.oz-row .oz-donem,.oz-row .oz-tak{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums;
  font-size:12px; color:var(--muted); white-space:nowrap}
.oz-row .oz-tak{text-align:right}
.oz-row .oz-odn{grid-column:1/-1; font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums;
  font-size:12.5px; margin-top:4px}
.oz-row .oz-drm{grid-column:1/-1; font-size:12.5px; margin-top:3px}
.oz-foot{display:flex; align-items:baseline; justify-content:space-between; gap:12px; padding:13px 16px;
  border-top:2px solid var(--ink); background:var(--surface-2); font-weight:600; font-size:13.5px;
  text-transform:uppercase; letter-spacing:.04em}
.oz-foot .v{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; font-size:16px; letter-spacing:0}
.oz-foot.son{border-top:1px solid var(--line-soft); background:var(--gain-soft); color:var(--gain); font-weight:700}
@media (min-width:780px){
  .oz-head{display:grid; padding:9px 18px; background:var(--surface-2); border-bottom:1px solid var(--line)}
  .oz-head span{font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:600}

<script id="app-code">
(function(){
"use strict";

var AYLAR=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
var DILIMLER=[15,20,27,35,40];

var state=readState();
var editingId=null, armedDelete=null, armTimer=null;

function readState(){
  var fallback={savedAt:0,usdRate:48.0732,eurRate:55.9845,rateDate:"",rows:[]};
  var embedded=fallback;
  try{ embedded=JSON.parse(document.getElementById("app-state").textContent)||fallback; }catch(e){}
  var local=null;
  try{ var raw=localStorage.getItem("doviz-defteri"); if(raw) local=JSON.parse(raw); }catch(e){}
  if(local && Number(local.savedAt||0)>Number(embedded.savedAt||0)) return normalize(local);
  return normalize(embedded);
}
function normalize(s){
  s=s||{};
  return {
    savedAt:Number(s.savedAt)||0,
    usdRate:num(s.usdRate)||0,
    eurRate:num(s.eurRate)||0,
    rateDate:String(s.rateDate||""),
    rows:(Array.isArray(s.rows)?s.rows:[]).map(function(r){
      return {id:String(r.id||uid()),year:parseInt(r.year,10)||new Date().getFullYear(),
        month:Math.min(12,Math.max(1,parseInt(r.month,10)||1)),
        usd:num(r.usd),usdTl:num(r.usdTl),eur:num(r.eur),eurTl:num(r.eurTl),extra:num(r.extra),tax:num(r.tax),
        usdDoc:normDoc(r.usdDoc),eurDoc:normDoc(r.eurDoc)};
    }),
    butce:(s.butce&&typeof s.butce==="object")?s.butce:{taksitler:[],aylar:[]},
    odemeler:Array.isArray(s.odemeler)?s.odemeler:[]
  };
}
function uid(){ return "r"+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36); }
function num(v){
  if(typeof v==="number") return isFinite(v)?v:0;
  var s=String(v==null?"":v).trim().replace(/\s/g,"");
  if(!s) return 0;
  if(s.indexOf(",")>-1 && s.indexOf(".")>-1) s=s.replace(/\./g,"").replace(",",".");
  else if(s.indexOf(",")>-1) s=s.replace(",",".");
  var n=parseFloat(s); return isFinite(n)?n:0;
}
function fmt(n,d){
  d=d==null?2:d;
  if(!isFinite(n)) n=0;
  return n.toLocaleString("tr-TR",{minimumFractionDigits:d,maximumFractionDigits:d});
}
function tl(n,d){ return fmt(n,d==null?2:d)+" ₺"; }
function key(r){ return r.year*12+r.month; }
function normDoc(v){
  if(!v) return null;
  if(typeof v==="string"){ var u=v.trim(); return u?{kind:"url",url:u}:null; }
  if(v.kind==="file"&&v.id) return {kind:"file",id:String(v.id),name:String(v.name||"dekont.pdf")};
  if(v.kind==="storage"&&v.path) return {kind:"storage",path:String(v.path),name:String(v.name||"dekont.pdf")};
  if(v.url) { var t=String(v.url).trim(); return t?{kind:"url",url:t}:null; }
  return null;
}
function docLabel(d){ return d ? (d.kind==="file" ? d.name : d.url) : ""; }
function docUrl(v){
  var s=String(v==null?"":v).trim();
  if(!s) return "";
  if(/^\s*(javascript|data|vbscript|blob):/i.test(s)) return "";
  if(/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(s)) return s;
  if(/^[A-Za-z]:[\\/]/.test(s)) return "file:///"+s.replace(/\\/g,"/");
  if(/^\\\\/.test(s)) return "file://"+s.replace(/\\/g,"/");
  if(/^\//.test(s)) return "file://"+s;
  if(/^www\./i.test(s)) return "https://"+s;
  return s;
}
function attr(s){ return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function amount(val,doc,label){
  if(!val) return '<span class="dim">—</span>';
  var d=normDoc(doc);
  if(!d) return fmt(val);
  if(d.kind==="file")
    return '<a class="doclink" href="#" data-file="'+attr(d.id)+'" title="'+attr(label+" · "+d.name)+'">'+fmt(val)+'<span class="doc-ico">↗</span></a>';
  if(d.kind==="storage")
    return '<a class="doclink" href="#" data-sfile="'+attr(d.path)+'" title="'+attr(label+" · "+d.name)+'">'+fmt(val)+'<span class="doc-ico">↗</span></a>';
  var u=docUrl(d.url);
  if(!u) return fmt(val);
  return '<a class="doclink" href="'+attr(u)+'" target="_blank" rel="noopener" title="'+attr(label+" · "+d.url)+'">'+fmt(val)+'<span class="doc-ico">↗</span></a>';
}

function derive(r){
  var usdRate = r.usd>0 ? r.usdTl/r.usd : 0;
  var eurRate = r.eur>0 ? r.eurTl/r.eur : 0;
  var yatan = r.usdTl + r.eurTl + (r.extra||0);
  var iade = yatan*r.tax/100;
  var net = yatan - iade;
  var bugun = r.usd*state.usdRate + r.eur*state.eurRate;
  return {usdRate:usdRate,eurRate:eurRate,yatan:yatan,iade:iade,net:net,bugun:bugun,fark:bugun-net};
}
function totals(){
  var t={usd:0,usdTl:0,eur:0,eurTl:0,extra:0,yatan:0,iade:0,net:0,bugun:0};
  state.rows.forEach(function(r){
    var d=derive(r);
    t.usd+=r.usd; t.usdTl+=r.usdTl; t.eur+=r.eur; t.eurTl+=r.eurTl; t.extra+=(r.extra||0);
    t.yatan+=d.yatan; t.iade+=d.iade; t.net+=d.net; t.bugun+=d.bugun;
  });
  t.fark=t.bugun-t.net;
  t.yuzde = t.net>0 ? (t.fark/t.net*100) : 0;
  t.ortUsd = t.usd>0 ? t.usdTl/t.usd : 0;
  t.ortEur = t.eur>0 ? t.eurTl/t.eur : 0;
  return t;
}

function docField(cur,label){

    '<div class="docpick">'+
      '<input id="f-'+cur+'doc" type="text" placeholder="PDF seç ya da https://… bağlantısı yapıştır">'+

      '<input type="file" id="file-'+cur+'" accept="application/pdf,.pdf,image/*" hidden>'+
    '</div><span class="calc" id="c-'+cur+'doc"></span></div>';
}

/* ---------- belge deposu (IndexedDB) ---------- */
var DB_NAME="doviz-defteri-docs", DB_STORE="files", dbP=null;
function idbOpen(){
  if(dbP) return dbP;
  dbP=new Promise(function(res,rej){
    try{
      if(!window.indexedDB) return rej(new Error("no-idb"));
      var q=indexedDB.open(DB_NAME,1);
      q.onupgradeneeded=function(e){ var d=e.target.result; if(!d.objectStoreNames.contains(DB_STORE)) d.createObjectStore(DB_STORE); };
      q.onsuccess=function(){ res(q.result); };
      q.onerror=function(){ rej(q.error||new Error("idb")); };
      setTimeout(function(){ rej(new Error("idb-timeout")); },4000);
    }catch(e){ rej(e); }
  }).catch(function(e){ dbP=null; throw e; });
  return dbP;
}
function idbTx(mode,fn){
  return idbOpen().then(function(db){
    return new Promise(function(res,rej){
      var tx=db.transaction(DB_STORE,mode), st=tx.objectStore(DB_STORE), out;
      out=fn(st);
      tx.oncomplete=function(){ res(out && out.result!==undefined ? out.result : out); };
      tx.onerror=function(){ rej(tx.error); };
      tx.onabort=function(){ rej(tx.error); };
    });
  });
}
function idbPut(id,rec){ return idbTx("readwrite",function(st){ st.put(rec,id); return true; }); }
function idbGet(id){ return idbTx("readonly",function(st){ return st.get(id); }); }
function idbDel(id){ return idbTx("readwrite",function(st){ st.delete(id); return true; }); }
function idbKeys(){ return idbTx("readonly",function(st){ return st.getAllKeys(); }); }
var idbOk=true;
idbOpen().catch(function(){ idbOk=false; var b=document.querySelectorAll("[data-pick]");
  for(var i=0;i<b.length;i++){ b[i].disabled=true; b[i].title="Bu tarayıcıda dosya saklanamıyor, bağlantı yapıştır."; } });

function cleanupDocs(){
  idbKeys().then(function(keys){
    var used={};
    state.rows.forEach(function(r){
      if(r.usdDoc&&r.usdDoc.kind==="file") used[r.usdDoc.id]=1;
      if(r.eurDoc&&r.eurDoc.kind==="file") used[r.eurDoc.id]=1;
    });
    if(pending.usd&&pending.usd.kind==="file") used[pending.usd.id]=1;
    if(pending.eur&&pending.eur.kind==="file") used[pending.eur.id]=1;
    (keys||[]).forEach(function(k){ if(!used[k]) idbDel(k); });
  }).catch(function(){});
}

function openFile(id){

}

    if(window.DEFTER_DB && DEFTER_DB.aktif() && DEFTER_DB.girisli()){

      DEFTER_DB.dosyaYukle(f).then(function(doc){

        setStatus(f.name+" yüklendi — ayı kaydetmeyi unutma.","ok");
      }).catch(function(err){ setStatus("Dosya yüklenemedi: "+(err&&err.message||""),"warn"); });
      inp.value=""; return;
    }

    idbPut(id,{name:f.name,type:f.type||"application/pdf",blob:f}).then(function(){

    }).catch(function(){

$("entry").addEventListener("submit",function(e){
  e.preventDefault();
  var row={
    id: editingId || uid(),
    year: parseInt($("f-year").value,10)||new Date().getFullYear(),
    month: parseInt($("f-month").value,10)||1,
    usd:num($("f-usd").value), usdTl:num($("f-usdtl").value),
    eur:num($("f-eur").value), eurTl:num($("f-eurtl").value),
    extra:num($("f-extra").value),

  };
  if(row.usdTl<=0 && row.eurTl<=0 && row.extra<=0){ setStatus("Bu ay için en az bir tutar gir.","warn"); return; }
  if(editingId){
    state.rows=state.rows.map(function(r){ return r.id===editingId?row:r; });
  }else{
    var clash=state.rows.filter(function(r){ return r.year===row.year&&r.month===row.month; })[0];
    if(clash){ setStatus(AYLAR[row.month-1]+" "+row.year+" zaten kayıtlı — o satırı düzenle.","warn"); return; }

  var ed=b.getAttribute("data-edit"), dl=b.getAttribute("data-del");
  if(ed){ armedDelete=null; setEditing(ed); return; }
  if(dl){

      armedDelete=dl; render();
      clearTimeout(armTimer);
      armTimer=setTimeout(function(){ armedDelete=null; render(); },4000);
      return;
    }

    var gone=state.rows.filter(function(r){ return r.id===dl; })[0];
    state.rows=state.rows.filter(function(r){ return r.id!==dl; });
    if(editingId===dl) setEditing(null);

    persist(gone?(AYLAR[gone.month-1]+" "+gone.year+" silindi"):"Kayıt silindi");
  }

    if(window.DB_DURUM) DB_DURUM("kaydediliyor…");
    DEFTER_DB.kaydet(state).then(function(){
      if(window.DB_DURUM) DB_DURUM("kaydedildi","ok");
      setStatus((msg||"Kaydedildi")+" · veritabanına yazıldı","ok");
    }).catch(function(e){
      if(window.DB_DURUM) DB_DURUM("yazılamadı","warn");
      setStatus((msg||"Kaydedildi")+" · veritabanına yazılamadı ("+(e&&e.message||"")+")","warn");
    });
    return;
  }
  setStatus((msg||"Kaydedildi")+" · sayfaya işleniyor…","");
  getApi().then(function(api){
    if(!api) { setStatus((msg||"Kaydedildi")+" · yalnızca bu tarayıcıda saklandı","warn"); return; }
    return api.publish(buildDoc()).then(function(){
      setStatus((msg||"Kaydedildi")+" · sayfaya işlendi","ok");
    });
  }).catch(function(err){
    var code=err&&err.code;
    if(code==="conflict") setStatus("Başkası aynı anda kaydetti, sayfa yenileniyor.","warn");
    else setStatus((msg||"Kaydedildi")+" · sayfaya işlenemedi, bu tarayıcıda saklandı","warn");
  });
}

/* ---------- dış arayüz (yedekleme / kur eklentileri için) ---------- */
var stateHooks=[];
window.DEFTER={
  getState:function(){ return state; },
  onState:function(fn){ if(typeof fn==="function") stateHooks.push(fn); },
  setState:function(o){ state=normalize(o); syncRateInputs(); render(); fillForm(null);
    stateHooks.forEach(function(f){ try{ f(state); }catch(e){} }); },
  save:function(msg){ persist(msg); },
  saveLocal:function(msg){
    state.savedAt=Date.now();
    try{ localStorage.setItem("doviz-defteri",JSON.stringify(state)); }catch(e){}
    if(msg) setStatus(msg,"");
  },
  setRates:function(u,e,d){
    if(isFinite(u)&&u>0) elUk.value=String(u).replace(".",",");
    if(isFinite(e)&&e>0) elEk.value=String(e).replace(".",",");
    if(d) elKt.value=d;
    liveRates();
  },
  idb:{put:idbPut,get:idbGet,keys:idbKeys,del:idbDel},
  sheet:sheet, closeSheet:closeSheet, setStatus:setStatus, attr:attr, cleanupDocs:cleanupDocs
};

/* ---------- boot ---------- */
syncRateInputs();
render();
fillForm(null);
setTimeout(cleanupDocs,1200);
})();
</script>

<script id="butce-code">
(function(){
"use strict";
var D=window.DEFTER; if(!D) return;
var AY=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
var isArtifact=false;
try{ isArtifact=(typeof claude!=="undefined" && claude && typeof claude.use==="function"); }catch(e){}

function num(v){
  if(typeof v==="number") return isFinite(v)?v:0;
  var s=String(v==null?"":v).trim().replace(/\s/g,"");
  if(!s) return 0;
  if(s.indexOf(",")>-1 && s.indexOf(".")>-1) s=s.replace(/\./g,"").replace(",",".");
  else if(s.indexOf(",")>-1) s=s.replace(",",".");
  var n=parseFloat(s); return isFinite(n)?n:0;
}
function fmt(n,d){ d=(d==null?2:d); if(!isFinite(n)) n=0;
  return n.toLocaleString("tr-TR",{minimumFractionDigits:d,maximumFractionDigits:d}); }
function tl(n,d){ return fmt(n,d)+" ₺"; }
function inp(v){ return v?String(v).replace(".",","):""; }
function uid(pfx){ return (pfx||"b")+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36); }
function K(y,m){ return y*12+m; }
function ymLabel(y,m){ return AY[m-1]+" "+y; }
function kisa(y,m){ return (m<10?"0":"")+m+"/"+y; }
function ls(k,v){
  try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){}
  return null;
}

/* ---------- veri ---------- */
function B(){
  var st=D.getState();
  if(!st.butce||typeof st.butce!=="object") st.butce={taksitler:[],aylar:[]};
  if(!Array.isArray(st.butce.taksitler)) st.butce.taksitler=[];
  if(!Array.isArray(st.butce.aylar)) st.butce.aylar=[];
  return st.butce;
}
function aylar(){ return B().aylar.slice().sort(function(a,b){ return K(a.yil,a.ay)-K(b.yil,b.ay); }); }
function ayBul(k){ var a=B().aylar; for(var i=0;i<a.length;i++) if(K(a[i].yil,a[i].ay)===k) return a[i]; return null; }

var sel=null, yeniId=null;
function seciliAy(){
  var list=aylar();
  if(!list.length) return null;
  var a=sel!=null?ayBul(sel):null;
  if(!a){ a=list[list.length-1]; sel=K(a.yil,a.ay); }
  return a;
}
function ayKey(){ var a=seciliAy(); var d=new Date();
  return a?K(a.yil,a.ay):K(d.getFullYear(),d.getMonth()+1); }

/* ---------- taksit hesabı ---------- */
function tBas(t){ return K(t.bYil,t.bAy); }
function tSon(t){ return K(t.sYil,t.sAy); }
function tAdet(t){ return Math.max(1,tSon(t)-tBas(t)+1); }
function tAktif(t,k){ return k>=tBas(t) && k<=tSon(t); }
function tDurum(t,k){ return k<tBas(t) ? "gelecek" : (k>tSon(t) ? "bitti" : "aktif"); }
function tIlerleme(t,k){
  var adet=tAdet(t), kac=Math.min(adet,Math.max(0,k-tBas(t)+1)), tut=num(t.tutar);
  return {adet:adet,kac:kac,odenen:tut*kac,toplam:tut*adet,kalanTutar:tut*(adet-kac),oran:adet?kac/adet:0};
}
function ayTaksitleri(k){
  return B().taksitler.filter(function(t){ return tAktif(t,k); })
    .sort(function(a,b){ return num(b.tutar)-num(a.tutar); });
}

/* ---------- toplamlar ---------- */
function hesap(a){
  if(!a) return {taksit:0,fatura:0,gider:0,toplam:0,maas:0,kalan:0,hesaba:0,elde:0,bitiyor:0,aktif:0};
  var k=K(a.yil,a.ay);
  var tk=ayTaksitleri(k), taksit=0, bitiyor=0;
  tk.forEach(function(t){ taksit+=num(t.tutar); if(tSon(t)===k) bitiyor++; });
  var fatura=(a.faturalar||[]).reduce(function(s,x){ return s+num(x.tutar); },0);
  var gider=(a.giderler||[]).reduce(function(s,x){ return s+num(x.tutar); },0);
  var toplam=taksit+fatura+gider, maas=num(a.maas), hesaba=num(a.hesaba);
  return {taksit:taksit,fatura:fatura,gider:gider,toplam:toplam,maas:maas,
    kalan:maas-toplam, hesaba:hesaba, elde:maas-toplam-hesaba, bitiyor:bitiyor, aktif:tk.length};
}

/* ---------- kaydetme ---------- */
var saveT=null;
function kaydet(msg,hemen){
  try{ if(D.saveLocal) D.saveLocal(); }catch(e){}
  clearTimeout(saveT);
  var go=function(){
    if(isArtifact && !hemen){ if(D.saveLocal) D.saveLocal(); durum("Taslak kaydedildi — yayınlamak için Kaydet","warn"); }
    else D.save(msg||"Bütçe kaydedildi");
  };
  if(hemen) go(); else saveT=setTimeout(go,900);
}
function durum(t,kind){
  var el=document.getElementById("bStatus");
  if(el){ el.textContent=t||""; el.className="status"+(kind?" "+kind:""); }
}

/* ---------- açılır kapanır paneller ---------- */
var acc={fatura:true,gider:true,taksit:true};
try{ var raw=ls("defter-acc"); if(raw) acc=JSON.parse(raw); }catch(e){}
function accSave(){ ls("defter-acc",JSON.stringify(acc)); }
function accHead(key,baslik,hint){
  return '<div class="panel-head">'+
    '<button type="button" class="acc-btn" data-acc="'+key+'" aria-expanded="'+(acc[key]?"true":"false")+'">'+
      '<span class="chev" aria-hidden="true">›</span><h2>'+baslik+'</h2></button>'+
    '<span class="hint">'+(hint||"")+'</span></div>';
}
function accClass(key){ return "panel"+(acc[key]?"":" collapsed"); }

/* ---------- kabuk ---------- */
document.getElementById("mod2").innerHTML=[
'<p class="lede">Taksitleri bir kez tanımla — ilk ve son ödeme ayını girdiğinde hangi ayda hangisinin ödeneceğini sayfa kendisi bulur. Her ay için maaşı, faturaları ve o ayın giderlerini gir; kalan aşağıda çıkar.</p>',
'<section class="monthbar">',
  '<button type="button" class="navbtn" id="bPrev" title="Önceki ay">‹</button>',
  '<select id="bSel" aria-label="Ay seç"></select>',
  '<button type="button" class="navbtn" id="bNext" title="Sonraki ay">›</button>',
  '<span class="grow"></span>',
  '<span class="status" id="bStatus"></span>',
  '<div class="actions">',
    (isArtifact?'<button type="button" class="btn sm" id="bSave">Kaydet</button>':''),
    '<button type="button" class="btn ghost sm" id="bCopy">Yeni ay · önceki aydan kopyala</button>',
    '<button type="button" class="btn ghost sm" id="bDel">Ayı sil</button>',
  '</div>',
'</section>',
'<section id="bSummary"></section>',
'<section class="panel" id="pGelir"></section>',
'<section class="panel" id="pOzet"></section>',
'<section class="panel" id="pFatura"></section>',
'<section class="panel" id="pGider"></section>',
'<section class="panel" id="pTaksitler"></section>',
'<footer class="note">',
  '<b>Nasıl çalışıyor?</b> Kalan = Maaş − (bu ayın taksitleri + faturalar + diğer giderler). ',
  'Taksitler, ilk ve son ödeme ayı arasındaki her aya otomatik düşer; son ay <b>son taksit</b> olarak işaretlenir, ',
  'sonraki ayda kendiliğinden çıkar. <b>Ödenen / toplam</b>, o taksitin bugüne kadar ödenmiş kısmını ve ',
  'sözleşme toplamını gösterir. <b>Yeni ay · önceki aydan kopyala</b> ile bir sonraki ayı bir tıkla açar, ',
  'sadece değişenleri düzeltirsin. Panel başlıklarına tıklayarak bölümleri kapatıp açabilirsin.',
'</footer>'
].join("");

var $=function(id){ return document.getElementById(id); };

/* ---------- render ---------- */
function ayOpts(){
  var list=aylar(), a=seciliAy();
  $("bSel").innerHTML=list.map(function(x){
    var k=K(x.yil,x.ay);
    return '<option value="'+k+'"'+(a&&K(a.yil,a.ay)===k?' selected':'')+'>'+ymLabel(x.yil,x.ay)+'</option>';
  }).join("") || '<option>Kayıt yok</option>';
}
function chip(k,v){ return '<div class="chip"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'; }

function renderSummary(){
  var a=seciliAy(), h=hesap(a);
  if(!a){ $("bSummary").innerHTML='<div class="panel empty">Henüz ay kaydı yok. Yukarıdan <b>Yeni ay</b> ile başla.</div>'; return; }
  var dir=h.kalan>=0?"up":"down";
  $("bSummary").innerHTML=['<div class="headline">',
    '<div class="hcell"><span class="k">Maaş</span><span class="v">',tl(h.maas),'</span>',
      '<span class="s">',ymLabel(a.yil,a.ay),'</span></div>',
    '<div class="hcell"><span class="k">Toplam gider</span><span class="v">',tl(h.toplam),'</span>',
      '<span class="s">',fmt(h.aktif,0),' taksit · ',(a.faturalar||[]).length,' fatura · ',(a.giderler||[]).length,' kalem</span></div>',
    '<div class="hcell"><span class="k">Kalan</span><span class="v ',dir,'">',tl(h.kalan),'</span>',
      (h.hesaba>0 ? '<span class="pill flat">hesaba '+fmt(h.hesaba,0)+' ₺ · elde '+fmt(h.elde,0)+' ₺</span>'
                  : '<span class="s">maaşın %'+fmt(h.maas>0?h.kalan/h.maas*100:0,0)+'\'i</span>'),
    '</div></div>',
    '<div class="chips" style="margin-top:14px">',
      chip("Taksitler",tl(h.taksit)),
      chip("Faturalar",tl(h.fatura)),
      chip("Diğer giderler",tl(h.gider)),
      chip("Aktif taksit",fmt(h.aktif,0)+" kalem"),
      chip("Bu ay biten", h.bitiyor? fmt(h.bitiyor,0)+" taksit" : "—"),
    '</div>'].join("");
}

function renderGelir(){
  var a=seciliAy();
  if(!a){ $("pGelir").innerHTML=""; $("pGelir").hidden=true; return; }
  $("pGelir").hidden=false;
  $("pGelir").innerHTML=
    '<div class="panel-head"><h2>'+ymLabel(a.yil,a.ay)+'</h2><span class="hint">Maaş ve hesaba gönderilen tutar</span></div>'+
    '<div class="gelir">'+
      '<div class="field"><label for="bMaas">Maaş ₺</label><input id="bMaas" type="text" inputmode="decimal" value="'+inp(a.maas)+'" placeholder="0"></div>'+
      '<div class="field"><label for="bHesaba">Hesaba gönderilen ₺ <span style="text-transform:none;letter-spacing:0">(varsa)</span></label><input id="bHesaba" type="text" inputmode="decimal" value="'+inp(a.hesaba)+'" placeholder="0"><span class="calc" id="bElde"></span></div>'+
    '</div>';
  $("bMaas").addEventListener("input",function(){ a.maas=num(this.value); renderSummary(); eldeNot(); kaydet(); });
  $("bHesaba").addEventListener("input",function(){ a.hesaba=num(this.value); renderSummary(); eldeNot(); kaydet(); });
  eldeNot();
}
function eldeNot(){
  var a=seciliAy(); if(!a||!$("bElde")) return;
  var h=hesap(a);
  $("bElde").textContent = h.hesaba>0 ? "elde kalan "+tl(h.elde) : "";
}

function prog(oran){
  var p=Math.round(Math.max(0,Math.min(1,oran))*100);
  return '<span class="prog" title="%'+p+'"><i style="width:'+p+'%"></i></span>';
}

/* ---------- bu ayın özeti: taksit + fatura + gider ---------- */
function ozRow(o){
  var h='<div class="oz-row">';
  h+='<span class="oz-ad">'+o.ad+'</span><span class="oz-tut">'+o.tut+'</span>';
  if(o.donem) h+='<span class="oz-donem">'+o.donem+'</span>';
  if(o.tak)   h+='<span class="oz-tak">'+o.tak+'</span>';
  if(o.odn)   h+='<span class="oz-odn">'+o.odn+'</span>';
  if(o.drm)   h+='<span class="oz-drm">'+o.drm+'</span>';
  return h+'</div>';
}
function ozGrp(ad,adet,toplam){
  return '<div class="oz-grp"><span class="g-ad">'+ad+'</span>'+
    '<span class="g-kal">'+adet+' kalem</span><span class="g-tut">'+fmt(toplam)+'</span></div>';
}
function renderOzet(){
  var a=seciliAy();
  if(!a){ $("pOzet").hidden=true; return; }
  $("pOzet").hidden=false;
  var k=K(a.yil,a.ay), h=hesap(a), out=[], tk=ayTaksitleri(k);

  out.push(ozGrp("Taksitler",tk.length,h.taksit));
  if(!tk.length) out.push('<div class="oz-bos">Bu ay ödenecek taksit yok.</div>');
  tk.forEach(function(t){
    var p=tIlerleme(t,k), son=tSon(t)===k;
    out.push(ozRow({
      ad:D.attr(t.ad||"—"), tut:fmt(num(t.tutar)),
      donem:kisa(t.bYil,t.bAy)+" – "+kisa(t.sYil,t.sAy),
      tak:p.kac+'<span class="dim">/'+p.adet+'</span>',
      odn:fmt(p.odenen,0)+' <span class="dim">/ '+fmt(p.toplam,0)+'</span>'+prog(p.oran),
      drm: son ? '<span class="tag warn">son taksit</span>'
               : '<span class="dim">'+fmt(p.kalanTutar,0)+' ₺ kaldı</span>'
    }));
  });

  var fat=a.faturalar||[], gid=a.giderler||[];
  out.push(ozGrp("Faturalar",fat.length,h.fatura));
  if(!fat.length) out.push('<div class="oz-bos">Fatura girilmemiş.</div>');
  fat.forEach(function(x){ out.push(ozRow({ad:D.attr(x.ad||"—"),tut:fmt(num(x.tutar))})); });

  out.push(ozGrp("Diğer giderler",gid.length,h.gider));
  if(!gid.length) out.push('<div class="oz-bos">Gider girilmemiş.</div>');
  gid.forEach(function(x){ out.push(ozRow({ad:D.attr(x.ad||"—"),tut:fmt(num(x.tutar))})); });

  $("pOzet").innerHTML=
    '<div class="panel-head"><h2>Bu ayın özeti</h2><span class="hint">'+ymLabel(a.yil,a.ay)+
      ' · taksitler, faturalar ve giderler bir arada</span></div>'+
    '<div class="ozet">'+
      '<div class="oz-head">'+
        '<span class="oz-ad">Kalem</span><span class="oz-tut">Bu ay ₺</span>'+
        '<span class="oz-donem">Dönem</span><span class="oz-tak">Taksit</span>'+
        '<span class="oz-odn">Ödenen / Toplam ₺</span><span class="oz-drm">Durum</span>'+
      '</div>'+
      out.join("")+
      '<div class="oz-foot"><span>Genel toplam</span><span class="v">'+fmt(h.toplam)+'</span></div>'+
      '<div class="oz-foot son"><span>Maaş '+fmt(h.maas,0)+' ₺ sonrası kalan</span><span class="v">'+fmt(h.kalan)+'</span></div>'+
    '</div>';
}

/* ---------- fatura / gider listeleri ---------- */
function listeHtml(key,baslik,ipucu,items,ekle){
  return accHead(key,baslik,ipucu)+
    '<div class="panel-body"><div class="rows">'+
      (items.length? items.map(function(it,i){
        return '<div class="row2">'+
          '<input type="text" data-l="'+(key==="fatura"?"faturalar":"giderler")+'" data-i="'+i+'" data-f="ad" value="'+D.attr(it.ad||"")+'" placeholder="Kalem adı">'+
          '<input type="text" inputmode="decimal" data-l="'+(key==="fatura"?"faturalar":"giderler")+'" data-i="'+i+'" data-f="tutar" value="'+inp(it.tutar)+'" placeholder="0">'+
          '<button type="button" class="icobtn danger" data-sil="'+(key==="fatura"?"faturalar":"giderler")+'" data-i="'+i+'">Sil</button>'+
        '</div>';
      }).join("") : '<div class="empty">Henüz kalem yok.</div>')+
    '</div>'+
    '<div class="rowfoot"><button type="button" class="btn ghost sm" data-ekle="'+(key==="fatura"?"faturalar":"giderler")+'">+ '+ekle+'</button>'+
    '<span class="rowtot" id="tot-'+key+'"></span></div></div>';
}
function renderListeler(){
  var a=seciliAy();
  if(!a){ $("pFatura").hidden=true; $("pGider").hidden=true; return; }
  $("pFatura").hidden=false; $("pGider").hidden=false;
  a.faturalar=a.faturalar||[]; a.giderler=a.giderler||[];
  $("pFatura").className=accClass("fatura");
  $("pGider").className=accClass("gider");
  $("pFatura").innerHTML=listeHtml("fatura","Faturalar","İnternet, elektrik, gaz, su…",a.faturalar,"Fatura ekle");
  $("pGider").innerHTML=listeHtml("gider","Diğer giderler","Aidat ve o aya özel harcamalar",a.giderler,"Gider ekle");
  totNot();
}
function totNot(){
  var a=seciliAy(); if(!a) return;
  var f=$("tot-fatura"), g=$("tot-gider");
  if(f) f.textContent="Toplam "+tl((a.faturalar||[]).reduce(function(s,x){ return s+num(x.tutar); },0));
  if(g) g.textContent="Toplam "+tl((a.giderler||[]).reduce(function(s,x){ return s+num(x.tutar); },0));
}

/* ---------- taksit listesi ---------- */
var gizleBitmis=(ls("defter-bitenler")==="1");
function rozetHtml(t,k){
  var d=tDurum(t,k), p=tIlerleme(t,k);
  if(d==="bitti") return '<span class="tag done">bitti</span>';
  if(d==="gelecek") return '<span class="tag">başlamadı</span>';
  return tSon(t)===k ? '<span class="tag warn">son taksit</span>' : '<span class="tag ok">'+p.kac+'/'+p.adet+'</span>';
}
function odenenHtml(t,k){
  var p=tIlerleme(t,k);
  return fmt(p.odenen,0)+' <span class="dim">/ '+fmt(p.toplam,0)+'</span>'+prog(p.oran);
}
function satirTazele(id){
  var k=ayKey(), t=B().taksitler.filter(function(x){ return x.id===id; })[0];
  var row=$("pTaksitler")?$("pTaksitler").querySelector('.trow[data-id="'+id+'"]'):null;
  if(!t||!row) return;
  var b=row.querySelector(".trow-badge"), o=row.querySelector(".trow-odn");
  if(b) b.innerHTML=rozetHtml(t,k);
  if(o) o.innerHTML=odenenHtml(t,k);
  row.classList.toggle("off",tDurum(t,k)==="bitti");
}
function renderTaksitler(){
  var k=ayKey();
  var all=B().taksitler.slice().sort(function(x,y){
    if(x.id===yeniId) return -1;
    if(y.id===yeniId) return 1;
    return tBas(x)-tBas(y);
  });
  var list=all.filter(function(t){ return gizleBitmis ? (tDurum(t,k)!=="bitti" || t.id===yeniId) : true; });
  var gizli=all.length-list.length;
  function aySel(t,f,val){
    var o="";
    for(var m=1;m<=12;m++) o+='<option value="'+m+'"'+(val===m?" selected":"")+'>'+AY[m-1]+'</option>';
    return '<select data-t="'+t.id+'" data-f="'+f+'">'+o+'</select>';
  }
  var rows=list.map(function(t){
    return '<div class="trow'+(tDurum(t,k)==="bitti"?" off":"")+'" data-id="'+t.id+'">'+
      '<input type="text" data-t="'+t.id+'" data-f="ad" value="'+D.attr(t.ad||"")+'" placeholder="Kalem adı">'+
      '<input type="text" inputmode="decimal" data-t="'+t.id+'" data-f="tutar" value="'+inp(t.tutar)+'" placeholder="0">'+
      '<span class="mini-l">ilk</span>'+aySel(t,"bAy",t.bAy)+
      '<input type="text" inputmode="numeric" class="yil" data-t="'+t.id+'" data-f="bYil" value="'+(t.bYil||"")+'">'+
      '<span class="mini-l">son</span>'+aySel(t,"sAy",t.sAy)+
      '<input type="text" inputmode="numeric" class="yil" data-t="'+t.id+'" data-f="sYil" value="'+(t.sYil||"")+'">'+
      '<span class="trow-odn odn">'+odenenHtml(t,k)+'</span>'+
      '<span class="trow-badge">'+rozetHtml(t,k)+'</span>'+
      '<button type="button" class="icobtn danger" data-tsil="'+t.id+'">Sil</button>'+
    '</div>';
  }).join("");
  var hint='<label class="chk"><input type="checkbox" id="bGizle"'+(gizleBitmis?" checked":"")+'> Bitenleri gizle</label>'+
           (gizli?' · '+gizli+' gizli':'')+' · '+all.length+' kalem';
  $("pTaksitler").className=accClass("taksit");
  $("pTaksitler").innerHTML=
    accHead("taksit","Taksit listesi",hint)+
    '<div class="panel-body"><div class="tscroll"><div class="trows">'+
      (rows||'<div class="empty">Taksit yok. Aşağıdan ekle.</div>')+'</div></div>'+
    '<div class="rowfoot"><button type="button" class="btn ghost sm" id="bTaksitEkle">+ Taksit ekle</button>'+
    '<span class="rowtot">Bu ayki aktif toplam '+tl(ayTaksitleri(k).reduce(function(s,t){ return s+num(t.tutar); },0))+'</span></div></div>';
  $("bGizle").addEventListener("change",function(){
    gizleBitmis=this.checked; ls("defter-bitenler",gizleBitmis?"1":"0"); renderTaksitler();
  });
  $("bTaksitEkle").addEventListener("click",function(){
    var a2=seciliAy(), y=a2?a2.yil:new Date().getFullYear(), m=a2?a2.ay:new Date().getMonth()+1;
    var son=m+5, sy=y; while(son>12){ son-=12; sy++; }
    var t={id:uid("t"),ad:"",tutar:0,bYil:y,bAy:m,sYil:sy,sAy:son};
    B().taksitler.push(t); yeniId=t.id;
    acc.taksit=true; accSave();
    renderTaksitler(); renderOzet(); renderSummary(); kaydet();
    var el=$("pTaksitler").querySelector('.trow[data-id="'+t.id+'"] input[data-f="ad"]');
    if(el){ el.focus(); el.scrollIntoView({block:"center",behavior:"smooth"}); }
  });
}

function renderAll(){ ayOpts(); renderSummary(); renderGelir(); renderOzet(); renderListeler(); renderTaksitler(); }

/* ---------- olaylar ---------- */
$("mod2").addEventListener("input",function(e){
  var t=e.target, a=seciliAy();
  if(t.hasAttribute("data-l") && a){
    var arr=a[t.getAttribute("data-l")]||[], i=parseInt(t.getAttribute("data-i"),10), f=t.getAttribute("data-f");
    if(arr[i]){ arr[i][f]=(f==="tutar")?num(t.value):t.value; totNot(); renderSummary(); renderOzet(); kaydet(); }
    return;
  }
  if(t.hasAttribute("data-t")){
    var id=t.getAttribute("data-t"), f2=t.getAttribute("data-f");
    var tk=B().taksitler.filter(function(x){ return x.id===id; })[0];
    if(!tk) return;
    if(f2==="tutar") tk.tutar=num(t.value);
    else if(f2==="ad") tk.ad=t.value;
    else {
      var v=String(t.value).replace(/\D/g,"");
      if(v.length!==4) return;               /* yıl tamamlanmadan hesap yapma */
      tk[f2]=parseInt(v,10);
    }
    satirTazele(id); renderOzet(); renderSummary(); kaydet();
  }
});
$("mod2").addEventListener("change",function(e){
  var t=e.target;
  if(t.tagName==="SELECT" && t.hasAttribute("data-t")){
    var id=t.getAttribute("data-t"), f=t.getAttribute("data-f");
    var tk=B().taksitler.filter(function(x){ return x.id===id; })[0];
    if(tk){ tk[f]=parseInt(t.value,10)||1; satirTazele(id); renderOzet(); renderSummary(); kaydet(); }
  }
});
$("mod2").addEventListener("click",function(e){
  var acB=e.target.closest?e.target.closest("[data-acc]"):null;
  if(acB){ var key=acB.getAttribute("data-acc"); acc[key]=!acc[key]; accSave();
    var pnl=acB.closest(".panel"); pnl.classList.toggle("collapsed",!acc[key]);
    acB.setAttribute("aria-expanded",acc[key]?"true":"false"); return; }
  var b=e.target.closest?e.target.closest("button"):null; if(!b) return;
  var a=seciliAy();
  if(b.hasAttribute("data-ekle") && a){
    var key2=b.getAttribute("data-ekle");
    a[key2]=a[key2]||[]; a[key2].push({ad:"",tutar:0});
    renderListeler(); renderSummary(); renderOzet(); kaydet();
    var ins=(key2==="faturalar"?$("pFatura"):$("pGider")).querySelectorAll('input[data-f="ad"]');
    if(ins.length) ins[ins.length-1].focus();
    return;
  }
  if(b.hasAttribute("data-sil") && a){
    var key3=b.getAttribute("data-sil"), i=parseInt(b.getAttribute("data-i"),10);
    (a[key3]||[]).splice(i,1); renderListeler(); renderSummary(); renderOzet(); kaydet(); return;
  }
  if(b.hasAttribute("data-tsil")){
    var id=b.getAttribute("data-tsil");
    var bt=B(); bt.taksitler=bt.taksitler.filter(function(x){ return x.id!==id; });
    if(yeniId===id) yeniId=null;
    renderTaksitler(); renderOzet(); renderSummary(); kaydet(); return;
  }
});
$("bSel").addEventListener("change",function(){ sel=parseInt(this.value,10); yeniId=null; renderAll(); });
function gotoAdj(step){
  var list=aylar(); if(!list.length) return;
  var a=seciliAy(), idx=0;
  for(var i=0;i<list.length;i++) if(K(list[i].yil,list[i].ay)===K(a.yil,a.ay)) idx=i;
  idx=Math.min(list.length-1,Math.max(0,idx+step));
  sel=K(list[idx].yil,list[idx].ay); yeniId=null; renderAll();
}
$("bPrev").addEventListener("click",function(){ gotoAdj(-1); });
$("bNext").addEventListener("click",function(){ gotoAdj(1); });
if($("bSave")) $("bSave").addEventListener("click",function(){ kaydet("Bütçe kaydedildi",true); });

$("bCopy").addEventListener("click",function(){
  var list=aylar(), kaynak=list.length?list[list.length-1]:null, y,m;
  if(kaynak){ y=kaynak.yil; m=kaynak.ay+1; if(m>12){ m=1; y++; } }
  else { var d=new Date(); y=d.getFullYear(); m=d.getMonth()+1; }
  if(ayBul(K(y,m))){ sel=K(y,m); renderAll(); durum(ymLabel(y,m)+" zaten var, ona geçildi.","warn"); return; }
  B().aylar.push({id:uid("a"),yil:y,ay:m,
    maas:kaynak?num(kaynak.maas):0, hesaba:kaynak?num(kaynak.hesaba):0,
    faturalar:(kaynak&&kaynak.faturalar?kaynak.faturalar:[]).map(function(x){ return {ad:x.ad,tutar:num(x.tutar)}; }),
    giderler:(kaynak&&kaynak.giderler?kaynak.giderler:[]).map(function(x){ return {ad:x.ad,tutar:num(x.tutar)}; })});
  sel=K(y,m); yeniId=null; renderAll();
  kaydet(ymLabel(y,m)+" eklendi",true);
  durum(ymLabel(y,m)+(kaynak?" · "+ymLabel(kaynak.yil,kaynak.ay)+" kopyalandı":" eklendi"),"ok");
});

$("bDel").addEventListener("click",function(){
  var a=seciliAy(); if(!a) return;
  D.sheet('<header><span class="nm">Ayı sil</span><span class="acts">'+
    '<button type="button" class="btn ghost sm" data-close>Vazgeç</button>'+
    '<button type="button" class="btn sm" id="bDelGo">Sil</button></span></header>'+
    '<div class="msg"><b>'+ymLabel(a.yil,a.ay)+'</b> ayının maaşı, faturaları ve giderleri silinecek. '+
    'Taksit listesi etkilenmez. Bu işlem geri alınamaz.</div>');
  $("bDelGo").addEventListener("click",function(){
    var bt=B(); bt.aylar=bt.aylar.filter(function(x){ return K(x.yil,x.ay)!==K(a.yil,a.ay); });
    sel=null; D.closeSheet(); renderAll(); kaydet(ymLabel(a.yil,a.ay)+" silindi",true);
  });
});

D.onState(function(){ sel=null; yeniId=null; renderAll(); });
renderAll();
})();
</script>

<script id="odeme-code">
(function(){
"use strict";
var D=window.DEFTER; if(!D) return;
var AY=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
var isArtifact=false;
try{ isArtifact=(typeof claude!=="undefined" && claude && typeof claude.use==="function"); }catch(e){}

function num(v){
  if(typeof v==="number") return isFinite(v)?v:0;
  var s=String(v==null?"":v).trim().replace(/\s/g,"");
  if(!s) return 0;
  if(s.indexOf(",")>-1 && s.indexOf(".")>-1) s=s.replace(/\./g,"").replace(",",".");
  else if(s.indexOf(",")>-1) s=s.replace(",",".");
  var n=parseFloat(s); return isFinite(n)?n:0;
}
function fmt(n,d){ d=(d==null?2:d); if(!isFinite(n)) n=0;
  return n.toLocaleString("tr-TR",{minimumFractionDigits:d,maximumFractionDigits:d}); }
function tl(n,d){ return fmt(n,d)+" ₺"; }
function inp(v){ return v?String(v).replace(".",","):""; }
function uid(){ return "o"+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36); }
function K(y,m){ return y*12+m; }
function yil(k){ return Math.floor((k-1)/12); }
function ay(k){ return k-yil(k)*12; }
function ymLabel(k){ return AY[ay(k)-1]+" "+yil(k); }

var T=new Date(), CK=K(T.getFullYear(),T.getMonth()+1), CD=T.getDate();
var mk=CK;

/* ---------- veri ---------- */
function O(){
  var st=D.getState();
  if(!Array.isArray(st.odemeler)) st.odemeler=[];
  return st.odemeler;
}
function bas(o){ return K(o.bYil,o.bAy); }
function son(o){ return (o.sYil&&o.sAy)?K(o.sYil,o.sAy):0; }   /* 0 = süresiz */
function aktif(o,k){ var s=son(o); return k>=bas(o) && (!s || k<=s); }
function ayTutar(o,k){
  var t=o.tutarlar||{}, best=null;
  for(var key in t){ var kk=parseInt(key,10);
    if(kk<=k && (best===null || kk>best)) best=kk; }
  return best===null ? num(o.tutar) : num(t[best]);
}
function setAyTutar(o,k,v){ o.tutarlar=o.tutarlar||{}; o.tutarlar[k]=v; if(k<=bas(o)) o.tutar=v; }
function odendiMi(o,k){ return !!(o.odendi && o.odendi[k]); }
function setOdendi(o,k,v){ o.odendi=o.odendi||{}; if(v) o.odendi[k]=1; else delete o.odendi[k]; }

function ayListesi(k){
  return O().filter(function(o){ return aktif(o,k); })
    .sort(function(a,b){ return (parseInt(a.gun,10)||0)-(parseInt(b.gun,10)||0); });
}
function durum(o,k){
  if(odendiMi(o,k)) return {s:"ok",t:"ödendi"};
  var g=parseInt(o.gun,10)||1;
  if(k<CK) return {s:"due",t:"ödenmedi"};
  if(k>CK) return {s:"wait",t:"bekliyor"};
  if(CD>g)  return {s:"due",t:(CD-g)+" gün gecikti"};
  if(CD===g) return {s:"due",t:"bugün son gün"};
  return {s:"wait",t:(g-CD)+" gün kaldı"};
}
function hesap(k){
  var list=ayListesi(k), h={adet:list.length,toplam:0,odenen:0,kalan:0,geciken:0,gecikenTutar:0,bugun:0};
  list.forEach(function(o){
    var t=ayTutar(o,k), d=durum(o,k);
    h.toplam+=t;
    if(d.s==="ok") h.odenen+=t; else h.kalan+=t;
    if(d.s==="due"&&!odendiMi(o,k)){ h.geciken++; h.gecikenTutar+=t; }
  });
  return h;
}

/* ---------- kaydetme ---------- */
var saveT=null;
function kaydet(msg,hemen){
  try{ if(D.saveLocal) D.saveLocal(); }catch(e){}
  clearTimeout(saveT);
  var go=function(){
    if(isArtifact && !hemen){ if(D.saveLocal) D.saveLocal(); not("Taslak kaydedildi — yayınlamak için Kaydet","warn"); }
    else D.save(msg||"Ödemeler kaydedildi");
  };
  if(hemen) go(); else saveT=setTimeout(go,900);
}
function not(t,kind){
  var el=document.getElementById("oStatus");
  if(el){ el.textContent=t||""; el.className="status"+(kind?" "+kind:""); }
}

/* ---------- kabuk ---------- */
document.getElementById("mod3").innerHTML=[
'<p class="lede">Her ödemeyi bir kez tanımla: nereye, ne kadar, ayın kaçında ve ne zaman bitecek. Seçtiğin ayda kendiliğinden listelenir — <b class="c-due">ödeme günü gelmiş olanlar kırmızı</b>, <b class="c-wait">günü gelmemişler sarı</b>, <b class="c-ok">ödediklerin yeşil</b>.</p>',
'<section class="monthbar">',
  '<button type="button" class="navbtn" id="oPrev" title="Önceki ay">‹</button>',
  '<select id="oAy" aria-label="Ay"></select>',
  '<select id="oYil" aria-label="Yıl"></select>',
  '<button type="button" class="navbtn" id="oNext" title="Sonraki ay">›</button>',
  '<button type="button" class="btn ghost sm" id="oBugun">Bu ay</button>',
  '<span class="grow"></span>',
  '<span class="status" id="oStatus"></span>',
  (isArtifact?'<div class="actions"><button type="button" class="btn sm" id="oSave">Kaydet</button></div>':''),
'</section>',
'<section id="oSummary"></section>',
'<section class="panel" id="oPanel"></section>',
'<footer class="note">',
  '<b>Renkler.</b> Yeşil: ödedin. Kırmızı: son ödeme günü geldi ya da geçti, hâlâ ödenmedi. Sarı: günü gelmedi. ',
  'Renkler bugünün tarihine göre hesaplanır, sayfayı her açtığında güncellenir.<br>',
  '<b>Tutarlar aya göre.</b> Bir ayın tutarını değiştirirsen o ay ve sonraki aylar o tutarı kullanır; ',
  'önceki aylar kendi tutarında kalır. Kart ekstresi her ay değiştiği için böyle kurgulandı.<br>',
  '<b>Bitiş ayı</b> boşsa ödeme süresiz sayılır ve her ay listede çıkar; doldurursan o aydan sonra kendiliğinden düşer.',
'</footer>'
].join("");

var $=function(id){ return document.getElementById(id); };

/* ---------- render ---------- */
function yilAralik(){
  var ys=[yil(CK)-1, yil(CK)+3];
  O().forEach(function(o){
    if(o.bYil && o.bYil<ys[0]) ys[0]=o.bYil;
    if(o.sYil && o.sYil>ys[1]) ys[1]=o.sYil;
  });
  var out=[];
  for(var y=ys[0];y<=ys[1];y++) out.push(y);
  return out;
}
function selectleriDoldur(){
  $("oAy").innerHTML=AY.map(function(a,i){
    return '<option value="'+(i+1)+'"'+(ay(mk)===i+1?" selected":"")+'>'+a+'</option>'; }).join("");
  $("oYil").innerHTML=yilAralik().map(function(y){
    return '<option value="'+y+'"'+(yil(mk)===y?" selected":"")+'>'+y+'</option>'; }).join("");
}
function chip(k,v,cls){ return '<div class="chip'+(cls?" "+cls:"")+'"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'; }

function renderSummary(){
  var h=hesap(mk);
  $("oSummary").innerHTML=['<div class="headline">',
    '<div class="hcell"><span class="k">Bu ay toplam</span><span class="v">',tl(h.toplam),'</span>',
      '<span class="s">',ymLabel(mk),' · ',h.adet,' ödeme</span></div>',
    '<div class="hcell"><span class="k">Ödenen</span><span class="v up">',tl(h.odenen),'</span>',
      '<span class="s">',(h.toplam>0?"%"+fmt(h.odenen/h.toplam*100,0):"—"),' tamam</span></div>',
    '<div class="hcell"><span class="k">Kalan</span><span class="v',(h.geciken?" down":""),'">',tl(h.kalan),'</span>',
      (h.geciken ? '<span class="pill down">▲ '+h.geciken+' ödeme günü geçti · '+fmt(h.gecikenTutar,0)+' ₺</span>'
                 : '<span class="s">günü gelen ödeme yok</span>'),
    '</div></div>'].join("");
}

function renderListe(){
  var list=ayListesi(mk), h=hesap(mk);
  var yillar=yilAralik();
  function aySel(o,val){
    var s='<option value="0">—</option>';
    for(var m=1;m<=12;m++) s+='<option value="'+m+'"'+(val===m?" selected":"")+'>'+AY[m-1]+'</option>';
    return '<select data-o="'+o.id+'" data-f="sAy">'+s+'</select>';
  }
  function yilSel(o,val){
    var s='<option value="0">—</option>';
    yillar.forEach(function(y){ s+='<option value="'+y+'"'+(val===y?" selected":"")+'>'+y+'</option>'; });
    return '<select data-o="'+o.id+'" data-f="sYil">'+s+'</select>';
  }
  var rows=list.map(function(o){
    var d=durum(o,mk), t=ayTutar(o,mk), g=parseInt(o.gun,10)||1;
    return '<div class="od-row '+d.s+'" data-id="'+o.id+'">'+
      '<label class="od-chk" title="Ödendi işareti"><input type="checkbox" data-od="'+o.id+'"'+(odendiMi(o,mk)?" checked":"")+'><span></span></label>'+
      '<input class="od-ad" type="text" data-o="'+o.id+'" data-f="ad" value="'+D.attr(o.ad||"")+'" placeholder="Nereye ödenecek">'+
      '<input class="od-tut" type="text" inputmode="decimal" data-o="'+o.id+'" data-f="tutar" value="'+inp(t)+'" placeholder="0">'+
      '<span class="od-gun"><span class="mini-l">ayın</span>'+
        '<input class="gun" type="text" inputmode="numeric" data-o="'+o.id+'" data-f="gun" value="'+g+'"><span class="mini-l">günü</span></span>'+
      '<span class="od-bit"><span class="mini-l">bitiş</span>'+aySel(o,parseInt(o.sAy,10)||0)+yilSel(o,parseInt(o.sYil,10)||0)+'</span>'+
      '<span class="od-drm"><span class="tag '+d.s+'">'+d.t+'</span></span>'+
      '<button type="button" class="icobtn danger" data-osil="'+o.id+'">Sil</button>'+
    '</div>';
  }).join("");
  $("oPanel").innerHTML=
    '<div class="panel-head"><h2>'+ymLabel(mk)+' ödemeleri</h2>'+
      '<span class="hint">Ödeme gününe göre sıralı · kutuyu işaretleyince yeşile döner</span></div>'+
    '<div class="od-list">'+(rows||'<div class="empty">Bu ayda ödeme yok. Aşağıdan ekle.</div>')+'</div>'+
    '<div class="rowfoot"><button type="button" class="btn ghost sm" id="oEkle">+ Ödeme ekle</button>'+
    '<span class="rowtot">Toplam '+tl(h.toplam)+' · ödenen '+fmt(h.odenen,0)+' · kalan '+fmt(h.kalan,0)+' ₺</span></div>';
  $("oEkle").addEventListener("click",function(){
    var o={id:uid(),ad:"",tutar:0,gun:1,bYil:yil(mk),bAy:ay(mk),sYil:0,sAy:0,odendi:{},tutarlar:{}};
    O().push(o); renderAll(); kaydet();
    var el=$("oPanel").querySelector('.od-row[data-id="'+o.id+'"] .od-ad');
    if(el){ el.focus(); el.scrollIntoView({block:"center",behavior:"smooth"}); }
  });
}

function footTazele(){
  var el=$("oPanel")?$("oPanel").querySelector(".rowtot"):null;
  if(!el) return;
  var h=hesap(mk);
  el.textContent="Toplam "+tl(h.toplam)+" · ödenen "+fmt(h.odenen,0)+" · kalan "+fmt(h.kalan,0)+" ₺";
}
function rozetTazele(id){
  var o=O().filter(function(x){ return x.id===id; })[0];
  var row=$("oPanel")?$("oPanel").querySelector('.od-row[data-id="'+id+'"]'):null;
  if(!o||!row) return;
  var d=durum(o,mk);
  row.className="od-row "+d.s;
  var el=row.querySelector(".od-drm");
  if(el) el.innerHTML='<span class="tag '+d.s+'">'+d.t+'</span>';
}
function tabRozet(){
  var tab=document.querySelector('.tab[data-tab="mod3"]');
  if(!tab) return;
  var h=hesap(CK), dot=tab.querySelector(".tabdot");
  if(h.geciken){
    if(!dot){ dot=document.createElement("span"); tab.appendChild(dot); }
    dot.className="tabdot badge";
    dot.textContent=String(h.geciken);
    dot.title=h.geciken+" ödemenin günü geldi veya gecikti";
  } else if(dot) dot.remove();
}
function renderAll(){ selectleriDoldur(); renderSummary(); renderListe(); tabRozet(); }

/* ---------- olaylar ---------- */
$("mod3").addEventListener("input",function(e){
  var t=e.target; if(!t.hasAttribute("data-o")) return;
  var o=O().filter(function(x){ return x.id===t.getAttribute("data-o"); })[0];
  if(!o) return;
  var f=t.getAttribute("data-f");
  if(f==="ad") o.ad=t.value;
  else if(f==="tutar") setAyTutar(o,mk,num(t.value));
  else if(f==="gun"){
    var g=parseInt(String(t.value).replace(/\D/g,""),10);
    if(!g) return;
    o.gun=Math.min(31,Math.max(1,g));
  }
  rozetTazele(o.id); renderSummary(); footTazele(); tabRozet(); kaydet();
});
$("mod3").addEventListener("change",function(e){
  var t=e.target;
  if(t.hasAttribute("data-od")){
    var o1=O().filter(function(x){ return x.id===t.getAttribute("data-od"); })[0];
    if(o1){ setOdendi(o1,mk,t.checked); rozetTazele(o1.id); renderSummary(); footTazele(); tabRozet();
      kaydet((o1.ad||"Ödeme")+(t.checked?" ödendi":" işareti kaldırıldı")); }
    return;
  }
  if(t.tagName==="SELECT" && t.hasAttribute("data-o")){
    var o2=O().filter(function(x){ return x.id===t.getAttribute("data-o"); })[0];
    if(o2){ o2[t.getAttribute("data-f")]=parseInt(t.value,10)||0; renderAll(); kaydet(); }
  }
});
$("mod3").addEventListener("click",function(e){
  var b=e.target.closest?e.target.closest("button[data-osil]"):null; if(!b) return;
  var id=b.getAttribute("data-osil");

<script id="tcmb-kur">
(function(){
  var uk=document.getElementById("uk"), ek=document.getElementById("ek"), kt=document.getElementById("kt");
  if(!uk||!ek||!kt) return;
  var kf=window.TCMB_KUR;
  var fromFile=!!(kf&&isFinite(Number(kf.usd))&&isFinite(Number(kf.eur))&&Number(kf.usd)>0);
  var noteEl=document.querySelector(".rates .rate-note");
  if(noteEl) noteEl.id="fetchNote";
  
  var actions=document.querySelector(".rates .actions");
  
  var btn=document.createElement("button");
  btn.type="button"; btn.className="btn ghost"; btn.id="fetchTcmb"; btn.textContent="Kuru yenile";
  
  var pasteBtn=document.createElement("button");
  pasteBtn.type="button"; pasteBtn.className="btn ghost"; pasteBtn.id="pasteXmlBtn"; pasteBtn.textContent="XML Yapıştır";
  pasteBtn.title="TCMB XML içeriğini yapıştırarak veya dosya seçerek kuru aktar";
  
  if(actions){
    actions.insertBefore(pasteBtn, actions.firstChild);
    actions.insertBefore(btn, actions.firstChild);
  } else {
    var rBox = document.querySelector(".rates");
    if(rBox){ rBox.appendChild(btn); rBox.appendChild(pasteBtn); }
  }

  function note(t,warn){
    var n=document.getElementById("fetchNote"); if(!n) return;
    n.textContent=t; n.style.color = warn ? "var(--loss)" : "var(--muted)";
  }
  function setVal(el,v){
    el.value=String(v).replace(".",",");
    el.dispatchEvent(new Event("input",{bubbles:true}));
  }
  function apply(u,e,d,kaynak){
    setVal(uk,u); setVal(ek,e);
    if(d){ kt.value=d; kt.dispatchEvent(new Event("input",{bubbles:true})); }
    note("TCMB "+(d||"")+" · "+kaynak+" — Kuru kaydet'e bas",false);
  }
  function parseXml(txt){
    var doc=new DOMParser().parseFromString(txt,"text/xml");
    function rate(code){
      var n=doc.querySelector('Currency[CurrencyCode="'+code+'"] ForexBuying');
      if(!n) n=doc.querySelector('Currency[CurrencyCode="'+code+'"] BanknoteBuying');
      return n ? parseFloat(n.textContent.trim().replace(",",".")) : NaN;
    }
    var td=doc.querySelector("Tarih_Date");
    return {
      usd:rate("USD"),
      eur:rate("EUR"),
      tarih: td ? (td.getAttribute("Tarih")||td.getAttribute("Date")||"") : ""
    };
  }

  /* Çoklu kaynak üzerinden sırayla kur çekimi */
  function pull(manual){
    note("TCMB kuru alınıyor…",false);
    var sources = [
      { url: "https://www.tcmb.gov.tr/kurlar/today.xml", name: "TCMB Canlı XML", type: "xml" },
      { url: "./tcmb.xml?_="+Date.now(), name: "Depo TCMB XML", type: "xml" },
      { url: "/tcmb?_="+Date.now(), name: "Vekil /tcmb", type: "xml" },
      { url: "https://api.allorigins.win/raw?url="+encodeURIComponent("https://www.tcmb.gov.tr/kurlar/today.xml"), name: "TCMB (AllOrigins)", type: "xml" },
      { url: "https://corsproxy.io/?url="+encodeURIComponent("https://www.tcmb.gov.tr/kurlar/today.xml"), name: "TCMB (CORS Proxy)", type: "xml" },
      { url: "https://api.codetabs.com/v1/proxy?quest="+encodeURIComponent("https://www.tcmb.gov.tr/kurlar/today.xml"), name: "TCMB (CodeTabs)", type: "xml" },
      { url: "https://open.er-api.com/v6/latest/USD", name: "Döviz API", type: "erapi" }
    ];

    function fetchWithTimeout(url, ms){
      var controller = new AbortController();
      var timer = setTimeout(function(){ controller.abort(); }, ms||4500);
      return fetch(url, {cache:"no-store", signal:controller.signal})
        .then(function(r){ clearTimeout(timer); if(!r.ok) throw new Error("HTTP "+r.status); return r; })
        .catch(function(e){ clearTimeout(timer); throw e; });
    }

    var i = 0;
    function tryNext(){
      if(i >= sources.length){
        note("TCMB kuruna otomatik ulaşılamadı — XML Yapıştır düğmesini veya elle girişi kullanabilirsin.", !!manual);
        return;
      }
      var s = sources[i++];
      fetchWithTimeout(s.url, 4500)
        .then(function(r){
          if(s.type === "xml"){
            return r.text().then(function(txt){
              var k = parseXml(txt);
              if(!isFinite(k.usd) || !isFinite(k.eur) || k.usd <= 0 || k.eur <= 0) throw new Error("geçersiz xml");
              apply(k.usd, k.eur, k.tarih, s.name);
            });
          } else if(s.type === "erapi"){
            return r.json().then(function(data){
              var usdTry = data && data.rates && data.rates.TRY;
              var eurTry = usdTry && data.rates.EUR ? (usdTry / data.rates.EUR) : null;
              if(!usdTry || !eurTry) throw new Error("oran yok");
              var d = new Date().toLocaleDateString("tr-TR");
              apply(usdTry.toFixed(4), eurTry.toFixed(4), d, s.name);
            });
          }
        })
        .catch(function(){
          tryNext();
        });
    }

    tryNext();
  }

  btn.addEventListener("click",function(){ pull(true); });
  if(fromFile) apply(Number(kf.usd),Number(kf.eur),String(kf.tarih||""),"kur.js"); else pull(false);

  /* XML Yapıştır / Dosya Yükle Modalı */
  pasteBtn.addEventListener("click",function(){
    var D = window.DEFTER;
    var inner = 
      '<div class="xml-modal-box">'+
        '<h3>TCMB XML\'den Kur Aktar</h3>'+
        '<p>TCMB resmi XML sayfasını açıp içeriği kopyalayarak buraya yapıştırabilir veya indirdiğiniz <b>today.xml</b> dosyasını seçebilirsiniz.</p>'+
        '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'+
          '<a class="btn ghost sm" href="https://www.tcmb.gov.tr/kurlar/today.xml" target="_blank" rel="noopener">TCMB today.xml Aç ↗</a>'+
          '<label class="btn ghost sm" style="cursor:pointer;margin:0">XML Dosyası Seç<input type="file" id="xmlFilePick" accept=".xml,text/xml" style="display:none"></label>'+
        '</div>'+
        '<textarea id="xmlPasteArea" placeholder="TCMB XML kodunu buraya yapıştırın (<Tarih_Date...>)..."></textarea>'+
        '<div id="xmlParseErr" style="font-size:12.5px;color:var(--loss);min-height:16px"></div>'+
        '<div class="actions">'+
          '<button type="button" class="btn ghost sm" data-close>Vazgeç</button>'+
          '<button type="button" class="btn sm" id="xmlApplyBtn">Kurları Aktar</button>'+
        '</div>'+
      '</div>';
      
    var sheetEl = (D && D.sheet) ? D.sheet(inner) : null;
    if(!sheetEl) return;

    function applyXmlText(txt){
      var errEl = document.getElementById("xmlParseErr");
      try{
        var k = parseXml(txt);
        if(!isFinite(k.usd) || !isFinite(k.eur) || k.usd <= 0 || k.eur <= 0){
          if(errEl) errEl.textContent = "XML içinde USD/EUR ForexBuying kuru bulunamadı.";
          return;
        }
        apply(k.usd, k.eur, k.tarih, "XML Yapıştırma");
        if(D && D.closeSheet) D.closeSheet();
      }catch(e){
        if(errEl) errEl.textContent = "XML okunamadı: " + (e&&e.message||"");
      }
    }

    var xmlApply = document.getElementById("xmlApplyBtn");
    if(xmlApply){
      xmlApply.addEventListener("click",function(){
        var txt = (document.getElementById("xmlPasteArea")||{}).value || "";
        applyXmlText(txt);
      });
    }

    var filePick = document.getElementById("xmlFilePick");
    if(filePick){
      filePick.addEventListener("change",function(){
        var file = this.files && this.files[0];
        if(!file) return;
        var reader = new FileReader();
        reader.onload = function(e){
          var txt = String(e.target.result || "");
          var area = document.getElementById("xmlPasteArea");
          if(area) area.value = txt;
          applyXmlText(txt);
        };
        reader.readAsText(file);
      });
    }
  });
})();
</script>
<script id="backup-tools">
/* Yedek al / yedeği yükle — veriler tarayıcıda durduğu için taşıma ve güvence yolu. */
(function(){
  var D=window.DEFTER; if(!D) return;
  var host=document.querySelector(".wrap");
  if(!host) return;
  var bar=document.createElement("div");
  bar.className="backup";
  bar.innerHTML='<span class="bk-note">Kayıtlar bu tarayıcıda tutuluyor. Başka cihaza taşımak ya da güvence altına almak için yedek al.</span>'+
    '<span class="bk-acts">'+
      '<button type="button" class="btn ghost sm" id="bkExport">Yedek al</button>'+
      '<button type="button" class="btn ghost sm" id="bkImport">Yedeği yükle</button>'+
      '<input type="file" id="bkFile" accept="application/json,.json" hidden>'+
    '</span>';
  host.appendChild(bar);

  function b64(blob){
    return new Promise(function(res,rej){
      var r=new FileReader();
      r.onload=function(){ var s=String(r.result); res(s.slice(s.indexOf(",")+1)); };
      r.onerror=function(){ rej(r.error); };
      r.readAsDataURL(blob);
    });
  }
  function fromB64(b,type){
    var bin=atob(b), n=bin.length, arr=new Uint8Array(n);
    for(var i=0;i<n;i++) arr[i]=bin.charCodeAt(i);
    return new Blob([arr],{type:type||"application/pdf"});
  }
  function usedIds(st){
    var ids=[];
    (st.rows||[]).forEach(function(r){
      if(r.usdDoc&&r.usdDoc.kind==="file") ids.push(r.usdDoc.id);
      if(r.eurDoc&&r.eurDoc.kind==="file") ids.push(r.eurDoc.id);
    });
    return ids;
  }
  document.getElementById("bkExport").addEventListener("click",function(){
    var st=D.getState();
    var ids=usedIds(st), docs={}, chain=Promise.resolve();
    D.setStatus("Yedek hazırlanıyor…","");
    ids.forEach(function(id){
      chain=chain.then(function(){
        return D.idb.get(id).then(function(rec){
          if(rec&&rec.blob) return b64(rec.blob).then(function(d){ docs[id]={name:rec.name,type:rec.type,data:d}; });
        }).catch(function(){});
      });
    });
    chain.then(function(){
      var pack={format:"doviz-defteri",v:1,alindi:new Date().toISOString(),state:st,docs:docs};
      var blob=new Blob([JSON.stringify(pack)],{type:"application/json"});
      var url=URL.createObjectURL(blob);
      var a=document.createElement("a");
      var d=new Date(), pad=function(n){ return (n<10?"0":"")+n; };
      a.href=url; a.download="doviz-defteri-"+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+".json";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); },20000);
      var mb=(blob.size/1048576).toFixed(2);
      D.setStatus("Yedek indirildi ("+mb+" MB, "+(st.rows||[]).length+" ay, "+Object.keys(docs).length+" dekont).","ok");
    });
  });

  document.getElementById("bkImport").addEventListener("click",function(){ document.getElementById("bkFile").click(); });
  document.getElementById("bkFile").addEventListener("change",function(){
    var f=this.files&&this.files[0]; this.value="";
    if(!f) return;
    var r=new FileReader();
    r.onload=function(){
      var pack;
      try{
        pack=JSON.parse(String(r.result),function(k,v){
          if(k==="__proto__"||k==="constructor"||k==="prototype") return undefined;
          return v;
        });
      }catch(e){ D.setStatus("Dosya okunamadı — geçerli bir yedek değil.","warn"); return; }
      if(!pack||pack.format!=="doviz-defteri"||!pack.state){ D.setStatus("Bu dosya bu defterin yedeği değil.","warn"); return; }
      var n=(pack.state.rows||[]).length, nd=Object.keys(pack.docs||{}).length;
      var mevcut=(D.getState().rows||[]).length;
      D.sheet('<header><span class="nm">Yedeği yükle</span><span class="acts">'+
        '<button type="button" class="btn ghost sm" data-close>Vazgeç</button>'+
        '<button type="button" class="btn sm" id="bkGo">Yükle</button></span></header>'+
        '<div class="msg">Yedekte <b>'+n+' ay</b> ve <b>'+nd+' dekont</b> var. Yüklersen şu anki '+mevcut+
        ' aylık kayıt silinip yerine bunlar gelir. Bu işlem geri alınamaz.</div>');
      document.getElementById("bkGo").addEventListener("click",function(){
        var dbOn = !!(window.DEFTER_DB && DEFTER_DB.aktif() && DEFTER_DB.girisli());
        var chain=Promise.resolve(), esle={};
        Object.keys(pack.docs||{}).forEach(function(id){
          var d=pack.docs[id];
          chain=chain.then(function(){
            var blob=fromB64(d.data,d.type);
            if(dbOn){
              try{ blob.name=d.name; }catch(e){}
              var f = (typeof File==="function") ? new File([blob],d.name,{type:d.type||"application/pdf"}) : blob;
              return DEFTER_DB.dosyaYukle(f).then(function(doc){ esle[id]=doc; }).catch(function(){});
            }
            return D.idb.put(id,{name:d.name,type:d.type,blob:blob}).catch(function(){});
          });
        });
        chain.then(function(){
          if(dbOn){
            (pack.state.rows||[]).forEach(function(r){
              ["usdDoc","eurDoc"].forEach(function(k){
                var v=r[k];
                if(v && v.kind==="file" && esle[v.id]) r[k]=esle[v.id];
              });
            });
          }
          D.setState(pack.state);
          D.closeSheet();
          D.save("Yedek yüklendi");
          D.cleanupDocs();
        });
      });
    };
    r.readAsText(f);
  });
})();
</script>

<script id="db-code">

window.DEFTER_DB = (function(){
"use strict";
var C = window.SUPABASE_AYAR || {};
var URL_ = String(C.url||"").replace(/\/+$/,"");
var KEY  = String(C.anonKey||"");

function girisli(){ return !!(ses && ses.access_token); }
function uid(){ return ses?ses.uid:null; }

/* ---------- oturum saklama ---------- */
function sesYaz(){ try{ localStorage.setItem(OTURUM,JSON.stringify(ses)); }catch(e){} }
