/* ---------- auth ---------- */
function authPost(qs,body){
  return fetch(URL_+"/auth/v1/token?"+qs,{
    method:"POST",
    headers:{"apikey":KEY,"Authorization":"Bearer "+KEY,"Content-Type":"application/json"},
    body:JSON.stringify(body)
  }).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(j){
      if(!r.ok){
        var e=new Error(j.error_description||j.msg||j.message||j.error||("HTTP "+r.status));
        e.status=r.status; e.kod=String(j.error_code||j.error||""); e.ham=j; throw e;
      }
      return j;
    });
  });
}
function sesKur(j){
  ses={access_token:j.access_token, refresh_token:j.refresh_token,
       expires_at: Date.now()+((j.expires_in||3600)*1000),
       uid:(j.user&&j.user.id)||(ses&&ses.uid)||null};
  sesYaz(); return ses;
}
function giris(parola,eposta){
  var m = eposta || MAIL;
  return authPost("grant_type=password",{email:m,password:parola}).then(sesKur);

  if(!ses||!ses.refresh_token) return Promise.reject(new Error("oturum yok"));
  return authPost("grant_type=refresh_token",{refresh_token:ses.refresh_token}).then(sesKur);

function token(){
  if(!ses) return Promise.reject(new Error("oturum yok"));
  if(Date.now() > ses.expires_at-60000) return tazele().then(function(){ return ses.access_token; });
  return Promise.resolve(ses.access_token);
}

/* ---------- REST ---------- */
function rest(yol,opt){
  opt=opt||{};
  return token().then(function(t){
    var h={"apikey":KEY,"Authorization":"Bearer "+t};
    if(opt.body) h["Content-Type"]="application/json";
    if(opt.prefer) h["Prefer"]=opt.prefer;
    return fetch(URL_+"/rest/v1/"+yol,{method:opt.method||"GET",headers:h,
      body:opt.body?JSON.stringify(opt.body):undefined});
  }).then(function(r){
    if(r.status===204) return null;
    return r.text().then(function(t){
      var j=null; try{ j=t?JSON.parse(t):null; }catch(e){ j=t; }
      if(!r.ok){
        var e2=new Error((j&&(j.message||j.hint))||("HTTP "+r.status));
        e2.status=r.status; e2.detay=j; throw e2;
      }
      return j;
    });
  });
}
function upsert(tablo,satirlar,cakisma){

    prefer:"resolution=merge-duplicates,return=minimal"});

/* ---------- yardımcı ---------- */
function n(v){ var x=Number(v); return isFinite(x)?x:0; }
function K(y,m){ return y*12+m; }
function kYil(k){ return Math.floor((k-1)/12); }
function kAy(k){ return k-kYil(k)*12; }
function yeniId(p){ return (p||"x")+Date.now().toString(36)+Math.floor(Math.random()*1e6).toString(36); }
function inliste(a){ return "in.("+a.map(function(x){ return '"'+String(x).replace(/"/g,'\\"')+'"'; }).join(",")+")"; }

/* ---------- DB -> uygulama durumu ---------- */
function yukle(){

    var st={
      savedAt:Date.now(),

      rows:dv.map(function(x){ return {id:x.id,year:x.yil,month:x.ay,usd:n(x.usd),usdTl:n(x.usd_tl),

        usdDoc:x.usd_dekont||null,eurDoc:x.eur_dekont||null}; }),
      butce:{
        taksitler:tk.map(function(x){ return {id:x.id,ad:x.ad,tutar:n(x.tutar),
          bYil:x.bas_yil,bAy:x.bas_ay,sYil:x.bit_yil,sAy:x.bit_ay}; }),
        aylar:ba.map(function(x){
          var f=[],g=[];
          bk.forEach(function(k){ if(k.ay_id!==x.id) return;
            (k.tur==="fatura"?f:g).push({id:k.id,ad:k.ad,tutar:n(k.tutar)}); });
          return {id:x.id,yil:x.yil,ay:x.ay,maas:n(x.maas),hesaba:n(x.hesaba),faturalar:f,giderler:g};
        })
      },
      odemeler:od.map(function(x){
        var o={id:x.id,ad:x.ad,tutar:n(x.tutar),gun:x.gun,bYil:x.bas_yil,bAy:x.bas_ay,
               sYil:x.bit_yil||0,sAy:x.bit_ay||0,odendi:{},tutarlar:{}};
        odd.forEach(function(d){ if(d.odeme_id===x.id && d.odendi) o.odendi[K(d.yil,d.ay)]=1; });
        odt.forEach(function(t){ if(t.odeme_id===x.id) o.tutarlar[K(t.yil,t.ay)]=n(t.tutar); });
        return o;
      })
    };
    snap=satirlar(st);
    return st;
  });
}

/* ---------- uygulama durumu -> DB satırları ---------- */
function satirlar(st){
  var u=uid();
  var out={ayarlar:{},doviz:{},taksit:{},bay:{},bkalem:{},odeme:{},oddurum:{},odtutar:{}};
  out.ayarlar[u]={user_id:u,usd_kur:n(st.usdRate),eur_kur:n(st.eurRate),kur_tarihi:String(st.rateDate||"")};
  (st.rows||[]).forEach(function(r){
    if(!r.id) r.id=yeniId("d");
    out.doviz[r.id]={id:r.id,user_id:u,yil:r.year,ay:r.month,usd:n(r.usd),usd_tl:n(r.usdTl),
      eur:n(r.eur),eur_tl:n(r.eurTl),ek_tl:n(r.extra),vergi_dilimi:n(r.tax),
      usd_dekont:r.usdDoc||null,eur_dekont:r.eurDoc||null};
  });
  var b=(st.butce||{});
  (b.taksitler||[]).forEach(function(t){
    if(!t.id) t.id=yeniId("t");
    out.taksit[t.id]={id:t.id,user_id:u,ad:String(t.ad||""),tutar:n(t.tutar),
      bas_yil:t.bYil,bas_ay:t.bAy,bit_yil:t.sYil,bit_ay:t.sAy};
  });
  (b.aylar||[]).forEach(function(a){
    if(!a.id) a.id=yeniId("a");
    out.bay[a.id]={id:a.id,user_id:u,yil:a.yil,ay:a.ay,maas:n(a.maas),hesaba:n(a.hesaba)};
    [["fatura",a.faturalar],["gider",a.giderler]].forEach(function(p){
      (p[1]||[]).forEach(function(k,i){
        if(!k.id) k.id=yeniId("k");
        out.bkalem[k.id]={id:k.id,user_id:u,ay_id:a.id,tur:p[0],ad:String(k.ad||""),tutar:n(k.tutar),sira:i};
      });
    });
  });
  (st.odemeler||[]).forEach(function(o){
    if(!o.id) o.id=yeniId("o");
    out.odeme[o.id]={id:o.id,user_id:u,ad:String(o.ad||""),tutar:n(o.tutar),
      gun:Math.min(31,Math.max(1,parseInt(o.gun,10)||1)),
      bas_yil:o.bYil,bas_ay:o.bAy,bit_yil:parseInt(o.sYil,10)||0,bit_ay:parseInt(o.sAy,10)||0};
    var d=o.odendi||{};
    for(var k in d){ if(!d[k]) continue; var kk=parseInt(k,10);
      out.oddurum[o.id+"|"+kk]={odeme_id:o.id,yil:kYil(kk),ay:kAy(kk),user_id:u,odendi:true}; }
    var t2=o.tutarlar||{};
    for(var k2 in t2){ var k3=parseInt(k2,10);
      out.odtutar[o.id+"|"+k3]={odeme_id:o.id,yil:kYil(k3),ay:kAy(k3),user_id:u,tutar:n(t2[k2])}; }
  });
  return out;
}

/* ---------- fark bul ve yaz ---------- */
function fark(yeni,eski){
  var ekle=[],cikar=[];
  for(var k in yeni){ if(!eski[k] || JSON.stringify(eski[k])!==JSON.stringify(yeni[k])) ekle.push(yeni[k]); }
  for(var k2 in eski){ if(!yeni[k2]) cikar.push(k2); }
  return {ekle:ekle,cikar:cikar};
}
function kaydet(st){
  if(!girisli()) return Promise.reject(new Error("oturum yok"));
  if(!snap) return Promise.reject(new Error("veri henüz yüklenmedi"));
  zincir=zincir.then(function(){ return yaz(st); }).catch(function(e){ throw e; });
  return zincir;
}
function yaz(st){
  var yeni=satirlar(st), eski=snap||{ayarlar:{},doviz:{},taksit:{},bay:{},bkalem:{},odeme:{},oddurum:{},odtutar:{}};
  var f={}; ["ayarlar","doviz","taksit","bay","bkalem","odeme","oddurum","odtutar"].forEach(function(k){
    f[k]=fark(yeni[k],eski[k]); });

  var p=Promise.resolve();
  /* önce silmeler: bağımlı tablolardan başla */
  if(f.oddurum.cikar.length) p=p.then(function(){ return silCift("odeme_durum",f.oddurum.cikar); });
  if(f.odtutar.cikar.length) p=p.then(function(){ return silCift("odeme_tutar",f.odtutar.cikar); });
  if(f.bkalem.cikar.length)  p=p.then(function(){ return sil("butce_kalemler","id="+inliste(f.bkalem.cikar)); });
  if(f.odeme.cikar.length)   p=p.then(function(){ return sil("odemeler","id="+inliste(f.odeme.cikar)); });
  if(f.bay.cikar.length)     p=p.then(function(){ return sil("butce_aylar","id="+inliste(f.bay.cikar)); });
  if(f.taksit.cikar.length)  p=p.then(function(){ return sil("taksitler","id="+inliste(f.taksit.cikar)); });
  if(f.doviz.cikar.length)   p=p.then(function(){ return sil("doviz_aylar","id="+inliste(f.doviz.cikar)); });
  /* sonra eklemeler: üst tablolar önce */
  p=p.then(function(){ return upsert("ayarlar",f.ayarlar.ekle,"user_id"); });
  p=p.then(function(){ return upsert("doviz_aylar",f.doviz.ekle,"id"); });
  p=p.then(function(){ return upsert("taksitler",f.taksit.ekle,"id"); });
  p=p.then(function(){ return upsert("butce_aylar",f.bay.ekle,"id"); });
  p=p.then(function(){ return upsert("butce_kalemler",f.bkalem.ekle,"id"); });
  p=p.then(function(){ return upsert("odemeler",f.odeme.ekle,"id"); });
  p=p.then(function(){ return upsert("odeme_durum",f.oddurum.ekle,"odeme_id,yil,ay"); });
  p=p.then(function(){ return upsert("odeme_tutar",f.odtutar.ekle,"odeme_id,yil,ay"); });
  return p.then(function(){
    snap=yeni;
    var s=0; for(var k in f) s+=f[k].ekle.length+f[k].cikar.length;
    return s;
  });
}
function silCift(tablo,anahtarlar){
  var p=Promise.resolve();
  anahtarlar.forEach(function(a){
    var par=a.split("|"), k=parseInt(par[1],10);
    p=p.then(function(){ return sil(tablo,"odeme_id=eq."+encodeURIComponent(par[0])+"&yil=eq."+kYil(k)+"&ay=eq."+kAy(k)); });
  });
  return p;
}

/* ---------- dekont deposu ---------- */
function dosyaYukle(file){
  var ad=String(file.name||"dekont.pdf").replace(/[^\w.\-]+/g,"_");
  var yol=uid()+"/"+Date.now().toString(36)+"-"+ad;
  return token().then(function(t){
    return fetch(URL_+"/storage/v1/object/dekontlar/"+encodeURI(yol),{
      method:"POST",
      headers:{"apikey":KEY,"Authorization":"Bearer "+t,
               "Content-Type":file.type||"application/octet-stream","x-upsert":"true"},
      body:file});
  }).then(function(r){
    if(!r.ok) return r.text().then(function(t){ throw new Error("yükleme başarısız: "+t.slice(0,120)); });
    return {kind:"storage",path:yol,name:file.name||ad};
  });
}
function dosyaLink(yol){
  return token().then(function(t){
    return fetch(URL_+"/storage/v1/object/sign/dekontlar/"+encodeURI(yol),{
      method:"POST",
      headers:{"apikey":KEY,"Authorization":"Bearer "+t,"Content-Type":"application/json"},
      body:JSON.stringify({expiresIn:3600})});
  }).then(function(r){ return r.json(); }).then(function(j){
    if(!j||!j.signedURL) throw new Error("bağlantı alınamadı");
    return URL_+"/storage/v1"+j.signedURL;
  });
}
function dosyaSil(yol){
  return token().then(function(t){
    return fetch(URL_+"/storage/v1/object/dekontlar/"+encodeURI(yol),{
      method:"DELETE",headers:{"apikey":KEY,"Authorization":"Bearer "+t}});
  });
}

function sina(eposta){
  var m = eposta || MAIL;
  var sonuc={url:URL_, anahtar:KEY?(KEY.slice(0,18)+"… ("+KEY.length+" karakter)"):"YOK", eposta:m};
  return fetch(URL_+"/auth/v1/health",{headers:{"apikey":KEY,"Authorization":"Bearer "+KEY}})
    .then(function(r){ sonuc.health="HTTP "+r.status; return r.text(); })
    .then(function(t){ sonuc.healthYanit=String(t).slice(0,120); })
    .catch(function(e){ sonuc.health="ulaşılamadı: "+(e&&e.message||""); })
    .then(function(){
      return fetch(URL_+"/rest/v1/ayarlar?select=user_id&limit=1",
        {headers:{"apikey":KEY,"Authorization":"Bearer "+KEY}})
        .then(function(r){ sonuc.rest="HTTP "+r.status; return r.text(); })
        .then(function(t){ sonuc.restYanit=String(t).slice(0,160); })
        .catch(function(e){ sonuc.rest="ulaşılamadı: "+(e&&e.message||""); });
    })
    .then(function(){ return sonuc; });
}

        giris:giris, cikis:cikis, tazele:tazele, yukle:yukle, kaydet:kaydet,
        dosyaYukle:dosyaYukle, dosyaLink:dosyaLink, dosyaSil:dosyaSil};


/* ============================================================================

(function(){

  /* kendi stilini enjekte eder; sayfanın renk değişkenlerini kullanır */

  document.head.appendChild(st);

  var ov=document.createElement("div");

  var baslangicMail = kayitliMail || MAIL;

  ov.innerHTML=
    '<form class="giris-kutu" id="girisForm" autocomplete="on">'+
      '<div class="eyebrow">Birikim ve Bütçe Defteri</div>'+
      '<h2>Giriş Yap</h2>'+
      '<p>Verileriniz Supabase veritabanında uçtan uca güvenli olarak saklanmaktadır.</p>'+
      '<div class="field" style="margin-top:4px">'+
        '<label for="girisEmail" style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600">E-Posta</label>'+
        '<input type="email" id="girisEmail" value="'+attr(baslangicMail)+'" placeholder="ornek@domain.com" autocomplete="username" required>'+
      '</div>'+
      '<div class="field">'+
        '<label for="girisParola" style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600">Parola</label>'+
        '<input type="password" id="girisParola" placeholder="Parola" autocomplete="current-password" required>'+
      '</div>'+
      '<button class="btn" type="submit" id="girisBtn">Giriş Yap</button>'+
      '<button type="button" class="btn ghost sm" id="girisSina">Bağlantıyı sına</button>'+
      '<span class="giris-hata" id="girisHata"></span>'+
      '<span class="giris-ayrinti" id="girisAyrinti"></span>'+
    '</form>';
  document.body.appendChild(ov);

  /* Brute-force (kaba kuvvet saldırısı) koruması */
  var KILIT_KEY="defter-giris-kilit", DENEME_KEY="defter-giris-deneme";
  var kilitTimer=null;

  function kilitliMi(){
    try{
      var k=parseInt(localStorage.getItem(KILIT_KEY),10);
      if(k && k > Date.now()){
        return Math.ceil((k - Date.now()) / 1000);
      }
      localStorage.removeItem(KILIT_KEY);
    }catch(e){}
    return 0;
  }
  function basarisizKaydet(){
    try{
      var d=(parseInt(localStorage.getItem(DENEME_KEY),10)||0)+1;
      localStorage.setItem(DENEME_KEY,d);
      if(d>=5){
        localStorage.setItem(KILIT_KEY, Date.now() + 60000); // 60 sn kilit
        localStorage.removeItem(DENEME_KEY);
        return 60;
      }
    }catch(e){}
    return 0;
  }
  function basariliSifirla(){
    try{ localStorage.removeItem(DENEME_KEY); localStorage.removeItem(KILIT_KEY); }catch(e){}
    if(kilitTimer){ clearInterval(kilitTimer); kilitTimer=null; }
  }

  function kilitKontrol(){
    var sn=kilitliMi();
    var b=document.getElementById("girisBtn");
    if(sn>0){
      if(b) b.disabled=true;
      hata("Güvenlik: Çok fazla hatalı deneme yapıldı. Lütfen "+sn+" saniye bekleyin.");
      if(!kilitTimer){
        kilitTimer=setInterval(function(){
          var s=kilitliMi();
          if(s<=0){
            clearInterval(kilitTimer); kilitTimer=null;
            if(b) b.disabled=false;
            hata("");
          } else {
            hata("Güvenlik: Çok fazla hatalı deneme yapıldı. Lütfen "+s+" saniye bekleyin.");

        },1000);

    if(b && !b.getAttribute("data-loading")) b.disabled=false;

  function goster(v){
